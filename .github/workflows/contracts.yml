# Contract checks (规划/11 §4.1 「契约」; ADR-0001 §2): redocly lint, generated client drift and
# oasdiff breaking-change detection. Runs only when contract paths changed; `contracts-gate` is
# the required summary check and always reports.
# Written on 2026-10-01 without a GitHub remote: nothing in this file has run on GitHub yet.
# The npm package `oasdiff` is a placeholder (ADR-0001 §2): the official release binary is used.
#
# CT-06zzzzk (FU-CONTRACTS-DOWNLOAD-RETRY): #2849 went red on a curl 504 (exit 22) while downloading
# the oasdiff release, not on a contract finding. The release archive is now cached (actions/cache,
# keyed by the pinned version and its sha256) and the download is retried harder, with a bounded
# total time, as gitleaks.yml does (CT-06zzzzh). The contract comparison is not relaxed: whether the
# archive comes from the cache or from the download it is checked with `sha256sum -c` against
# OASDIFF_SHA256 first, and a mismatch fails the job (no re-download); a download that keeps
# failing fails the job; contracts-detect, the comparison (oasdiff range, how the base is taken,
# leaving out planned operations, --fail-on ERR) and contracts-gate are unchanged, and no `if:` or
# `continue-on-error` lets the comparison be skipped while the job stays green.
name: contracts

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# CT-06zy (D10-301): a newer run of the same pull request cancels the older one, as in ci.yml.
# A push to main gets a group of its own (its commit), so main runs neither cancel nor queue behind
# each other: each push is checked to the end.
concurrency:
  group: contracts-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contracts-detect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
      base: ${{ steps.diff.outputs.base }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Did contracts/ or packages/contracts-ts/ change
        id: diff
        run: |
          base=""
          if [ "$EVENT" = pull_request ]; then
            base="$PR_BASE_SHA"
          elif [ -n "$PUSH_BEFORE" ] && git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
            base="$PUSH_BEFORE"
          fi
          if [ -z "$base" ]; then
            # No usable base (first push): treat as changed, there is nothing to compare against.
            changed=true
          elif git diff --quiet "$base" HEAD -- contracts packages/contracts-ts; then
            changed=false
          else
            changed=true
          fi
          echo "base=${base} changed=${changed}"
          echo "changed=${changed}" >> "$GITHUB_OUTPUT"
          echo "base=${base}" >> "$GITHUB_OUTPUT"
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}

  contracts-check:
    needs: contracts-detect
    if: needs.contracts-detect.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OASDIFF_VERSION: 1.32.1
      OASDIFF_SHA256: 7c8939fc49b75ee11fec66a5b83b37a2fca6aee109fed85013b1ba2ac2a1ee7f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm contracts:check
      # The release archive itself is cached (not the unpacked binary), so the install checks it
      # with the same sha256 whatever its source. No restore-keys: only this exact release matches.
      - name: Cache the oasdiff release archive
        id: oasdiff-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/oasdiff-release/oasdiff_${{ env.OASDIFF_VERSION }}_linux_amd64.tar.gz
          key: oasdiff-${{ env.OASDIFF_VERSION }}-linux-amd64-${{ env.OASDIFF_SHA256 }}
      - name: Install oasdiff (official release binary, checksum verified)
        run: |
          set -euo pipefail
          if [ "$CACHE_HIT" = true ]; then
            echo "using the cached release archive"
          else
            url="https://github.com/oasdiff/oasdiff/releases/download/v${OASDIFF_VERSION}/oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz"
            mkdir -p "$(dirname "$ARCHIVE")"
            # 5xx, timeouts and connection errors are all retried, every attempt is bounded and
            # retrying stops after --retry-max-time; a download that never succeeds fails here.
            curl --fail --silent --show-error --location \
              --connect-timeout 20 --max-time 120 \
              --retry 8 --retry-all-errors --retry-delay 5 --retry-max-time 240 \
              --output "$ARCHIVE" "$url"
          fi
          # Cached or downloaded, the archive is verified before it is unpacked; a mismatch fails.
          echo "${OASDIFF_SHA256}  $ARCHIVE" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/oasdiff"
          tar -xzf "$ARCHIVE" -C "$RUNNER_TEMP/oasdiff" oasdiff
          "$RUNNER_TEMP/oasdiff/oasdiff" --version
        env:
          ARCHIVE: ${{ runner.temp }}/oasdiff-release/oasdiff_${{ env.OASDIFF_VERSION }}_linux_amd64.tar.gz
          CACHE_HIT: ${{ steps.oasdiff-cache.outputs.cache-hit }}
      - name: Breaking changes against the base contract
        run: |
          set -euo pipefail
          if [ -z "$BASE" ] || ! git cat-file -e "${BASE}:contracts/openapi.yaml" 2>/dev/null; then
            echo "::notice title=oasdiff::base has no contracts/openapi.yaml, nothing to compare"
            exit 0
          fi
          # A detached worktree keeps relative $ref targets of the base contract resolvable.
          git worktree add --detach "$RUNNER_TEMP/base-tree" "$BASE"
          # Operations still marked x-implementation: planned in the base have no route and no
          # caller, so they are left out of the comparison (tools/ci/oasdiff-base.ts; the
          # contract has no external $ref, so the JSON copy resolves on its own).
          node tools/ci/oasdiff-base.ts "$RUNNER_TEMP/base-tree/contracts/openapi.yaml" \
            "$RUNNER_TEMP/base-openapi.json"
          # Accepted changes, listed one by one with their ruling (D10-484): only response enum
          # values added that old clients cannot receive. Without the file nothing is ignored.
          ignore=()
          if [ -f contracts/oasdiff-accepted.txt ]; then
            ignore=(--err-ignore contracts/oasdiff-accepted.txt)
          fi
          "$RUNNER_TEMP/oasdiff/oasdiff" breaking --fail-on ERR "${ignore[@]}" \
            "$RUNNER_TEMP/base-openapi.json" contracts/openapi.yaml
        env:
          BASE: ${{ needs.contracts-detect.outputs.base }}

  contracts-gate:
    # Summary job: the only required check of this workflow (ops/branch-protection.json).
    if: always()
    needs: [contracts-detect, contracts-check]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Summarise
        run: |
          echo "contracts-detect=${DETECT} changed=${CHANGED} contracts-check=${CHECK}"
          [ "$DETECT" = success ] || exit 1
          if [ "$CHANGED" = true ]; then
            [ "$CHECK" = success ] || exit 1
          else
            [ "$CHANGED" = false ] || exit 1
            echo "::notice title=contracts-gate::n/a, contract paths unchanged"
          fi
        env:
          DETECT: ${{ needs.contracts-detect.result }}
          CHANGED: ${{ needs.contracts-detect.outputs.changed }}
          CHECK: ${{ needs.contracts-check.result }}
