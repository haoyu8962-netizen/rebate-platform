    if: ${{ !cancelled() && needs.verify-reuse.outputs.reuse != 'true' && needs.verify-reuse.outputs.moved != 'true' && needs.ledger-only-detect.outputs.only != 'true' }}
    runs-on: ubuntu-latest
    # As verify-int-1 (CT-06zzzzq; the history of this limit is there): 40 minutes, about 17–18
    # expected here with the tail and the other packages.
    timeout-minutes: 40
    services:
      redis:
        image: redis:7.4.11-alpine
        ports:
          - 127.0.0.1:6379:6379
        options: >-
          --tmpfs /data
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The tree this job tests (the PR merge commit, or the pushed commit): recorded before
      # anything runs, uploaded under that name only when every step passed (D10-242).
      - id: tested
        run: |
          tree=$(git rev-parse 'HEAD^{tree}')
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
          echo "$tree" > "$RUNNER_TEMP/verified-tree.txt"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
