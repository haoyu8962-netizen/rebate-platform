  # D10-692 follow-up (CT-06zzb, 2026-11-06): test:int alone took 4198–4409 s (70–73 minutes) in
  # the last green main runs against the 90-minute cap; 1618 of its 1624 files are @couli/spec-tests.
  # CT-06zzb split it into two jobs by `pnpm test:int -- --shard=i/2`; the two shards stayed
  # uneven (58:42 of the test time, verify-int-1 about 51 minutes, the long pole of the round).
  # D10-1222 (CT-06zzzzq, 2026-11-10; couli-runs/CI-shard/plan.md): six jobs, listed one by one
  # (not a matrix: verify-reuse matches each job by its name and its `verified-<job>-<tree>`
  # artifact, and ci-gate needs the result of each one, as with verify-props-1 / -2 / -3):
  #   verify-int-1 … -6  `pnpm test:int --log-order=stream --filter=@couli/spec-tests -- --shard=i/6`
  #   verify-int-4       also `pnpm test:int --log-order=stream --filter='!@couli/spec-tests'` once,
  #                      unsharded, plus the browser tests, the build smoke and db:check
  # Only @couli/spec-tests is sharded: its vitest sorts the files by the SHA-1 of their path and
  # cuts them into contiguous ranges, so for the same N the shards i/N (i = 1..N) are disjoint and
  # their union is the whole set (vitest BaseSequencer.shard). The other packages with test:int
  # (@couli/api with 5 int files, @couli/db with 2, and any package added later) are not: a shard
  # of 6 over 2 or 5 files leaves some shard empty, and with passWithNoTests false an empty shard
  # fails. They run once, together, by the negated filter, in verify-int-4, the lightest shard in
  # the simulation of the plan (§2.2: 45 / 38 / 30 / 25 / 29 / 28 minutes of test time), so the
  # tail (about 2.2 minutes) and the other packages (about 0.5) do not make it the long pole.
  # Each shard starts its own one-shot PostgreSQL (Testcontainers) and Redis (service).
  # All six are skipped when ledger-only-detect says only=true (D10-935, CT-06zzzv).
  # No test is dropped, nothing is allowed to fail. The local `pnpm verify`
  # (tools/ops/verify-container.sh) still runs the whole root test:int once, unsharded.
  # Balancing the shards by test time is FU-CI-SHARD-BALANCE, not done here.
  verify-int-1:
    # Needs Docker (Testcontainers starts the one-shot PostgreSQL): ubuntu-latest, never ubuntu-slim.
    # The one-shot Redis of the integration tests (TEST_REDIS_URL) is a service container with
    # the image of infra/local/compose.yaml and tools/ops/verify-container.sh, data on tmpfs only.
    # D10-242 (CT-06zm): skipped only when verify-reuse found a success of this very job on the
    # same tested tree (see verify-reuse), or when the PR head moved (moved=true, D10-1046 ②);
    # every other event, and any other failure of verify-reuse, runs it in full.
    needs: [verify-reuse, ledger-only-detect]
    if: ${{ !cancelled() && needs.verify-reuse.outputs.reuse != 'true' && needs.verify-reuse.outputs.moved != 'true' && needs.ledger-only-detect.outputs.only != 'true' }}
    runs-on: ubuntu-latest
    # 30 → 45 (2026-10-19, CT-06z): green in the 30 latest ci runs 17m05s–29m16s, p90 29m05s
    # (97% of the cap); 45 is the maximum with a 1.5× margin, rounded up to a multiple of 5.
    # 45 → 60 (2026-10-22, CT-06ze): #1173, #1190 and #1167 hit 45 minutes in the browser install
    # step after test:int had passed; the install now runs first and is cached (below).
    # 60 → 90 (2026-10-31, CT-06zza): test:int itself grew from 707 files / 8706 tests (#1190) to
    # 1283 files / 13760 tests; green runs on 10-30/31 took 35–59 minutes (four of eight sampled at
    # 58–59) and #2010 (run 41175931885) was cancelled at 60 after 56 minutes of passing test:int.
    # 90 is the 59-minute maximum with a 1.5× margin; splitting test:int into shards is CT-06zzb.
    # 90 → 60 (2026-11-06, CT-06zzb): with test:int halved each shard was expected near 37 minutes
    # plus about 5 of setup (and about 3 of browser tests, smoke and db:check in that job).
    # 60 → 40 (2026-11-10, CT-06zzzzq, D10-1222): six shards; the heaviest (this one) is expected
