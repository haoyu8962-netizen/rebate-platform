  # with the set-up of verify-int-1: Testcontainers starts the one-shot PostgreSQL, the one-shot
  # Redis is the same service and the same "Configure the one-shot Redis" step. It needs no verify
  # job, so it runs beside verify-int-1 … -6, and is skipped on a ledger-only pull request.
  # Not required yet: ci-gate neither needs nor judges it (red is visible, it does not block a
  # merge), and verify-reuse does not reuse it (no `verified-…` artifact). The orchestrator makes it
  # required once QA-03c is done and the job has stayed green (D10-1372). No scenario exists yet;
  # passWithNoTests stays false, so the step "Find replay scenarios" checks test/replay for any
  # *.test.ts and, when there is none, prints a notice and test:replay is skipped (D10-1389).
  verify-replay:
    # Needs Docker (Testcontainers starts the one-shot PostgreSQL): ubuntu-latest, never ubuntu-slim.
    needs: [ledger-only-detect]
    if: ${{ !cancelled() && needs.ledger-only-detect.outputs.only != 'true' }}
    runs-on: ubuntu-latest
    # No timing yet (no scenario); install and build take about 4 minutes in the int jobs.
    timeout-minutes: 30
    services:
      redis:
        image: redis:7.4.11-alpine
        ports:
          - 127.0.0.1:6379:6379
