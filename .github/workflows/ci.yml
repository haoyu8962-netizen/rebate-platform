            exit 1
          fi
        env:
          REDIS_ID: ${{ job.services.redis.id }}
      - if: steps.scenarios.outputs.present == 'true'
        run: pnpm --filter @couli/spec-tests run test:replay
        env:
          TEST_REDIS_URL: redis://127.0.0.1:6379/0

  guard-git:
    # Git-dependent guards run from the BASE copy of tools/guard against the PR tree, so a branch
    # cannot weaken the guards that judge it (规划/11 §2.4, §8). A change to this job's script
    # therefore takes effect only once it is on the base branch.
    # Owner approval (owner decision 2026-10-02): with the label `owner-approved-<first 12 chars
    # of the head sha>` added by the repository owner account (the same check as the
    # protected-paths workflow, tools/guard/lib/owner-approval.mjs), protected-paths problems and
    # changed add-only test assets are reported as warnings; every other guard still fails.
    # Task branches (owner decision 2026-10-02, ops/approvals.yaml id 14): the path guard starts
    # at the spec_commit of ops/evidence/<id>.json once it is verified to lie between the base and
    # the head; the commits before it are checked as the rule-test author's (path-guard-author).
    # Without a usable spec_commit it starts at the base, as before.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out the PR head with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          path: pr
          persist-credentials: false
      - name: Check out the base branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: base/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: base/.nvmrc
          package-manager-cache: false
      - name: Install the base copy's dependencies
        working-directory: base
        run: pnpm install --frozen-lockfile
      - name: Run the base copy's guards against the PR tree
        run: |
          if [ ! -f base/tools/guard/run.ts ]; then
            echo "::error::base branch has no tools/guard/run.ts; the guards cannot run"
            exit 1
          fi
          set -- git --base "$BASE_SHA" --cwd "$GITHUB_WORKSPACE/pr" --pr-number "$PR_NUMBER"
          case "$HEAD_REF" in
            task/*)
              task_id="${HEAD_REF#task/}"
              if ! printf '%s' "$task_id" | grep -Eq '^[A-Za-z0-9._-]+$'; then
                echo "::error::branch name does not carry a valid task id"
                exit 1
              fi
              set -- "$@" --task "$task_id"
              ;;
          esac
          node base/tools/guard/run.ts "$@"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}

  ci-gate:
    # Summary job: the only required check of this workflow (ops/branch-protection.json).
    # CT-06zx: verify-static, verify-unit, verify-spec-1 and verify-spec-2 replace verify-fast;
    # each must pass (or be reused) on its own; so must verify-props-1 / -2 / -3 and
    # verify-props-sha-1 / -2 / -3 (CT-06zxa, split into one pass per job by D10-902 / CT-06zzzr),
    # and verify-int-1 … verify-int-6 (two shards since CT-06zzb, six since CT-06zzzzq / D10-1222).
    # D10-935 (CT-06zzzv): a skipped heavy job (all fifteen but verify-static) also passes when
    # ledger-only-detect itself succeeded on a pull_request event and said exactly only=true: the
    # pull request changes nothing but task ledgers or docs (docs/**, D10-1024 E). A failed, cancelled or skipped detection, or
    # any other output, never lets a skip pass; verify-static and guard-git are not covered by it.
    # The reuse rule and the push rule are unchanged.
    if: always()
    needs:
      - verify-static
      - verify-unit
      - verify-spec-1
      - verify-spec-2
      - verify-props-1
      - verify-props-2
      - verify-props-3
      - verify-props-sha-1
      - verify-props-sha-2
      - verify-props-sha-3
      - verify-int-1
      - verify-int-2
      - verify-int-3
      - verify-int-4
      - verify-int-5
      - verify-int-6
      - guard-git
      - verify-reuse
      - ledger-only-detect
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Summarise
        run: |
          echo "verify-static=${STATIC} verify-unit=${UNIT} verify-spec-1=${SPEC1} verify-spec-2=${SPEC2} verify-props-1=${PROPS1} verify-props-2=${PROPS2} verify-props-3=${PROPS3} verify-props-sha-1=${PROPSSHA1} verify-props-sha-2=${PROPSSHA2} verify-props-sha-3=${PROPSSHA3} verify-int-1=${INT1} verify-int-2=${INT2} verify-int-3=${INT3} verify-int-4=${INT4} verify-int-5=${INT5} verify-int-6=${INT6} guard-git=${GUARD} event=${EVENT} reuse=${REUSE_RESULT}/${REUSE} ledger-only-detect=${LEDGER_RESULT}/${LEDGER_ONLY}"
          # A verify job passes when it succeeded, or (label event, D10-242; push to main,
          # D10-1024 B2) when verify-reuse itself succeeded and found its success on the same
          # tested tree, so it was skipped.
          reused() { [ "$REUSE_RESULT" = success ] && [ "$REUSE" = true ] && [ "$1" = skipped ]; }
          # A heavy job (not verify-static) also passes when it was skipped because the pull
          # request changes only task ledgers or docs: ledger-only-detect succeeded and said
          # only=true (D10-935, CT-06zzzv; docs/** since D10-1024 E, CT-06zzzze).
          ledger_only() {
            [ "$EVENT" = pull_request ] && [ "$LEDGER_RESULT" = success ] &&
              [ "$LEDGER_ONLY" = true ] && [ "$1" = skipped ]
          }
          [ "$STATIC" = success ] || reused "$STATIC" || exit 1
          [ "$UNIT" = success ] || reused "$UNIT" || ledger_only "$UNIT" || exit 1
          [ "$SPEC1" = success ] || reused "$SPEC1" || ledger_only "$SPEC1" || exit 1
          [ "$SPEC2" = success ] || reused "$SPEC2" || ledger_only "$SPEC2" || exit 1
          [ "$PROPS1" = success ] || reused "$PROPS1" || ledger_only "$PROPS1" || exit 1
          [ "$PROPS2" = success ] || reused "$PROPS2" || ledger_only "$PROPS2" || exit 1
          [ "$PROPS3" = success ] || reused "$PROPS3" || ledger_only "$PROPS3" || exit 1
          [ "$PROPSSHA1" = success ] || reused "$PROPSSHA1" || ledger_only "$PROPSSHA1" || exit 1
          [ "$PROPSSHA2" = success ] || reused "$PROPSSHA2" || ledger_only "$PROPSSHA2" || exit 1
          [ "$PROPSSHA3" = success ] || reused "$PROPSSHA3" || ledger_only "$PROPSSHA3" || exit 1
          [ "$INT1" = success ] || reused "$INT1" || ledger_only "$INT1" || exit 1
          [ "$INT2" = success ] || reused "$INT2" || ledger_only "$INT2" || exit 1
          [ "$INT3" = success ] || reused "$INT3" || ledger_only "$INT3" || exit 1
          [ "$INT4" = success ] || reused "$INT4" || ledger_only "$INT4" || exit 1
          [ "$INT5" = success ] || reused "$INT5" || ledger_only "$INT5" || exit 1
          [ "$INT6" = success ] || reused "$INT6" || ledger_only "$INT6" || exit 1
          if [ "$EVENT" = pull_request ]; then
            [ "$GUARD" = success ] || exit 1
          else
            [ "$GUARD" = skipped ] || [ "$GUARD" = success ] || exit 1
          fi
        env:
          STATIC: ${{ needs.verify-static.result }}
          UNIT: ${{ needs.verify-unit.result }}
          SPEC1: ${{ needs.verify-spec-1.result }}
          SPEC2: ${{ needs.verify-spec-2.result }}
          PROPS1: ${{ needs.verify-props-1.result }}
          PROPS2: ${{ needs.verify-props-2.result }}
          PROPS3: ${{ needs.verify-props-3.result }}
          PROPSSHA1: ${{ needs.verify-props-sha-1.result }}
          PROPSSHA2: ${{ needs.verify-props-sha-2.result }}
          PROPSSHA3: ${{ needs.verify-props-sha-3.result }}
          INT1: ${{ needs.verify-int-1.result }}
          INT2: ${{ needs.verify-int-2.result }}
          INT3: ${{ needs.verify-int-3.result }}
          INT4: ${{ needs.verify-int-4.result }}
          INT5: ${{ needs.verify-int-5.result }}
          INT6: ${{ needs.verify-int-6.result }}
          GUARD: ${{ needs.guard-git.result }}
          REUSE_RESULT: ${{ needs.verify-reuse.result }}
          REUSE: ${{ needs.verify-reuse.outputs.reuse }}
          EVENT: ${{ github.event_name }}
          LEDGER_RESULT: ${{ needs.ledger-only-detect.result }}
          LEDGER_ONLY: ${{ needs.ledger-only-detect.outputs.only }}
