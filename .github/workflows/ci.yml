    services:
      redis:
        image: redis:7.4.11-alpine
        ports:
          - 127.0.0.1:6379:6379
        options: >-
          --tmpfs /data
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The tree this job tests (the PR merge commit, or the pushed commit): recorded before
      # anything runs, uploaded under that name only when every step passed (D10-242).
      - id: tested
        run: |
          tree=$(git rev-parse 'HEAD^{tree}')
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
          echo "$tree" > "$RUNNER_TEMP/verified-tree.txt"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # A service container takes no command, so the redis-server settings of
      # infra/local/compose.yaml (no RDB, no AOF, noeviction with an explicit limit;
      # ADR-0001 §4.2 #17) are applied at run time.
      - name: Configure the one-shot Redis
        run: |
          reply="$(docker exec "$REDIS_ID" redis-cli CONFIG SET save '' appendonly no maxmemory 256mb maxmemory-policy noeviction)"
          if [ "$reply" != OK ]; then
            echo "::error::CONFIG SET on the one-shot Redis replied: ${reply}"
            exit 1
          fi
          # From the runner, the way the tests connect (TEST_REDIS_URL): the published port answers.
          pong=''
          if exec 3<>/dev/tcp/127.0.0.1/6379; then
            printf 'PING\r\n' >&3
            IFS= read -r -t 5 pong <&3 || true
            exec 3>&-
