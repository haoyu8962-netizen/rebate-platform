          node-version-file: .nvmrc
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Browser tests (F1-01j, test/vitest.browser.config.ts): the Chromium of the playwright the
      # lockfile pins (the test package's own CLI, so the version follows pnpm-lock.yaml) with its
      # system libraries, and the Noto CJK fonts the verify image has, so Chinese text renders
      # with the same glyphs as in tools/ops/verify-container.sh. Installed before test:int
      # (CT-06ze, 2026-10-22) so a slow install fails fast instead of after the integration
      # tests; the browser download is cached per playwright version, the system libraries and
      # fonts come from apt, their .deb files cached per runner image (CT-06zxb).
      - name: Read the pinned playwright version
        id: playwright
        run: |
          version="$(pnpm --filter @couli/spec-tests exec playwright --version | awk '{print $2}')"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::unexpected playwright --version output: ${version}"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: Cache the playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium
      # D10-308 (CT-06zxb): the apt downloads of the next step are cached as .deb files. Two
      # verify-int runs (#1451, #1452, 2026-10-23) were cut at 60 minutes after this step took
      # 34–37 minutes: the Azure Ubuntu mirror fell to ~40 kB/s and fonts-noto-cjk (61 MB) stalled
      # for 23 minutes before a retry. The key is the runner image (ImageOS / ImageVersion) and a
      # hash of the package list (fonts-noto-cjk plus playwright's chromium dependencies, which
      # follow the pinned playwright version); a hit means apt finds the .deb files and downloads
      # nothing it already has.
      - name: Read the runner image for the apt cache
        id: apt-key
        run: |
          echo "image=${ImageOS:-unknown}-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
          echo "packages=$(printf 'fonts-noto-cjk playwright-%s-chromium-deps' "$PLAYWRIGHT" | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
        env:
          PLAYWRIGHT: ${{ steps.playwright.outputs.version }}
      - name: Restore the apt .deb cache
        id: apt-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-archives/*.deb
          key: apt-debs-${{ steps.apt-key.outputs.image }}-${{ steps.apt-key.outputs.packages }}
      # apt (and the apt-get that `playwright install-deps` runs) reads its options from an
      # apt.conf.d file: downloads go to ~/apt-archives and are kept; a download that receives
      # nothing for 30 s is dropped and retried up to 5 times (a slow but moving download is not
      # cut by this; the prefetch wrapper below, the cache and the step limit bound it). The step has
      # its own 10-minute limit so a mirror that stays slow fails the job early (rerun it) instead of
      # eating the job's time limit: a run where this step alone took 10–25 minutes used to pass and
      # now fails, by design; `apt-get update` is not cached and counts against the same 10 minutes.
      # The job limit and the tests are unchanged.
      - name: Install Chromium and the CJK fonts for the browser tests
        id: apt-install
        timeout-minutes: 10
        run: |
          mkdir -p "$HOME/apt-archives/partial"
          printf '%s\n' \
            'Acquire::http::Timeout "30";' \
            'Acquire::https::Timeout "30";' \
            'Acquire::Retries "5";' \
            "Dir::Cache::Archives \"$HOME/apt-archives\";" \
            'APT::Keep-Downloaded-Packages "true";' \
            'Binary::apt::APT::Keep-Downloaded-Packages "true";' \
            | sudo tee /etc/apt/apt.conf.d/99couli-ci > /dev/null
          # A slow but moving download is not cut by the timeout above (the first run of this
          # change stalled 10 minutes on fonts-noto-cjk with nothing cached yet). So, for this step
          # only, `apt-get install` (ours, and the `sudo apt-get` playwright runs: sudo's
          # secure_path puts /usr/local/sbin first) goes through a wrapper that first fetches the
          # .deb files with curl, drops a mirror that stays under 300 kB/s for 15 s and tries the
          # next Ubuntu mirror, then runs the real apt-get, which downloads whatever it still lacks.
          # apt only compares the size of a file already in its archive directory, so the wrapper
          # itself checks every prefetched file against the size and hash apt takes from the signed
          # index (size from --print-uris, SHA256 from apt-cache show of the same Filename); a mismatch
          # is deleted and the next mirror tried, and a file without a SHA256 there is left to apt.
          trap 'sudo rm -f /usr/local/sbin/apt-get' EXIT
          sudo tee /usr/local/sbin/apt-get > /dev/null <<'WRAPPER'
          #!/bin/bash
          eval "$(/usr/bin/apt-config shell ARCH Dir::Cache::archives/d)"
          ARCH=${ARCH%/}
          case " $* " in
            *" install "*)
              /usr/bin/apt-get --print-uris -qq "$@" 2>/dev/null | while read -r uri file size _; do
                uri=${uri//\'/}
                path=${uri#*://*/ubuntu/}
                [ "$path" != "$uri" ] || continue
                [ -s "$ARCH/$file" ] && continue
                # --print-uris gives MD5 on this runner; the SHA256 comes from the same signed index entry.
                name=${file%%_*}
                version=${file#*_}
                version=${version%_*}
                version=${version//%3a/:}
                # The URI is %-escaped (+ ~), the index Filename is not.
                filename=$(printf '%b' "${path//%/\\x}")
                want=$(/usr/bin/apt-cache show "$name=$version" 2>/dev/null \
                  | awk -v f="$filename" '/^Filename: /{m=($2==f)} m&&/^SHA256: /{print $2; exit}')
                if [ -z "$want" ]; then
                  echo "no SHA256 in the index for $file; left to apt" >&2
                  continue
                fi
                for base in "${uri%%/ubuntu/*}/ubuntu" http://archive.ubuntu.com/ubuntu http://security.ubuntu.com/ubuntu http://mirrors.edge.kernel.org/ubuntu; do
                  if curl -fsSL --connect-timeout 10 --speed-limit 300000 --speed-time 15 -o "$ARCH/partial/$file" "$base/$path" \
                    && [ "$(stat -c %s "$ARCH/partial/$file")" = "$size" ] \
                    && [ "$(sha256sum "$ARCH/partial/$file" | cut -d' ' -f1)" = "$want" ]; then
                    mv "$ARCH/partial/$file" "$ARCH/$file"
                    echo "prefetched $file from $base"
                    break
                  fi
                  rm -f "$ARCH/partial/$file"
                  echo "slow, failed or not matching the index: $base for $file" >&2
                done
              done
              ;;
          esac
          exec /usr/bin/apt-get "$@"
          WRAPPER
          sudo chmod 755 /usr/local/sbin/apt-get
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          if [ "$CACHE_HIT" = true ]; then
            pnpm --filter @couli/spec-tests exec playwright install-deps chromium
          else
            pnpm --filter @couli/spec-tests exec playwright install --with-deps chromium
          fi
          sudo chmod -R a+rX "$HOME/apt-archives"
          debs=$(find "$HOME/apt-archives" -maxdepth 1 -name '*.deb' | wc -l)
          echo "apt .deb files kept: ${debs}"
          echo "debs=${debs}" >> "$GITHUB_OUTPUT"
        env:
          CACHE_HIT: ${{ steps.playwright-cache.outputs.cache-hit }}
      # Saved right after the install, so a later test failure still keeps the cache; skipped on an
      # exact hit (the key exists already) and when apt kept no .deb file (a save of nothing fails).
      - name: Save the apt .deb cache
        if: ${{ steps.apt-cache.outputs.cache-hit != 'true' && steps.apt-install.outputs.debs != '0' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-archives/*.deb
          key: apt-debs-${{ steps.apt-key.outputs.image }}-${{ steps.apt-key.outputs.packages }}
      # A service container takes no command, so the redis-server settings of
      # infra/local/compose.yaml (no RDB, no AOF, noeviction with an explicit limit;
      # ADR-0001 §4.2 #17) are applied at run time.
      - name: Configure the one-shot Redis
        run: |
          reply="$(docker exec "$REDIS_ID" redis-cli CONFIG SET save '' appendonly no maxmemory 256mb maxmemory-policy noeviction)"
          if [ "$reply" != OK ]; then
            echo "::error::CONFIG SET on the one-shot Redis replied: ${reply}"
            exit 1
          fi
          # From the runner, the way the tests connect (TEST_REDIS_URL): the published port answers.
          pong=''
          if exec 3<>/dev/tcp/127.0.0.1/6379; then
            printf 'PING\r\n' >&3
            IFS= read -r -t 5 pong <&3 || true
            exec 3>&-
          fi
          if [ "${pong%$'\r'}" != '+PONG' ]; then
            echo "::error::the one-shot Redis does not answer PING on 127.0.0.1:6379 (got: ${pong})"
            exit 1
          fi
        env:
          REDIS_ID: ${{ job.services.redis.id }}
      # PROP_RUNS (D10-210, CT-06zg): the property cases inside the integration tests read their run
      # count from PROP_RUNS (some scale it, e.g. test/spec/agent/stream-finalize/model.prop.int.test.ts
      # runs max(20, PROP_RUNS / 100)). 2000 is the long-run tier of their design (PR 200 / long run
      # 2000, test/spec/ledger/posting/properties.int.test.ts). Unset, they fell to the
      # @couli/testing default of 10000, which was not a choice ([AC-B2-02f#23] alone took 783 s).
      # verify-props and longrun-props keep their own run counts.
      # The root `test:int` script (`turbo run test:int --env-mode=loose`), limited by turbo's
      # --filter to @couli/spec-tests; turbo appends what follows `--` (the shard) to that
      # package's script, `vitest run` (CT-06zzb; one package only since CT-06zzzzq, see above).
      # --log-order=stream (CT-06zzzj, orchestrator 11-06 14:29): the output reaches the log line
      # by line instead of when the package finishes, so a cancelled or timed-out shard still
      # shows where it was.
      - run: pnpm test:int --log-order=stream --filter=@couli/spec-tests -- --shard=4/6
        env:
          TEST_REDIS_URL: redis://127.0.0.1:6379/0
          PROP_RUNS: '2000'
      # The same root script for every package but @couli/spec-tests (turbo's negated --filter):
      # @couli/api, @couli/db and any package added later, once and with no shard (CT-06zzzzq).
      - run: pnpm test:int --log-order=stream --filter='!@couli/spec-tests'
        env:
          TEST_REDIS_URL: redis://127.0.0.1:6379/0
          PROP_RUNS: '2000'
      # D10-253 (CT-06zn): the browser tests failed now and then on their first files with "Failed
      # to fetch dynamically imported module"; the requests died with net::ERR_NETWORK_CHANGED.
      # After test:int, testcontainers (Ryuk) removes the one-shot containers and their networks
      # asynchronously, and Chromium aborts in-flight requests when it sees the host's links
      # change. So wait until no testcontainers container or network is left (at most 120 s; on
      # timeout list what is left and go on), then until two `ip -o link` samples 2 s apart are
      # equal, whole lines (state and flags too; at most 60 s). No retry, no test change.
      - name: Wait for the integration containers and the host network to settle
        timeout-minutes: 5
        run: |
          left=''
          for _ in $(seq 1 60); do
            left="$(docker ps -aq --filter label=org.testcontainers=true)$(docker network ls -q --filter label=org.testcontainers=true)"
            [ -z "$left" ] && break
            sleep 2
          done
          if [ -n "$left" ]; then
            echo "::warning::testcontainers objects still present after 120 s:"
            docker ps -a --filter label=org.testcontainers=true
            docker network ls --filter label=org.testcontainers=true
          fi
          prev=''
          settled=''
          for _ in $(seq 1 30); do
            cur="$(ip -o link | sort)"
            if [ -n "$prev" ] && [ "$cur" = "$prev" ]; then settled=yes; break; fi
            prev="$cur"
            sleep 2
          done
          [ -n "$settled" ] || echo "::warning::host links still changing after 60 s"
          echo "host links:"
          echo "$cur"
      - run: pnpm --filter @couli/spec-tests run test:browser
      # CT-06zzzl (DSX-50, orchestrator 11-06 18:5x): the screenshot-baseline report of the browser
      # tests (per-page difference percentages, report only, D10-724 ③) is kept as a CI artifact.
      # DSX-50 writes it under test/.tmp/visual-baseline/; uploaded whether the browser tests passed
      # or not (not when the run is cancelled); nothing there yet is not an error (before DSX-50).
      # A separate artifact name, so verify-reuse's verified-<job>-<tree> records are untouched.
      - name: Upload the screenshot-baseline report (DSX-50)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-baseline-report-${{ steps.tested.outputs.tree }}-${{ github.run_attempt }}
          path: test/.tmp/visual-baseline/
          retention-days: 14
          if-no-files-found: ignore
      # Build smoke (F1-01k, test/vitest.build-smoke.config.ts): builds the H5 entries (APP_ENV=test)
      # and the admin console into a temporary directory, serves each on 127.0.0.1 and opens it in
      # the same Chromium (playwright library): first screen, initial-JS budgets, no jsxDEV.
      # Screenshots stay in test/.tmp/build-smoke/screenshots/ on the runner.
      - run: pnpm --filter @couli/spec-tests run test:smoke
      - run: pnpm db:check
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-verify-int-4-${{ steps.tested.outputs.tree }}
          # The artifact name is the record (job and tested tree); the file only holds the tree id,
          # written by the `tested` step (upload-artifact skips dot-files such as .nvmrc by default).
          path: ${{ runner.temp }}/verified-tree.txt
          retention-days: 7
