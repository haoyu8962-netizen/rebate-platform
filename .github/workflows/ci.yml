  verify-int-4:
    # Same as verify-int-1, shard 4/6 of @couli/spec-tests (CT-06zzzzq, D10-1222), and the
    # lightest one, so it also runs the test:int of every other package once, unsharded (the
    # negated filter), then the browser tests, the build smoke and db:check that were in
    # verify-int-1 before. Skipped only when verify-reuse found a success of this very job on
    # the same tested tree (D10-242), when the PR head moved, or on a ledger-only pull request.
