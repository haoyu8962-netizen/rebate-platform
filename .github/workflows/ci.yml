# Base checks for every pull request and every push to main (规划/11 §3.2, §4.1, §4.2).
# Written on 2026-10-01 without a GitHub remote: nothing in this file has run on GitHub yet.
# TODO(规划/11 §9.3 #10): first run on a real runner, then back-fill the timings — blocked on GitHub remote.
#
# Rules for every workflow in this repo (checked by tools/ci/check-workflows.ts):
#   - no workflow-level `paths` filters; path-conditional work uses a job-level `if` plus an
#     `if: always()` summary job, and only summary jobs are required checks;
#   - job ids are unique across all workflows and jobs carry no `name:`, so the check context
#     equals the job id;
#   - every action is pinned to a full commit SHA with a version comment.
#   - every job runs on ubuntu-latest, except the jobs listed in SELF_HOSTED_JOBS of
#     check-workflows.ts (ADR-0004, today verify-props-sha-1 / -2 / -3), which use the one fixed
#     routing expression: LAN runner only when the repository variable SELF_HOSTED_CI is 'on',
#     ubuntu-latest otherwise; such jobs stay read-only and use no secrets.
#
# Ledger-only fast path (D10-935, CT-06zzzv; docs/** too since D10-1024 E, CT-06zzzze): on a pull
# request whose base...head changes nothing but task ledgers (ops/tasks/<id>.yaml) or docs
# (docs/**), as decided by ledger-only-detect from the base copy of tools/ci/ledger-only.ts, the
# fifteen heavy verify jobs are skipped; verify-static (with the task ledger check) and guard-git
# still run, and ci-gate accepts those skips only when the detection itself succeeded and said
# only=true.
#
# Replay tests (D10-1372, CT-06zzzzza): verify-replay runs `test:replay` (test/replay) beside the
# verify-int jobs. It is not a required check yet: ci-gate does not need or judge it, and
# verify-reuse and the ledger-only path's job lists do not name it (it is still skipped on a
# ledger-only pull request). It becomes required after QA-03c, once stable.
name: ci

on:
  pull_request:
    # labeled / unlabeled: guard-git reads the owner approval label, so the check reruns when it
    # is added or removed; the verify jobs then reuse an earlier pass on the same tested tree
    # (verify-reuse, D10-242).
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

permissions:
  contents: read

# Concurrency (D10-1024, CT-06zzzze; ci-load-plan §2 A / B1). Sampled 2026-11-08: 42 of 50 runs
# were cancelled, about 90% of the job minutes.
#   A: labeled / unlabeled events get a group of their own, ci-<ref>-label, so a label event no
#      longer cancels the code run of the same ref (opened / synchronize / reopened, ci-<ref>);
#      its verify-reuse waits, with a limit, for that run to finish and then reuses its pass (see
#      verify-reuse). A newer label event still cancels an older label run. A label run whose PR
#      head moves meanwhile ends early, red on the old head only (D10-1046 ②, CT-06zzzzj).
#   B1: a push to main is never cancelled (cancel-in-progress false): the running pass finishes,
#      GitHub keeps only the latest pending push. Pull request events still cancel the older run.
concurrency:
  group: ci-${{ github.ref }}${{ (github.event.action == 'labeled' || github.event.action == 'unlabeled') && '-label' || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# 2026-11-01 (CT-06zzv): `tsc -b` (verify-static typecheck) and `pnpm build` (verify-unit and
# verify-int, now verify-int-1 … -6) ran out of the default Node heap (about 4 GB): #2109 logged
# "FATAL ERROR: heap out of memory", and #2108 / #2110 / #2111 failed the same way at once; the
# same trunk passes tsc with 8 GB locally.
# ubuntu-latest for a public repository has 4 vCPUs and 16 GB, and the flag is only a ceiling.
env:
  NODE_OPTIONS: --max-old-space-size=8192

jobs:
  verify-reuse:
    # D10-242 (CT-06zm): an owner-approval label added or removed changes no code, so on a
    # labeled / unlabeled event the verify jobs reuse what already passed instead of running a
    # second time. Reuse holds only when, for EACH of verify-static, verify-unit, verify-spec-1,
    # verify-spec-2 (the four jobs that replaced verify-fast, CT-06zx), verify-props-1,
    # verify-props-2, verify-props-3, verify-props-sha-1, verify-props-sha-2, verify-props-sha-3
    # (the fixed-seed and commit-SHA-seed passes, three shards each, that replaced verify-props,
    # CT-06zxa, D10-902 / CT-06zzzr), and verify-int-1 … verify-int-6 (the shards that replaced
    # verify-int: two since CT-06zzb, six since CT-06zzzzq / D10-1222), an
    # earlier run of this workflow file (ci.yml) for the same PR head SHA has that job's latest
    # attempt concluded `success` AND carries the artifact `verified-<job>-<tree>` that the job
    # uploads only after all of its steps passed, <tree> being the tree it tested. The tree of
    # this event's checkout (the PR merge commit as of now) must equal it, so a base branch that
    # moved since then (a different merge result) means a full run; failed, cancelled or skipped
    # jobs never count. Any other event, a missing record or an API error: reuse is not output and
    # everything runs as before. guard-git and the other workflows still run on label events.
    # D10-935 (CT-06zzzv): a ledger-only pull request skipped the heavy jobs, so it has no
    # `verified-<job>-<tree>` record of them and reuse is false on its label events: the heavy jobs
    # are skipped again by ledger-only-detect, but verify-static may run a second time. That is the
    # known cost of the fast path.
    # D10-1024 A (CT-06zzzze): label events have a concurrency group of their own and no longer
    # cancel the code run of the same ref, so that run is often still going (or queued) when the
    # label run starts. Before deciding, this job waits for every OTHER ci.yml run on the same PR
    # head SHA whose status is not `completed` (other workflows and other heads are not waited
    # for), polling every REUSE_POLL_SECONDS (60) up to REUSE_WAIT_SECONDS (3600, the ledger's 60
    # minutes, by the shell's wall clock). Once none is unfinished it decides by the rule above,
    # unchanged;
    # with nothing unfinished it decides at once, without sleeping. When the limit is reached
    # first, reuse=false (even if an earlier pass exists): every job runs in full. A run that
    # finished failed or cancelled simply does not count, so that also means a full run. Only
    # `gh api ... --jq` is used (gh's built-in jq, no separate jq binary; not `gh run watch`, which
    # has no limit of its own). timeout-minutes 70 leaves ten minutes beyond the wait for checkout
    # and the API calls; a timeout or API error leaves reuse unset, so everything runs as before.
    # A push to the PR does not cancel a label run (different group); it cancels the code run of
    # the old head, so the label run would find no pass there and run in full for the old head,
    # whose checks do nothing for the new head. D10-1046 ② (CT-06zzzzj,
    # FU-CI-LABEL-RUN-STALE-HEAD): on a label event the find step therefore also reads the PR's
    # current head (`pulls/<github.event.pull_request.number>`, head.sha) in every round of the
    # wait, right after the run-list query: so once more when nothing is left unfinished (before
    # deciding) and before giving up at the limit. When it answers a head other than this event's
    # head.sha, the step logs "PR #<n> head moved from <old> to <new>", writes moved=true and
    # exits 1 at once (no further sleep or query, never reuse=true). verify-static and the fifteen
    # heavy jobs then skip by `needs.verify-reuse.outputs.moved != 'true'` in their `if` (GitHub
    # keeps the outputs a step wrote before it failed, and passes a failed job's outputs on), and
    # ci-gate is red, on the old head only; the new head has a run of its own. A failed query (gh
    # exits non-zero) or an answer that is not a 40-hex sha counts as "not moved": the old rule
    # goes on, and the next round asks again. A verify-reuse that fails any other way writes no
    # moved, so every job still runs. The push path (B2) and the code events never read it.
    # D10-1024 B2 (CT-06zzzzf; ci-load-plan §2 B2): since B1 every push to main runs to the end,
    # about 200 more job minutes per merge. On a push to main this job therefore also looks for
    # the passes of the pull request that produced the pushed commit, and reuses them only when
    # ALL of the following hold: (1) `commits/<pushed sha>/pulls` lists exactly one pull request
    # that is merged (merged_at set), has base main in this repository, and whose head repository
    # is this repository by full_name (head.repo.full_name == github.repository; a null head
    # repository does not count); (2) on that pull request's final head H, a ci.yml run with event
    # pull_request whose head_repository.full_name is this repository has the job's latest attempt
    # concluded `success`; (3) that same run carries an unexpired artifact
    # `verified-<job>-<tree>` whose <tree> is exactly (string equality, no prefix) the tree of the
    # pushed commit's checkout. All sixteen jobs must be found, or reuse=false and every job runs.
    # Every run on H is looked at, not only the newest (a label run on H has its verify jobs
    # skipped and no artifacts). A fork, a different tree, an expired or missing artifact, a job
    # whose latest attempt did not pass, zero or several matching pull requests, or any API error:
    # reuse=false (exit 0), the whole round runs in full. The push path never takes the wait above
    # (it is for label events only) and never sleeps. ci-gate, its decision and the required
    # check names are unchanged: on a push it accepts a skipped job only when this job succeeded
    # with reuse=true, as on a label event. pull-requests: read is for the commit-to-PR lookup.
    # Known effect: a reused verify-props-sha-* pass ran with the seed of H, not of the pushed
    # commit.
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' &&
      (github.event.action == 'labeled' || github.event.action == 'unlabeled'))
    runs-on: ubuntu-latest
    timeout-minutes: 70
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      reuse: ${{ steps.find.outputs.reuse }}
      moved: ${{ steps.find.outputs.moved }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: find
        run: |
          set -euo pipefail
          tree=$(git rev-parse 'HEAD^{tree}')
          if [ "$EVENT_NAME" = push ]; then
            # D10-1024 B2: a push to main reuses the passes of the merged pull request it came
            # from (see the comment of this job). One pass, no waiting; anything else runs in full.
            echo "push to main: commit $PUSH_SHA, tree $tree"
            full() {
              echo "$1: every job runs in full"
              echo "reuse=false" >> "$GITHUB_OUTPUT"
              exit 0
            }
            jobs='verify-static verify-unit verify-spec-1 verify-spec-2 verify-props-1 verify-props-2 verify-props-3 verify-props-sha-1 verify-props-sha-2 verify-props-sha-3 verify-int-1 verify-int-2 verify-int-3 verify-int-4 verify-int-5 verify-int-6'
            # (1) exactly one merged pull request into main of this repository, from this repository.
            prs=$(gh api "repos/$REPO/commits/$PUSH_SHA/pulls?per_page=100" \
              --jq ".[] | select(.merged_at != null and .base.ref == \"main\" and .base.repo.full_name == \"$REPO\" and .head.repo != null and .head.repo.full_name == \"$REPO\") | \"\(.number) \(.head.sha)\"") ||
              full "the pull request of $PUSH_SHA could not be read"
            # shellcheck disable=SC2086 # one "<number> <head sha>" line per matching pull request
            set -- $prs
            [ "$#" -eq 2 ] || full "not exactly one merged pull request of this repository into main for $PUSH_SHA"
            pr=$1
            head=$2
            echo "pull request #$pr, final head $head"
            # (2) the ci.yml pull_request runs on that head whose head repository is this one.
            runs=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$head&event=pull_request&per_page=100" \
              --jq ".workflow_runs[] | select(.event == \"pull_request\" and .head_sha == \"$head\" and .head_repository != null and .head_repository.full_name == \"$REPO\") | .id") ||
              full "the ci.yml runs of PR #$pr could not be read"
            # (2) + (3) per job: a run whose latest attempt of the job succeeded and that carries
            # an unexpired verified-<job>-<tree> for exactly this tree.
            missing=$jobs
            for run in $runs; do
              [ -n "$missing" ] || break
              passed=$(gh api "repos/$REPO/actions/runs/$run/jobs?filter=latest&per_page=100" \
                --jq "[.jobs[] | select(.conclusion == \"success\" and .head_sha == \"$head\") | .name] | join(\" \")") ||
                full "the jobs of run $run could not be read"
              want=''
              for job in $missing; do
                case " $passed " in *" $job "*) want="$want $job" ;; esac
              done
              [ -n "$want" ] || continue
              # The unexpired artifact names of this run, joined by "/" (never part of a name), so
              # a match below is an exact match of the whole name.
              arts=$(gh api "repos/$REPO/actions/runs/$run/artifacts?per_page=100" \
                --jq "[.artifacts[] | select(.expired == false) | .name] | join(\"/\")") ||
                full "the artifacts of run $run could not be read"
              left=''
              for job in $missing; do
                case " $want " in
                  *" $job "*)
                    case "/$arts/" in
                      *"/verified-$job-$tree/"*)
                        echo "$job: passed on this tree in run $run of PR #$pr, reused"
                        continue
                        ;;
                    esac
                    ;;
                esac
                left="$left $job"
              done
              missing=$left
            done
            if [ -n "$missing" ]; then
              for job in $missing; do
                echo "$job: no passing run of PR #$pr on this tree"
              done
              full "push to main"
            fi
            echo "all sixteen jobs passed on this tree in PR #$pr: reused"
            echo "reuse=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "tree of this event: $tree (head $HEAD_SHA)"
          # D10-1046 ② (CT-06zzzzj, FU-CI-LABEL-RUN-STALE-HEAD): has the pull request moved on to
          # another head? Only a full 40-hex head.sha other than this event's counts; a failed or
          # malformed query counts as "not moved" (the old rule goes on), and the next round asks
          # again. On a moved head: write moved=true, then fail this step (see the job comment).
          check_head() {
            now=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq .head.sha) || now=''
            case "$now" in
              *[!0-9a-f]*) return 0 ;;
            esac
            [ "${#now}" -eq 40 ] || return 0
            [ "$now" != "$HEAD_SHA" ] || return 0
            echo "::error::PR #$PR_NUMBER head moved from $HEAD_SHA to $now: this label run of the old head ends early, the run of the new head decides"
            echo "moved=true" >> "$GITHUB_OUTPUT"
            exit 1
          }
          # D10-1024 A: wait, with a limit, for the other ci.yml runs on this head to finish.
          started=$SECONDS
          while :; do
            unfinished=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$HEAD_SHA&per_page=100" \
              --jq "[.workflow_runs[] | select(.id != $RUN_ID and .status != \"completed\") | .id | tostring] | join(\" \")")
            # D10-1046 ②: every round, so also after the wait is over (before deciding) and before
            # giving up at the wait limit.
            check_head
            [ -n "$unfinished" ] || break
            elapsed=$((SECONDS - started))
            if [ "$elapsed" -ge "$REUSE_WAIT_SECONDS" ]; then
              echo "wait limit of ${REUSE_WAIT_SECONDS}s reached, ci.yml run(s) $unfinished on this head still unfinished: every job runs in full"
              echo "reuse=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "waiting for ci.yml run(s) $unfinished on this head to finish (${elapsed}s of ${REUSE_WAIT_SECONDS}s)"
            nap=$((REUSE_WAIT_SECONDS - elapsed))
            [ "$nap" -le "$REUSE_POLL_SECONDS" ] || nap=$REUSE_POLL_SECONDS
            sleep "$nap"
          done
          runs=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$HEAD_SHA&per_page=100" \
            --jq ".workflow_runs[] | select(.id != $RUN_ID) | .id")
          reuse=true
          for job in verify-static verify-unit verify-spec-1 verify-spec-2 verify-props-1 verify-props-2 verify-props-3 verify-props-sha-1 verify-props-sha-2 verify-props-sha-3 verify-int-1 verify-int-2 verify-int-3 verify-int-4 verify-int-5 verify-int-6; do
            found=''
            for run in $runs; do
              ok=$(gh api "repos/$REPO/actions/runs/$run/jobs?filter=latest&per_page=100" \
                --jq "[.jobs[] | select(.name == \"$job\" and .conclusion == \"success\" and .head_sha == \"$HEAD_SHA\")] | length")
              [ "$ok" -ge 1 ] || continue
              art=$(gh api "repos/$REPO/actions/runs/$run/artifacts?name=verified-$job-$tree&per_page=100" \
                --jq "[.artifacts[] | select(.name == \"verified-$job-$tree\" and .expired == false)] | length")
              [ "$art" -ge 1 ] || continue
              found=$run
              break
            done
            if [ -n "$found" ]; then
              echo "$job: passed on this tree in run $found, reused"
            else
              echo "$job: no passing run on this tree, runs in full"
              reuse=false
            fi
          done
          echo "reuse=$reuse" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PUSH_SHA: ${{ github.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
          REUSE_WAIT_SECONDS: 3600
          REUSE_POLL_SECONDS: 60

  ledger-only-detect:
    # D10-935 (CT-06zzzv, FU-CI-LEDGER-ONLY-FAST): about half of the pull requests change nothing
    # but task ledgers, and twenty of them open at once queued behind the heavy jobs of each other
    # for one to two hours. This job decides whether base...head (the merge-base diff) changes only
    # ops/tasks/<id>.yaml, or since D10-1024 E (CT-06zzzze) also docs/** (only task ledgers or docs;
    # both sides of a rename, deletions too, regular files only, at least one path); the fifteen
    # heavy jobs (verify-unit, verify-spec-1 / -2, verify-props-1 / -2 / -3, verify-props-sha-1 /
    # -2 / -3, verify-int-1 … -6) are then skipped, while verify-static (which runs
    # `node tools/ops/task.ts check`) and guard-git run as always. ops/evidence, any other ops/ file,
    # tools, test, apps, .github, a docs/ outside the top level, or a top-level file such as
    # README.md is never ledger-only. Which paths count is decided only in that script, never by a
    # path condition in this file.
    # The decision runs from the BASE copy of tools/ci/ledger-only.ts against the PR checkout (the
    # way guard-git and evidence-check do), so a branch cannot change the rule that lets it skip
    # its own tests; Node built-ins only, nothing is installed, nothing of the PR is executed. A
    # base without the script, any git error, or this job failing means only is not `true`: every
    # job runs. Pull requests only; on push to main this job is skipped and everything runs.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      only: ${{ steps.detect.outputs.only }}
    steps:
      - name: Check out the PR head with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          path: pr
          persist-credentials: false
      - name: Check out the base branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: base/.nvmrc
          package-manager-cache: false
      - name: Decide from the base copy of tools/ci whether only task ledgers or docs change
        id: detect
        run: |
          if [ ! -f base/tools/ci/ledger-only.ts ]; then
            echo "::notice::the base branch has no base/tools/ci/ledger-only.ts; every job runs"
            echo "only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node base/tools/ci/ledger-only.ts --repo "$GITHUB_WORKSPACE/pr" \
            --base "$BASE_SHA" --head "$HEAD_SHA"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

  # D10-298 (CT-06zx): the former verify-fast job ran `pnpm verify:fast` on one runner, 849–1475 s
  # (p90 about 23–25 minutes), most of it `turbo run test` with 12 packages competing for 4 cores.
  # It is split into the four parallel jobs below, which together run every command of the
  # verify:fast script (package.json; the script itself is unchanged and still runs whole locally
  # and in tools/ops/verify-container.sh):
  #   verify-static  typecheck, lint, format:check, depcruise, lint:migrations, contracts:check,
  #                  guard:static (and, not part of verify:fast, `node tools/ops/task.ts check`,
  #                  D10-935)
  #   verify-unit    `turbo run test` without @couli/spec-tests (so with @couli/tools), then
  #                  `pnpm --filter @couli/api run smoke:entries`
  #   verify-spec-1  @couli/spec-tests `test` with --shard=1/2
  #   verify-spec-2  @couli/spec-tests `test` with --shard=2/2
  # Vitest shards by file: it sorts the test files by the SHA-1 of their path and cuts the list
  # into contiguous ranges, so the two shards are disjoint and their union is the whole set
  # (vitest BaseSequencer.shard). Each job installs from the setup-node pnpm store cache (keyed
  # by pnpm-lock.yaml; `pnpm install --frozen-lockfile` still checks every package against the
  # lockfile's integrity hashes). Each job is skipped only when verify-reuse found a success of
  # that very job on the same tested tree (D10-242, CT-06zm), or when verify-reuse ended a label
  # run early because the PR head moved (moved=true, D10-1046 ②, CT-06zzzzj); every other
  # event, and any other failure of verify-reuse, runs it in full. timeout-minutes 30 each (D10-298); after a day of runs:
  # if the p90 is still above 20 minutes or verify-unit becomes the critical path, tools and the
  # spec tests are split further.
  # D10-935 (CT-06zzzv): verify-unit, verify-spec-1 / -2 and the other heavy jobs below are also
  # skipped when ledger-only-detect says only=true (the pull request changes nothing but
  # ops/tasks/<id>.yaml or docs/**, D10-1024 E); verify-static never is. On push ledger-only-detect is skipped, its output
  # is empty, and `!cancelled()` lets every job run as before.
  verify-static:
    needs: [verify-reuse]
    if: ${{ !cancelled() && needs.verify-reuse.outputs.reuse != 'true' && needs.verify-reuse.outputs.moved != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The tree this job tests (the PR merge commit, or the pushed commit): recorded before
      # anything runs, uploaded under that name only when every step passed (D10-242).
      - id: tested
        run: |
          tree=$(git rev-parse 'HEAD^{tree}')
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
          echo "$tree" > "$RUNNER_TEMP/verified-tree.txt"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # The spec-ref and banned-terms guards (guard:static) read planning text with
      # `git show <SPEC_REF>:<path>`, so the public planning repository is checked out with full
      # history into the git-ignored .tmp/ directory (规划/11 §5.3).
      - name: Check out the planning repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: haoyu8962-netizen/couli
          path: .tmp/spec-repo
          fetch-depth: 0
          persist-credentials: false
      - run: pnpm install --frozen-lockfile
      # The verify:fast commands of this job, in the script's order.
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run format:check
      - run: pnpm run depcruise
      - run: pnpm run lint:migrations
      - run: pnpm run contracts:check
      - run: pnpm run guard:static
        env:
          COULI_SPEC_REPO: ${{ github.workspace }}/.tmp/spec-repo
      # D10-935 (CT-06zzzv): the task ledger check, on every event. A ledger-only pull request skips
