# Secret scan in CI (规划/11 §4.1, §8): second line of defence behind .githooks/pre-commit and
# tools/ops/push.sh. Scans the PR commit range, or the full history on a push to main.
# Written on 2026-10-01 without a GitHub remote: nothing in this file has run on GitHub yet.
#
# CT-06zzzzh (FU-GITLEAKS-DOWNLOAD-RETRY, D10-1044 ④): two runs within an hour went red on a curl 504
# while downloading the gitleaks release, not on a finding. The release archive is now cached
# (actions/cache, keyed by the pinned version and its sha256) and the download is retried harder,
# with a bounded total time. The scan is not relaxed: whether the archive comes from the cache or
# from the download it is checked with `sha256sum -c` against GITLEAKS_SHA256 first, and a
# mismatch fails the job (no re-download); a download that keeps failing fails the job; the scan
# range, the rules (.gitleaks.toml), --redact and red-on-finding are unchanged, and no `if:` or
# `continue-on-error` lets the Scan step be skipped while the job stays green.
name: gitleaks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# CT-06zy (D10-301): a newer run of the same pull request cancels the older one, as in ci.yml.
# A push to main gets a group of its own (its commit), so main runs neither cancel nor queue behind
# each other: each push is checked to the end.
concurrency:
  group: gitleaks-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The release archive itself is cached (not the unpacked binary), so the install checks it
      # with the same sha256 whatever its source. No restore-keys: only this exact release matches.
      - name: Cache the gitleaks release archive
        id: gitleaks-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/gitleaks-release/gitleaks_${{ env.GITLEAKS_VERSION }}_linux_x64.tar.gz
          key: gitleaks-${{ env.GITLEAKS_VERSION }}-linux-x64-${{ env.GITLEAKS_SHA256 }}
      - name: Install gitleaks (pinned release, checksum verified)
        run: |
          set -euo pipefail
          if [ "$CACHE_HIT" = true ]; then
            echo "using the cached release archive"
          else
            url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
            mkdir -p "$(dirname "$ARCHIVE")"
            # 5xx, timeouts and connection errors are all retried, every attempt is bounded and
            # retrying stops after --retry-max-time; a download that never succeeds fails here.
            curl --fail --silent --show-error --location \
              --connect-timeout 20 --max-time 120 \
              --retry 8 --retry-all-errors --retry-delay 5 --retry-max-time 240 \
              --output "$ARCHIVE" "$url"
          fi
          # Cached or downloaded, the archive is verified before it is unpacked; a mismatch fails.
          echo "${GITLEAKS_SHA256}  $ARCHIVE" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$ARCHIVE" -C "$RUNNER_TEMP/gitleaks" gitleaks
          "$RUNNER_TEMP/gitleaks/gitleaks" version
        env:
          ARCHIVE: ${{ runner.temp }}/gitleaks-release/gitleaks_${{ env.GITLEAKS_VERSION }}_linux_x64.tar.gz
          CACHE_HIT: ${{ steps.gitleaks-cache.outputs.cache-hit }}
      - name: Scan
        run: |
          set -euo pipefail
          if [ "$EVENT" = pull_request ]; then
            echo "scanning commits ${PR_BASE_SHA}..${PR_HEAD_SHA}"
            "$RUNNER_TEMP/gitleaks/gitleaks" git --config .gitleaks.toml --redact --no-banner \
              --log-opts="${PR_BASE_SHA}..${PR_HEAD_SHA}"
          else
            echo "scanning the full history"
            "$RUNNER_TEMP/gitleaks/gitleaks" git --config .gitleaks.toml --redact --no-banner
          fi
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
