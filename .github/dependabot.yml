# Dependabot 版本升级（CT-23，规划/05 CT-23）。
# 只开 PR、不自动合并：依赖 PR 仍走 deps 任务与对抗评审，锁文件只由 deps 任务改。
# cooldown 7 天对齐 ADR-0001 §2「新版本发布满 7 天才装」与 pnpm-workspace.yaml 的
# minimumReleaseAge（10080 分钟）。pnpm 工作区由根目录锁文件覆盖，只配根目录一项。
version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Shanghai
    cooldown:
      default-days: 7
      semver-major-days: 7
      semver-minor-days: 7
      semver-patch-days: 7
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
    # D10-1146（2026-11-09，CT-06zzzzo）：由 5 改为 1，少占 CI——每周最多开一张版本升级 PR；
    # 依赖 PR 一律不合并，由 ops 分拣，有安全意义的另开 deps 任务。生产依赖的新公告由每晚
    # pnpm audit --prod（couli-runs/OPS-lane/nightly-audit.sh）报告。改回：把这里改回 5
    # （冻结测试 [CT-23#6] 允许 1～10）。
    open-pull-requests-limit: 1
    commit-message:
      prefix: 'chore(deps)'
