# Staging stack (B1-01zc): five long-running processes from ONE backend image.
# Started only by infra/staging/deploy.sh, which runs the migration first and passes
#   --env-file /etc/couli/staging.env  (compose interpolation of the port numbers only)
# The image is built on the developer machine and loaded with `docker load`; this file
# never builds or pulls. COULI_API_TAG is exported by deploy.sh (the tag being deployed).
# Connection strings and credentials come only from the node env files (root, 600):
#   /etc/couli/staging.env         api / stream / worker / admin
#   /etc/couli/staging-payout.env  payout only (its own database role; payout never uses Redis)
# Every service mounts read-only: the database CA (/etc/pki/ca.crt) and the field-encryption
# key ring directory (/etc/couli-keys -> /run/couli-keys); api also mounts its access-token
# signing key directory (/etc/couli-jwt -> /run/couli-jwt), loaded by infra/staging/boot.mjs;
# stream mounts only the matching verification public key directory (/etc/couli-jwt-pub ->
# /run/couli-jwt-pub), also loaded by boot.mjs, and never the signing key.
# admin, api, stream and worker also mount the optional Pinduoduo directory (/etc/couli-pdd -> /run/couli-pdd)
# the optional Jingdong directory (/etc/couli-jd -> /run/couli-jd) and the optional Taobao
# directory (/etc/couli-taobao -> /run/couli-taobao); payout mounts none of them.
# api alone also mounts the optional staging test-phone directory (/etc/couli-staging-test ->
# /run/couli-staging-test, B1-02zza).
# Every process starts through boot.mjs (node --import), which also counts container starts.
# All five health checks require 30s of uptime and a single start until deploy.sh marks the
# deployment settled, so `up --wait` fails when any process crashed or restarted during it.
# worker and payout health checks also probe their dependencies (PG; worker also Redis).
# Every service has hard cpus / mem_limit / pids_limit caps (README section 6).
# HTTP ports are published on 127.0.0.1 only; worker and payout publish nothing.
name: couli-staging

services:
  # user-facing HTTP API (/v1)
  api:
    image: 'couli-api:${COULI_API_TAG:?deploy.sh exports the image tag}'
    pull_policy: never
    command:
      - node
      - '--import'
      - ./infra/staging/boot.mjs
      - apps/api/dist/main.api.js
    env_file:
      # raw: values are taken literally, Compose does not expand $ inside them
      - path: /etc/couli/staging.env
        format: raw
    environment:
      # Not a secret; set here so no process depends on the node file for it.
      APP_ENV: staging
      # B1-01zzg (规划/02 §13): the deployed image tag, bound to every log line as deployVersion.
      COULI_DEPLOY_VERSION: '${COULI_API_TAG:?deploy.sh exports the image tag}'
      # B2-15k (D10-549 ⑥): fake collection channels until a test merchant is prepared (README 1.9).
      # Not a secret; stream and payout never read any PAY_* variable (BR-PAY-08 ①).
      PAY_CHANNEL_IMPL: fake
      # Listen on the container interface so the 127.0.0.1-only host port reaches it.
      API_HOST: '0.0.0.0'
      # boot.mjs reads the access-token signing key (es256.pem, key-id) from this mounted
      # directory into the process environment; api is the only entry that signs tokens.
      COULI_JWT_DIR: /run/couli-jwt
    ports:
      - host_ip: 127.0.0.1
        target: '${API_PORT:-3100}'
        published: '${API_PORT:-3100}'
    volumes:
      # CA of the self-signed database certificate (sslmode=verify-ca&sslrootcert=/etc/pki/ca.crt)
      - type: bind
        source: /etc/pki/ca.crt
        target: /etc/pki/ca.crt
        read_only: true
      # field-encryption key ring (ADR-0003): owned by uid 1000, directory 500, files 400
      - type: bind
        source: /etc/couli-keys
        target: /run/couli-keys
        read_only: true
      # access-token signing key (PKCS#8 P-256 es256.pem + key-id): owned by uid 1000,
      # directory 500, files 400; mounted on api only
      - type: bind
        source: /etc/couli-jwt
        target: /run/couli-jwt
        read_only: true
      # Pinduoduo preparation (B1-04y): node /etc/couli-pdd (client_secret file and the
      # union-endpoints/ override directory; owned by uid 1000, directories 500, files 400).
      # Optional: create_host_path lets the deployment start when the node has no such
      # directory yet. Mounted on admin, api, stream and worker only (the entries that assemble UnionModule).
      - type: bind
        source: /etc/couli-pdd
        target: /run/couli-pdd
        read_only: true
        bind:
          create_host_path: true
      # Jingdong preparation (B1-04zf): node /etc/couli-jd (app_secret file only; owned by
      # uid 1000, directory 500, file 400). The variables come only from the node env file.
      # Optional: create_host_path lets the deployment start when the node has no such
      # directory yet. Mounted on admin, api, stream and worker only (the entries that assemble UnionModule).
      - type: bind
        source: /etc/couli-jd
        target: /run/couli-jd
        read_only: true
        bind:
          create_host_path: true
      # Taobao preparation (B1-04zzd): node /etc/couli-taobao (app_secret file only; owned by
      # uid 1000, directory 500, file 400). The variables come only from the node env file.
      # Optional: create_host_path lets the deployment start when the node has no such
      # directory yet. Mounted on admin, api, stream and worker only (the entries that assemble UnionModule).
      - type: bind
        source: /etc/couli-taobao
        target: /run/couli-taobao
        read_only: true
        bind:
          create_host_path: true
      # Staging test phones (B1-02zza, approvals 48, D10-611): node /etc/couli-staging-test holds
      # only the fixed SMS code file (owned by uid 1000, directory 500, file 400; README 1.11).
      # The numbers and the file path come only from the node env file. Optional:
      # create_host_path lets the deployment start without it. Mounted on api only (the entry that
      # serves SMS login and step-up); stream, worker, admin and payout never get it.
      - type: bind
        source: /etc/couli-staging-test
        target: /run/couli-staging-test
        read_only: true
        bind:
          create_host_path: true
    healthcheck:
      # Healthy only when this process own /healthz on API_PORT answers 2xx AND the
      # container has run for 30s AND (before its first healthy check) started only once:
      # boot.mjs counts starts in /tmp/couli-starts, which a restart keeps and a recreate empties.
      # deploy.sh writes /tmp/couli-settled only after the WHOLE deployment succeeded (all five
      # healthy, RestartCount 0); only from then on may a restart (node reboot) pass again.
      test:
        - CMD
        - node
        - '-e'
        - "const fs = process.getBuiltinModule('node:fs'); const stat = fs.readFileSync('/proc/1/stat', 'utf8'); const start = Number(stat.slice(stat.lastIndexOf(')') + 2).split(' ')[19]) / 100; const age = Number(fs.readFileSync('/proc/uptime', 'utf8').split(' ')[0]) - start; const starts = fs.readFileSync('/tmp/couli-starts', 'utf8').trim().split('\\n').length; const settled = fs.existsSync('/tmp/couli-settled'); fetch('http://127.0.0.1:' + (process.env.API_PORT || '3100') + '/healthz', { signal: AbortSignal.timeout(4000) }).then((r) => { const ok = r.ok && age >= 30 && (settled || starts === 1); process.exit(ok ? 0 : 1); }, () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
    # Hard resource caps (B1-01zzj); values and reasoning in README section 6.
    cpus: '1.0'
    mem_limit: 768m
    pids_limit: 256
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    security_opt:
      - 'no-new-privileges:true'
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: '20m'
        max-file: '5'

  # Agent SSE streaming endpoint
  stream:
    image: 'couli-api:${COULI_API_TAG:?deploy.sh exports the image tag}'
    pull_policy: never
    command:
      - node
      - '--import'
      - ./infra/staging/boot.mjs
      - apps/api/dist/main.stream.js
    env_file:
      # raw: values are taken literally, Compose does not expand $ inside them
      - path: /etc/couli/staging.env
        format: raw
    environment:
      # Not a secret; set here so no process depends on the node file for it.
      APP_ENV: staging
      # B1-01zzg (规划/02 §13): the deployed image tag, bound to every log line as deployVersion.
      COULI_DEPLOY_VERSION: '${COULI_API_TAG:?deploy.sh exports the image tag}'
      # Listen on the container interface so the 127.0.0.1-only host port reaches it.
      API_HOST: '0.0.0.0'
      # boot.mjs reads the access-token verification public key (es256.pub.pem, key-id) from
      # this mounted directory into the process environment; stream only verifies tokens.
      COULI_JWT_PUB_DIR: /run/couli-jwt-pub
    ports:
      - host_ip: 127.0.0.1
        target: '${STREAM_PORT:-3101}'
        published: '${STREAM_PORT:-3101}'
    volumes:
      # CA of the self-signed database certificate (sslmode=verify-ca&sslrootcert=/etc/pki/ca.crt)
      - type: bind
        source: /etc/pki/ca.crt
        target: /etc/pki/ca.crt
        read_only: true
      # field-encryption key ring (ADR-0003): owned by uid 1000, directory 500, files 400
      - type: bind
        source: /etc/couli-keys
        target: /run/couli-keys
        read_only: true
      # access-token verification public key (SPKI P-256 es256.pub.pem + key-id, exported from
      # /etc/couli-jwt, README section 1.4): owned by uid 1000; mounted on stream only. No
      # create_host_path: a missing directory fails the deployment instead of starting stream
      # with an empty mount.
      - type: bind
        source: /etc/couli-jwt-pub
        target: /run/couli-jwt-pub
        read_only: true
      # Pinduoduo preparation (B1-04y): node /etc/couli-pdd (client_secret file and the
      # union-endpoints/ override directory; owned by uid 1000, directories 500, files 400).
      # Optional: create_host_path lets the deployment start when the node has no such
      # directory yet. Mounted on admin, api, stream and worker only (the entries that assemble UnionModule).
      - type: bind
        source: /etc/couli-pdd
        target: /run/couli-pdd
        read_only: true
        bind:
          create_host_path: true
      # Jingdong preparation (B1-04zf): node /etc/couli-jd (app_secret file only; owned by
      # uid 1000, directory 500, file 400). The variables come only from the node env file.
      # Optional: create_host_path lets the deployment start when the node has no such
      # directory yet. Mounted on admin, api, stream and worker only (the entries that assemble UnionModule).
      - type: bind
        source: /etc/couli-jd
        target: /run/couli-jd
        read_only: true
        bind:
          create_host_path: true
      # Taobao preparation (B1-04zzd): node /etc/couli-taobao (app_secret file only; owned by
      # uid 1000, directory 500, file 400). The variables come only from the node env file.
      # Optional: create_host_path lets the deployment start when the node has no such
      # directory yet. Mounted on admin, api, stream and worker only (the entries that assemble UnionModule).
      - type: bind
        source: /etc/couli-taobao
        target: /run/couli-taobao
        read_only: true
        bind:
          create_host_path: true
    healthcheck:
      # Healthy only when this process own /healthz on STREAM_PORT answers 2xx AND the
      # container has run for 30s AND (before its first healthy check) started only once:
      # boot.mjs counts starts in /tmp/couli-starts, which a restart keeps and a recreate empties.
      # deploy.sh writes /tmp/couli-settled only after the WHOLE deployment succeeded (all five
      # healthy, RestartCount 0); only from then on may a restart (node reboot) pass again.
      test:
        - CMD
        - node
        - '-e'
        - "const fs = process.getBuiltinModule('node:fs'); const stat = fs.readFileSync('/proc/1/stat', 'utf8'); const start = Number(stat.slice(stat.lastIndexOf(')') + 2).split(' ')[19]) / 100; const age = Number(fs.readFileSync('/proc/uptime', 'utf8').split(' ')[0]) - start; const starts = fs.readFileSync('/tmp/couli-starts', 'utf8').trim().split('\\n').length; const settled = fs.existsSync('/tmp/couli-settled'); fetch('http://127.0.0.1:' + (process.env.STREAM_PORT || '3101') + '/healthz', { signal: AbortSignal.timeout(4000) }).then((r) => { const ok = r.ok && age >= 30 && (settled || starts === 1); process.exit(ok ? 0 : 1); }, () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
    # Hard resource caps (B1-01zzj); values and reasoning in README section 6.
    cpus: '0.5'
    mem_limit: 512m
    pids_limit: 256
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    security_opt:
      - 'no-new-privileges:true'
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: '20m'
        max-file: '5'

  # pg-boss queue worker; no port
  worker:
    image: 'couli-api:${COULI_API_TAG:?deploy.sh exports the image tag}'
    pull_policy: never
    command:
      - node
      - '--import'
      - ./infra/staging/boot.mjs
      - apps/api/dist/main.worker.js
    env_file:
      # raw: values are taken literally, Compose does not expand $ inside them
      - path: /etc/couli/staging.env
        format: raw
    environment:
      # Not a secret; set here so no process depends on the node file for it.
      APP_ENV: staging
      # B1-01zzg (规划/02 §13): the deployed image tag, bound to every log line as deployVersion.
      COULI_DEPLOY_VERSION: '${COULI_API_TAG:?deploy.sh exports the image tag}'
      # B2-15k (D10-549 ⑥): fake collection channels until a test merchant is prepared (README 1.9).
      # Not a secret; stream and payout never read any PAY_* variable (BR-PAY-08 ①).
      PAY_CHANNEL_IMPL: fake
    volumes:
      # CA of the self-signed database certificate (sslmode=verify-ca&sslrootcert=/etc/pki/ca.crt)
      - type: bind
        source: /etc/pki/ca.crt
        target: /etc/pki/ca.crt
        read_only: true
      # field-encryption key ring (ADR-0003): owned by uid 1000, directory 500, files 400
      - type: bind
        source: /etc/couli-keys
        target: /run/couli-keys
        read_only: true
      # Pinduoduo preparation (B1-04y): node /etc/couli-pdd (client_secret file and the
      # union-endpoints/ override directory; owned by uid 1000, directories 500, files 400).
      # Optional: create_host_path lets the deployment start when the node has no such
      # directory yet. Mounted on admin, api, stream and worker only (the entries that assemble UnionModule).
      - type: bind
        source: /etc/couli-pdd
        target: /run/couli-pdd
        read_only: true
        bind:
          create_host_path: true
      # Jingdong preparation (B1-04zf): node /etc/couli-jd (app_secret file only; owned by
      # uid 1000, directory 500, file 400). The variables come only from the node env file.
      # Optional: create_host_path lets the deployment start when the node has no such
      # directory yet. Mounted on admin, api, stream and worker only (the entries that assemble UnionModule).
      - type: bind
        source: /etc/couli-jd
        target: /run/couli-jd
        read_only: true
        bind:
          create_host_path: true
      # Taobao preparation (B1-04zzd): node /etc/couli-taobao (app_secret file only; owned by
      # uid 1000, directory 500, file 400). The variables come only from the node env file.
      # Optional: create_host_path lets the deployment start when the node has no such
      # directory yet. Mounted on admin, api, stream and worker only (the entries that assemble UnionModule).
      - type: bind
        source: /etc/couli-taobao
        target: /run/couli-taobao
        read_only: true
        bind:
          create_host_path: true
    healthcheck:
      # No port: healthy only when the process has run for 30s AND (before its first healthy
      # check) started only once (/tmp/couli-starts, written by boot.mjs; kept across a restart,
      # emptied by a recreate) AND its dependencies answer: the built probe
      # apps/api/dist/modules/health/staging-dependencies.js runs SELECT 1 on this container's
      # own DATABASE_URL and PING on REDIS_URL; any failure or timeout exits 1 (unhealthy).
      # The probe does not restart the process (restart policy unchanged). One early crash is
      # enough to keep it unhealthy, so `up --wait` fails and deploy.sh rolls back.
      # /tmp/couli-settled is written by deploy.sh only after the whole deployment succeeded;
      # only then may a later restart pass again. No $ in the Node code (Compose would expand it).
      test:
        - CMD
        - node
        - '-e'
        - "const fs = process.getBuiltinModule('node:fs'); const stat = fs.readFileSync('/proc/1/stat', 'utf8'); const start = Number(stat.slice(stat.lastIndexOf(')') + 2).split(' ')[19]) / 100; const age = Number(fs.readFileSync('/proc/uptime', 'utf8').split(' ')[0]) - start; const starts = fs.readFileSync('/tmp/couli-starts', 'utf8').trim().split('\\n').length; const settled = fs.existsSync('/tmp/couli-settled'); if (!(age >= 30 && (settled || starts === 1))) { process.exit(1); } else { import('/app/apps/api/dist/modules/health/staging-dependencies.js').then((probe) => probe.checkStagingDependencies('worker', { databaseUrl: process.env.DATABASE_URL, redisUrl: process.env.REDIS_URL })).then((ok) => process.exit(ok === true ? 0 : 1), () => process.exit(1)); }"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
    # Hard resource caps (B1-01zzj); values and reasoning in README section 6.
    cpus: '1.0'
    mem_limit: 768m
    pids_limit: 256
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    security_opt:
      - 'no-new-privileges:true'
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: '20m'
        max-file: '5'

  # back-office HTTP API (/admin/v1)
  admin:
    image: 'couli-api:${COULI_API_TAG:?deploy.sh exports the image tag}'
    pull_policy: never
    command:
      - node
      - '--import'
      - ./infra/staging/boot.mjs
