# 埋点事件表（规划/03 §4.7；拍板第二批 TECH-21；F-OBS-03）。三端与 H5 的事件类型与构造函数由 CT-05 的生成器
# 从本文件生成，业务代码只能调用生成函数；/v1/events 的服务端校验读同一份。
#
# 结构（packages/contracts-ts/scripts/events.ts 校验，pnpm contracts:check 里跑）：
#   version          每次改动递增
#   common_fields    每个事件都带的公共字段（03 §4.7）
#   events           事件名 → {description, source, fields}；fields 是字段名 →
#                    {type, required | required_when, values?, note?}
#     type           string / integer / boolean / enum（enum 时 values 列出取值，取值一律是字符串）
#     required       true / false；required_when 写成 {字段: 取值}，表示那个字段取该值时必填
#     事件名只用小写字母、数字、下划线；families 里登记的族，其事件写成「族名.事件」（如 funnel_first_order.click_buy）；
#     Agent 事件按 03 §4.7 的写法直接以 agent_ 开头（不是族，不用点）。具体事件随定义它们的任务补进来。
# 字段名不得含 url、href、link、deeplink、tpwd、pid、adzone、relation、promo 这些分段（link_id、pid_scene 例外），
# 也不得含 sub_union_id、custom_parameters。
# 约束（02 §12.6，03 §4.7）：事件字段不带完整推广 URL、口令、推广位或 relation_id 等渠道标识；URL 类信息只记平台与
# 类别。本文件不设这类字段（字段名不得是 url、tpwd、pid、relation_id、promo_url 之类，校验会拒绝）。
# 游客事件只带 device_id；登录后由服务端按 device_id 与登录时刻在报表层关联 user_id，不回写原事件。
#
# TODO(规划/05 CT-13): app_launch、page_view、exposure、click、search、convert、h5_white_screen 与 funnel_first_order.*
#   的事件字段 — blocked on 用到它们的任务（首页、搜索、漏斗）给出字段；现在只登记名字与出处。
version: '6'
common_fields:
  event_id:
    type: string
    required: true
    note: 客户端生成，服务端按它去重
  name:
    type: string
    required: true
  client_at:
    type: string
    required: true
    note: 客户端时刻，ISO 8601 带时区
  session_id:
    type: string
    required: true
  device_id:
    type: string
    required: true
  user_id:
    type: string
    required: false
    note: 游客为空
  platform:
    type: enum
    required: true
    values: [ios, android, harmony, h5]
    note: 客户端端别（contracts/enums/platform.yaml client_platform 的端侧取值）
  app_version:
    type: string
    required: true
  channel:
    type: string
    required: false
    note: 安装渠道（install_channel）；H5 为空
  page:
    type: string
    required: true
  spm:
    type: string
    required: false
    note: 页面.模块.坑位（03 §4.7）
  trace_id:
    type: string
    required: false
events:
  link_jump:
    description: 外跳的每一步结果（BR-ATTR-27 ③；BR-ATTR-21 细则「待跟单卡按实际外跳选」）；另记百川初始化失败（BR-ATTR-27 淘宝行，result=failed 且 failure_reason=sdk_init_failed）
    source: 规划/03 §4.5、§4.7、§6.2 第 9 条；04 §6.4 POST /v1/events；08 BR-ATTR-21、BR-ATTR-27；编排裁定 D10-1470 ③ ④
    fields:
      phase:
        type: enum
        required: true
        values: [purchase, startup]
        note: purchase 是一次购买外跳的某一步；startup 只用于同意隐私政策后、还没有购买时的百川初始化失败（result=failed、failure_reason=sdk_init_failed），这时没有 link 与尝试
      attempt_id:
        type: string
        required_when:
          phase: purchase
        note: 本次 open（或 H5 经 convert）响应里的 attempt_id，购买外跳的每一步都必须带、同一次外跳的各步用同一个；服务端仍接受不带编号的上报，但只当埋点、不参与待跟单卡（BR-ATTR-21 细则）
      link_id:
        type: string
        required_when:
          phase: purchase
      union_platform:
        type: enum
        required: true
        values: [taobao, jd, pdd, meituan, vip, douyin, eleme, kuaishou, suning]
        note: 电商平台（contracts/enums/platform.yaml platform）
      step:
        type: enum
        required: true
        values: [sdk, scheme, universal_link, h5, copy_tpwd]
        note: 只记步骤类型，不带完整推广 URL、口令、推广位或 relation_id
      result:
        type: enum
        required: true
        values: [requested, failed, unknown]
        note: 启动结果只有三种（03 §4.5）。requested 系统或 SDK 接受了启动请求，或已复制口令（取代原 launched 与 copied）；failed 明确失败，必带 failure_reason（原因码）；unknown 系统返回不确定、SDK 回调超时或提交后进程重启。BR-ATTR-21「至少一步执行成功」按 requested 或 unknown 计，failed 不计；漏斗与看板把 unknown 单列，不并入 requested。requested 不等于用户看到了商品页，更不等于成交（BR-ATTR-23）
      failure_reason:
        type: enum
        required_when:
          result: failed
        values: [sdk_init_failed, step_failed]
        note: failed 的原因码，result=failed 时必带、其他结果不带。sdk_init_failed 百川初始化失败（原 result 的同名取值，BR-ATTR-27 淘宝行；phase=startup 时只会是它）；step_failed 已初始化但这一步明确失败（原 result=failed）。步骤类型见 step
      sdk_open_by:
        type: enum
        required: false
        values: [url, code]
        note: step=sdk 且为淘宝百川打开指令时必带，取 open 响应 JumpStep.sdk.open_by 的原值（url 走我方推广链接，code 走商品 ID 由 SDK 转链）；其他步骤不带
      sdk_error_code:
        type: string
        required: false
        note: 百川回调返回的错误码原样记录（result=failed 且 SDK 给出错误码时带，含 failure_reason=sdk_init_failed），用来区分 SDK 报错与目标 App 未拉起；不带错误描述里的链接或参数
      duration_ms:
        type: integer
        required_when:
          phase: purchase
      installed:
        type: enum
        required_when:
          phase: purchase
        values: ['true', 'false', unknown]
        note: 请求体里 installed 的同一取值（contracts/enums/trade.yaml installed_state）
  external_page_union_host:
    description: 第三方页容器里命中联盟平台网页域名的导航（BR-ATTR-29 ②，每次命中一条）
    source: 规划/03 §5.1；08 BR-ATTR-29
    fields:
      union_platform:
        type: enum
        required: true
        values: [taobao, jd, pdd, meituan, vip, douyin, eleme, kuaishou, suning]
      category:
        type: enum
        required: true
        values: [product, promo, union_host]
        note: 命中的链接形态类别（link_pattern_category）
      frame:
        type: enum
        required: true
        values: [initial, main, subframe, new_window]
      outcome:
        type: enum
        required: true
        values: [parse_ok, parse_failed, block]
        note: parse_ok / parse_failed 是交识别后成功转回原生详情或留在原页提示；block 是拦下（与 specs/external-navigation.vectors.json 的 action 对应）；不带完整 URL
  external_page_nav_host:
    description: 容器内文档级导航的抽样埋点（采样率 /v1/config external_page.nav_host_sample_bp；BR-ATTR-29 细则「覆盖限制与待定事项」）
    source: 规划/03 §5.1；08 BR-ATTR-29
    fields:
      registered_domain:
        type: string
        required: true
        note: 只记注册域，不带路径、参数与来源页
      frame:
        type: enum
        required: true
        values: [initial, main, subframe, new_window]
      hit:
        type: boolean
        required: true
        note: 是否命中链接形态表
  external_page_blocked_nav:
    description: 第三方页容器取消的非 https 跳转与下载（只记类别）
    source: 规划/03 §5.1
    fields:
      kind:
        type: enum
        required: true
        values: [http, app_scheme, intent, market, tel, sms, mailto, other_scheme, download]
        note: 只记 scheme 类别（下载另记 download），不带完整 URL
      frame:
        type: enum
        required: true
        values: [initial, main, subframe, new_window]
  route_entry_blocked:
    description: 深链或推送命中不允许的入口（BR-ID-10 细则「路由入口矩阵」）
    source: 规划/03 §4.4；08 BR-ID-10
    fields:
      route:
        type: string
        required: true
        note: contracts/routes.json 的路由名，不带参数
      entry:
        type: enum
        required: true
        values: [in_app, push, deeplink]
  route_params_dropped:
    description: 打开不接受参数的资金与实名页面时丢弃了参数（功能对照 G-69）
    source: 规划/03 §4.4；08 BR-WDR 细则「资金与实名页面不接受外部预填」
    fields:
      route:
        type: enum
        required: true
        values: [Withdraw, PayoutAccount, LaborAgreement, RealName]
      dropped_count:
        type: integer
        required: true
        note: 只记个数，不记参数名与值
  bridge_call:
    description: JSBridge 调用被拒（规划/03 §5.3；BR-ATTR-29 细则「桥方法不留没有归因的打开入口」）；当前只记拒绝，强更状态未知时以 90500 拒绝的调用要不要记待定
    source: 规划/03 §5.3、§4.7「诊断字段」；08 BR-ATTR-29
    fields:
      method:
        type: string
        required: true
        note: 桥方法名（contracts/bridge.schema.json），不带参数与 url
      code:
        type: integer
        required: true
        note: 桥错误码（90001–90500）
      schema_version:
        type: string
        required: true
        note: 诊断字段（03 §4.7）；调用方打包时所依据的桥 schema（contracts/bridge.schema.json 顶层 version）转成的字符串；取不到填 "unknown"
      bridge_version:
        type: string
        required: true
        note: 诊断字段（03 §4.7）；取不到填 "unknown"；H5 发出的事件由原生补
      config_version:
        type: string
        required: true
        note: 诊断字段（03 §4.7，来源见 04 §10.1）；/v1/config 还没拉到时填 "unknown"；H5 发出的事件由原生补
      h5_release:
        type: string
        required: true
        note: 诊断字段（03 §4.7）；原生页没有 H5 时填 "unknown"；H5 发出的事件由 H5 自己填
  sdui_card_error:
    description: SDUI 卡片解码失败，只丢弃这一项（规划/03 §6 解码隔离）
    source: 规划/03 §6、§7.2、§4.7「诊断字段」
    fields:
      type:
        type: string
        required: true
      version:
        type: integer
        required: false
        note: 卡片自带的版本；正是因为缺它而解码失败时不带
      page_version:
        type: integer
        required: false
        note: 页面配置的 version（整数）；首页等配置化页面（规划/03 §6.2）必带；AI 助手页的卡片（03 §7.2）不带（AI 助手页不是配置化页面）
      reason:
        type: string
        required: true
      schema_version:
        type: string
        required: true
        note: 诊断字段（03 §4.7）；首页配置化卡片填卡片自带 version 转成的字符串，AI 助手页卡片（03 §7.2）填该卡 schema_version 转成的字符串；正是因为取不到版本而解码失败时填 "unknown"
      bridge_version:
        type: string
        required: true
        note: 诊断字段（03 §4.7）；取不到填 "unknown"；H5 发出的事件由原生补
      config_version:
        type: string
        required: true
        note: 诊断字段（03 §4.7，来源见 04 §10.1）；/v1/config 还没拉到时填 "unknown"；H5 发出的事件由原生补
      h5_release:
        type: string
        required: true
        note: 诊断字段（03 §4.7）；原生页（含 AI 助手页）没有 H5 时填 "unknown"；H5 发出的事件由 H5 自己填
  agent_stream_seq_gap:
    description: 原生 Agent 页流诊断：text.delta 缺号（收到的 seq 大于本地已应用值 +1），本地结束该条消息（03 §7.2）；不带用户消息原文、输入框原文、帧的 data 与 delta、卡片内容和 fallback_text
    source: 规划/03 §4.7「agent_* 事件的字段」、§7.2
    fields:
      run_id:
        type: string
        required: false
        note: 本轮 meta 帧给的 run_id（04 §8.2）；还没收到 meta 帧时不带
      message_id:
        type: string
        required: false
        note: 本轮 meta 帧给的 message_id；还没收到 meta 帧时不带
      schema_version:
        type: string
        required: true
        note: 诊断字段（03 §4.7）；这四个事件不针对某一张卡，填 "unknown"
      bridge_version:
        type: string
        required: true
        note: 诊断字段（03 §4.7），按诊断字段一条取；取不到填 "unknown"
      config_version:
        type: string
        required: true
        note: 诊断字段（03 §4.7，来源见 04 §10.1）；/v1/config 还没拉到时填 "unknown"
      h5_release:
        type: string
        required: true
        note: 诊断字段（03 §4.7）；Agent 页是原生页，填 "unknown"
      expected:
        type: integer
        required: true
        note: 本地已应用的最大 seq 加 1
      received:
        type: integer
        required: true
        note: 这一帧实际带的 seq（大于 expected）
  agent_stream_frame_too_large:
    description: 原生 Agent 页流诊断：单帧 data 超过上限，按协议错误本地结束该条消息（03 §7.2）；只有共有字段，不带帧内容
    source: 规划/03 §4.7「agent_* 事件的字段」、§7.2
    fields:
      run_id:
        type: string
        required: false
        note: 本轮 meta 帧给的 run_id（04 §8.2）；还没收到 meta 帧时不带
      message_id:
        type: string
        required: false
        note: 本轮 meta 帧给的 message_id；还没收到 meta 帧时不带
      schema_version:
        type: string
        required: true
        note: 诊断字段（03 §4.7）；这四个事件不针对某一张卡，填 "unknown"
      bridge_version:
        type: string
        required: true
        note: 诊断字段（03 §4.7），按诊断字段一条取；取不到填 "unknown"
      config_version:
        type: string
        required: true
        note: 诊断字段（03 §4.7，来源见 04 §10.1）；/v1/config 还没拉到时填 "unknown"
      h5_release:
        type: string
        required: true
        note: 诊断字段（03 §4.7）；Agent 页是原生页，填 "unknown"
  agent_stream_limit:
    description: 原生 Agent 页流诊断：同一 run 的累计文本、卡片数或内容帧数超过输出上限，本地结束该条消息（03 §7.2；上限见 02 §9.2）
    source: 规划/03 §4.7「agent_* 事件的字段」、§7.2
    fields:
      run_id:
        type: string
        required: false
        note: 本轮 meta 帧给的 run_id（04 §8.2）；还没收到 meta 帧时不带
      message_id:
        type: string
        required: false
        note: 本轮 meta 帧给的 message_id；还没收到 meta 帧时不带
      schema_version:
        type: string
        required: true
        note: 诊断字段（03 §4.7）；这四个事件不针对某一张卡，填 "unknown"
      bridge_version:
        type: string
        required: true
        note: 诊断字段（03 §4.7），按诊断字段一条取；取不到填 "unknown"
      config_version:
        type: string
        required: true
        note: 诊断字段（03 §4.7，来源见 04 §10.1）；/v1/config 还没拉到时填 "unknown"
      h5_release:
        type: string
        required: true
        note: 诊断字段（03 §4.7）；Agent 页是原生页，填 "unknown"
      kind:
        type: enum
        required: true
        values: [text, cards, frames]
        note: 超过的是哪一个上限：text 累计文本、cards 卡片数、frames 内容帧数（02 §9.2）
  agent_stream_unknown_event:
    description: 原生 Agent 页流诊断：收到不在 04 §8.2 表内的 event 类型，忽略该帧、不中断流（03 §7.2）
    source: 规划/03 §4.7「agent_* 事件的字段」、§7.2
    fields:
      run_id:
        type: string
        required: false
        note: 本轮 meta 帧给的 run_id（04 §8.2）；还没收到 meta 帧时不带
      message_id:
        type: string
        required: false
        note: 本轮 meta 帧给的 message_id；还没收到 meta 帧时不带
      schema_version:
        type: string
        required: true
        note: 诊断字段（03 §4.7）；这四个事件不针对某一张卡，填 "unknown"
      bridge_version:
        type: string
        required: true
        note: 诊断字段（03 §4.7），按诊断字段一条取；取不到填 "unknown"
      config_version:
        type: string
        required: true
        note: 诊断字段（03 §4.7，来源见 04 §10.1）；/v1/config 还没拉到时填 "unknown"
      h5_release:
        type: string
        required: true
        note: 诊断字段（03 §4.7）；Agent 页是原生页，填 "unknown"
      type:
        type: string
        required: true
        note: 那一帧 event 行的类型名，超过 64 个字符只取前 64 个；不带 data；同一 run 里同一个 type 只记一条（03 §7.2）
  app_launch:
    description: App 启动（字段待定）
    source: 规划/03 §4.7
    fields: {}
  page_view:
    description: 页面浏览（字段待定）
    source: 规划/03 §4.7
    fields: {}
  exposure:
    description: 卡片曝光（字段待定）
    source: 规划/03 §4.7
    fields: {}
  click:
    description: 点击（字段待定）
    source: 规划/03 §4.7
    fields: {}
  search:
    description: 搜索（字段待定）
    source: 规划/03 §4.7
    fields: {}
  convert:
    description: 转链（字段待定）
    source: 规划/03 §4.7
    fields: {}
  h5_white_screen:
    description: H5 白屏（字段待定）
    source: 规划/03 §4.7
    fields: {}
families:
  funnel_first_order:
    description: 首单漏斗事件族 funnel_first_order.*（具体事件随漏斗任务补）
    source: 规划/03 §4.7
