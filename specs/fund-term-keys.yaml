# 资金术语键清单（唯一一份机器可读清单；规划/08 BR-TEXT-12 细则「资金术语键」，规划/04 §11.2 权限点
# content.fund_terms）。后台权限守卫（能改文案键或通知模板的每个写入口共用的同一个键级检查）与 CI 都读本文件，
# 不按键名另猜；本文件与 08 不一致时以 08 为准修本文件。归类与例外表的改动按资金类评审。
#
# 结构（packages/contracts-ts/scripts/fund-term-keys.ts 校验，pnpm contracts:check 里跑）：
#   fund_terms / ordinary   两段，各有三个列表：
#     prefixes          键名以它开头的全部键归这一段（按字符串前缀比对，如 error.303 命中 error.30301.x）
#     keys              单列的键（整键相等才命中）
#     notify_templates  通知模板编码（contracts/enums/ops.yaml notify_template_code；一个编码下的全部变体随编码归类）
#   exempt                  例外表 {key, reason}：只收归 ordinary、而默认文案命中关键词核对的键——带金额变量
#                           （④ {amount} {rebate} {rebate_sum} {sum} {promo_sum} {net} {fee} {tax} {max}）、
#                           用到 BR-TEXT-01 术语对照表「用户词」、或含「返利」「收益」「提现」「到账」「余额」
#                           「冻结」「扣回」「结算」「入账」「抵扣」之一；没有理由 CI 失败。关键词只作辅助核对，
#                           不决定归不归资金术语。
#   检查：contracts/texts.default.json 的每个键、notify_template_code 的每个编码都恰好落在一段里（前缀或单列命中）；
#   没有归类或两段都命中即失败；两段的前缀互不为前缀，单列的键不被另一段命中。新键、新模板须先归类才能合入。
#   守卫：清单里查不到的键或模板按资金术语处理，并提示先归类。
#   ordinary 段只用 08 写明整组归普通的前缀，其余逐键列出，不用 external_page. 这类整前缀
#   （external_page.product_unresolved 单列资金术语）。
#
# 08 列了、texts.default.json 里还没有的键（jump_tip）照 08 先归类；08「还没有取键名的资金文案」取键名后补进 fund_terms.keys。
# CT-26p：08 BR-TEXT-12 细则（2026-11-05）单列 order.tag.price_compare（按 ② 归入）、rebate_estimate（①⑤）、rebate_compare（②）
# 归 fund_terms；后两键 CT-16f 已登记。
# CT-16f：agent.earnings. 按 08 写作前缀归 fund_terms；08 未写归类的新键按认定规则归类：rebate_estimate、rebate_compare
# （「以结算为准」是 08 列的比价区间后缀）、home.guest_value.login（「登录领返利」，拿不准按资金术语）归 fund_terms，
# price_basis、price_basis.general、home.guest_value.desc 归 ordinary（编排者默认，待规划回写）。
# P1 订阅提醒模板 watch.price_drop.* 进 notify_template_code 时归 fund_terms（BR-WATCH-14）。
# invite.reward.tip 归 fund_terms、invite.post_login.optional_hint 归 ordinary（BR-TEXT-12 细则，2026-10-19）；
# invite.reward.tip_inviter 08 未写归类，与 invite.reward.tip 同为带 {amount} 的奖励句，归 fund_terms（编排者默认，待规划回写）。
# CT-16g：08 未写归类的第 2 批键按认定规则归类：说提现照常或暂停、提现前置条件的 appeal.form.desc.order / .frozen、
# appeal.progress.scope.order / .frozen、labor_agreement.resign_hint，找回结果 claim.records.status.approved / .rejected / .auto_tracked，
# 与 appeal.progress.result_pending.order 归 fund_terms（拿不准按资金术语）；reverify.、payout_account.、agent.card.、
# appeal. 其余键、claim.records. 其余键、order_list.claim_entry 逐键归 ordinary（编排者默认，待规划回写）。
# CT-16h：站内信标题 inbox.title. 整组归 fund_terms（对应通知模板 08 l.670 全部归资金术语）；08 未写归类的第 3 批键按认定规则
# 归类：说提现暂停、恢复或进行中提现的 risk_notice.frozen.*、risk_notice.withdrawal_label、appeal.result.lifted_frozen.title /
# .go_wallet、appeal.result.next.frozen_others，说推广收益与邀请奖励的 invite.share.promo_label / .promo_where / .reward_title /
# .reward_rules / .rule.no_reward 归 fund_terms（拿不准按资金术语）；risk_notice.、appeal.result.、me.、invite.share. 其余键、
# invite.poster.、favorites.、messages.、settings. 逐键归 ordinary（编排者默认，待规划回写）。
# CT-16j：08 BR-TEXT-12 细则（2026-10-22 D10-135）写明：agent.tool_status.get_rebate_quote.* 单列归 fund_terms（整组写作前缀）；
# agent.suggest.clarify.*、agent.tool_status.search_products.*、agent.tool_status.default.* 整组归 ordinary（写作前缀），
# agent.notice.platform_unrecognized 逐键归 ordinary。
# CT-16i：08 未写归类的第 3 批「我的」下半键按认定规则逐句复核：说余额、预估收益放弃与去提现的 deletion.funds.*、
# 用到「待抵扣」的 deletion.negative.desc、说冷静期内不能提现的 deletion.cooling.readonly_note、说提现已暂停的
# help.appeal.state_frozen 归 fund_terms；deletion. 其余键（含 .agree_hint、.pending.apply_blocked、.cooling.withdraw /
# .withdraw_note，原句只说勾选与验证身份、不能重复申请、撤回注销，不说金额或提现）、bind_phone.、phone_change.、step_up.、
# help.、cs.、about.、net.、web_page. 与表 B 场景子键 error.30101.auth_unavailable.auth_manage、
# error.30102.auth_unavailable.auth_manage、error.30151.auth_manage（去掉了「无法获得返利」半句）、error.30411.phone_change
# 逐键归 ordinary（任务书 9.2 默认经逐句复核，待规划回写）。
# CT-26t：08 BR-TEXT-12 细则（2026-11-05 商品详情 v3 定稿）写明：btn.buy.rebate、btn.buy.rebate_unknown、no_rebate.notice、
# favorites.no_rebate.notice、jd.plus_note 归 fund_terms；coupon.、product.gallery.、platform.tag.、shop.、price_trend. 新键、
# feedback.、favorites.no_rebate.clear 归 ordinary，逐键列出、不加前缀（免得吞掉以后的资金术语键）。coupon.tag 的 {amount}
# 是券额，进 exempt 是编排者的技术处理（08 未写）。
# CT-09s：08 BR-TEXT-12 细则（2026-11-06 DSX-01）写明：BR-TEXT-14 表 C 通用状态键 state.value_missing.a11y 单列归 fund_terms
# （按 ③，出现在余额与返利金额的位置）；state.loading、state.load_failed.title / .desc、state.timeout、state.retry、
# state.empty.default 逐键归 ordinary（不用 state. 整前缀，因两段不能同时以前缀与单列命中同一组）。
