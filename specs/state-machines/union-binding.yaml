# 联盟绑定 union_bindings.status（union_binding_status）的状态机（规划/04 §4.4 枚举行与状态机表 4.4 行；规划/08 BR-ID-19、BR-ID-20、BR-ID-21
# 正文与细则，解封见 BR-ID-31；契约 contracts/enums/identity.yaml 的 union_binding_status；迁移 db/migrations/0018_linking-bindings.sql
# 的 union_bindings_status_check；任务 CT-10a）。迁移表只在 08 维护；本文件按 SPEC_REF 转写，生成
# packages/domain/src/state-machines/union-binding.gen.ts（node packages/domain/scripts/state-machines.ts；--verify 只比对）。
# 生成物勿手改，改这里再生成。
#
# 写法约定（同 CT-04a、CT-04e）：
# - from 中 null 表示「—」（还没有绑定行：用户授权直接插入 active 行）。
# - guard 只是规则文字说明，transition() 不求值；唯一约束、冷却判断（released + cooldown_until）、30151 / 30153、
#   row_version CAS、audit_logs 与副作用都由服务层（linking，union_bindings 的唯一写者）负责。
# - 事件按目标状态命名，每个事件只进入一个状态：停用原因 blocked_reason（ban / admin_disable / deletion）、重置授权
#   （reason=admin_reset）、巡检、解封、恢复返利都不拆事件，由 guard 文字与调用方写入的列表达。
# - 状态值与契约 union_binding_status、0018 的 CHECK 一致（小写蛇形）；不设 cooling（冷却用 released + cooldown_until，BR-ID-19）；
#   事件用大写蛇形名。
# - 边集合与现行唯一入口 apps/api/src/modules/linking/domain/binding-status-transitions.ts 的 canTransitionBinding 逐边一致
#   （approvals #26 例外；B1-06zm 换用生成的 transition()）。
#
# 表外说明：
# - 只有下面十行迁移，其余组合一律为表外事件；同状态不是迁移（不写库）。
# - unbound、pending_auth 不作任何迁移的目标：unbound 不落库（BR-ID-19 细则），pending_auth 为保留取值、不产生（BR-ID-19 细则）。
# - blocked 不能直接回 active：解封与恢复返利先回 invalid（BR-ID-20）；其他联盟「直接回到 active」由服务层在同一操作内
#   接着走 invalid → active（U4）。blocked 不能重置授权（BR-ID-20 细则「重置授权的适用范围」）。
# - released 只能由本人在冷却期内恢复回 active；冷却结束后再授权是新建行（U1）。
name: union-binding
field: status
states: [unbound, pending_auth, active, invalid, released, blocked]
# ACTIVATE 进入 active；INVALIDATE 进入 invalid；BLOCK 进入 blocked；RELEASE 进入 released。
events: [ACTIVATE, INVALIDATE, BLOCK, RELEASE]
transitions:
  - id: U1
    from: [null]
    event: ACTIVATE
    to: active
    guard: '用户授权成功且通过唯一校验，直接插入 active 行（授权进行中只记在 union_auth_sessions，pending_auth 不产生；冷却结束后他人或本人授权同一 relation_id 也是新建行，BR-ID-19）'
    test_id: SM-UB-U1
  - id: U2
    from: [unbound]
    event: ACTIVATE
    to: active
    guard: '用户授权成功且通过唯一校验；unbound 不落库、现写者不产生，0018 CHECK 允许的投影值作为显式边保留（BR-ID-19 细则「unbound 不落库」）'
    test_id: SM-UB-U2
  - id: U3
    from: [pending_auth]
    event: ACTIVATE
    to: active
    guard: '用户授权成功且通过唯一校验；pending_auth 为保留取值、不产生，存量行仍经此入口（BR-ID-19 细则「pending_auth 不产生」）'
    test_id: SM-UB-U3
  - id: U4
    from: [invalid]
    event: ACTIVATE
    to: active
    guard: '淘宝重新授权拿到同一 relation_id，更新原行、不改 bound_at（不同 relation_id 视同换绑返回 30151、原行保持 invalid，BR-ID-21）；拼多多等其他联盟解封或恢复返利后直接回到 active（BR-ID-20）'
    test_id: SM-UB-U4
  - id: U5
    from: [released]
    event: ACTIVATE
    to: active
    guard: '本人在冷却期内（cooldown_until > now，由调用方判断）且尚未绑定其他账号时授权回原 relation_id，原行恢复 active，清空 released_at 与 cooldown_until（BR-ID-19）'
    test_id: SM-UB-U5
  - id: U6
    from: [active]
    event: INVALIDATE
    to: invalid
    guard: '每日巡检判定淘宝备案失效：复核为未备案或 relation_id 不一致，或可匹配 link_log 但 relation_id 为空的订单连续 3 笔；查询失败不改状态（BR-ID-21）'
    test_id: SM-UB-U6
  - id: U7
    from: [blocked]
    event: INVALIDATE
    to: invalid
    guard: '淘宝绑定 blocked_reason=ban 在解封后（BR-ID-31）、blocked_reason=admin_disable 经后台「恢复返利」改为 invalid，用户须重新授权（BR-ID-20）；deletion 不走此边'
    test_id: SM-UB-U7
  - id: U8
    from: [pending_auth, active, invalid]
    event: BLOCK
    to: blocked
    guard: '封禁（ban）、后台「停用返利」（admin_disable）或注销（deletion），同次写 blocked_reason；被封禁用户注销时保持 ban（BR-ID-20）'
    test_id: SM-UB-U8
  - id: U9
    from: [active, invalid]
    event: RELEASE
    to: released
    guard: '后台「重置授权」（reason=admin_reset，只作用于 active、invalid），写 released_at=操作时刻、cooldown_until=released_at + bind.rebind_cooldown_days（BR-ID-20）'
    test_id: SM-UB-U9
  - id: U10
    from: [blocked]
    event: RELEASE
    to: released
    guard: '只限 blocked_reason=deletion：每日释放任务在注销 done_at 满 180 天后置 released，released_at=任务运行时刻、cooldown_until=released_at + bind.rebind_cooldown_days；ban、admin_disable 永不自动释放（BR-ID-20）'
    test_id: SM-UB-U10
