    note: '编排会话按 规划/11 §7.1 第 5 行例外决定（门禁流程小改动，含第二类保护路径 vitest 配置与 package.json 脚本的追加）：只新增，不改现有配置的收录范围、不改必需检查、不放宽任何判定。起因是 QA-03（整条资金链路的回放 E2E，规划/05）要开工时发现先红执行计划没有认领 test/replay 的分组，回放场景既跑不了先红、也没有测试配置（D10-1369、D10-1372）。编排按 approvals 16 / 24 核 diff 后加标签（#3309，头 9790fa71ede2）：CI 工作流只有新增行，新作业照集成测试第 1 组的起法、动作版本沿用已固定的提交号，ci-gate 的依赖与判定一行未动；先红分组文件只在末尾追加一组；原有工具测试里只有一条期望随之改变（test/replay 下的文件不再是「无人认领」），并新增用例钉住「只用原五组时它仍无人认领」「replay 目录只被新组认领」。verify-replay 先不挡合并：红了看得见，等 QA-03 三段做完且连续稳定后由编排另行决定转为必需项。第一版曾在配置里打开 passWithNoTests，被仓库守卫 test-guard 拦下（任何配置都不许打开，防没有测试也算通过），改为由 CI 作业先查有无场景、没有就跳过（D10-1389），编排核了这一处增量。Codex general 通过。事后向负责人报告；D10-1369、D10-1370、D10-1372、D10-1379、D10-1389。'
