    note: '编排会话按 规划/11 §7.1 第 5 行例外决定（门禁流程小改动）：只给「规则变了、冻结用例必须跟着改」这种情形一个如实的名字和更多的留痕（必须写明依据的 BR、BR 必须在任务引用内），不放宽任何判定——rule_change 在每一处走的都是 tighten_only 的同一段校验再加 br，凡能用 rule_change 通过的写成 tighten_only 也能通过，反过来不成立；仍须批准标签、改前改后原文逐字核、反向验证记录。起因是 B3-08zc 四条用例按新规则改写时只能借 tighten_only 落账（D10-1297、D10-1299 ③）。编排按 approvals 16 / 24 核 diff 后加标签（#3285，头 20c827eaca73）：编排通读实现，另派只读独立评审对照基线逐处核对并在内存里试了 16 种台账写法，两边一致——无 S0 / S1；余下一处文档措辞（写清 rule_change 可按新规则改期望、资金与归属用例的期望改动仍须负责人确认）和几项加固（br 在引用内的检查下沉到解析层、补两条拒绝路径的测试）并入 ops 下一张单。工具不核的四件事（BR 是否真变过并与改写对应、裁定号、反向验证是否真跑过、改写方向）仍由编排加标签时人工核；资金与归属用例的期望改动或削弱仍属 #24 四类，须负责人本人确认（D10-1356）。Codex 额度用尽，ops 用独立 Claude 评审（approvals 36）；工具测试 204 条通过。事后向负责人报告；D10-1299、D10-1334、D10-1356。'
  - id: 80
    row: 4
    title: 'B3-08zc 任务专属一次性追加：实现第 4 轮与随后的代码评审增量一轮——只改断线补写结果链（agent_result_chains）的口径：不再按链号去重，改为对断线期间的每个商品列表结果集按回执先后逐个追加，与正常路径逐回执追加共用同一口径（最后一张生效）；另加一条正常路径与断线补写的对照用例。改动限 apps/api/src/modules/agent/stream/pg/deliveries.ts 与其调用到的追加函数及对应测试；其余口径与轮次上限不变'
    granted: true
    date: '2026-11-12'
    note: '编排会话按 规划/11 §7.1 第 5 行例外决定（轮次属门禁流程小改动）：代码评审已用满三轮，第 3、4 次评审连着在同一处（断线补写结果链）各报一条 S1，都是补写另起了一套与正常路径不同的去重口径造成的——先是同一轮两次不同搜索跳过后一张，再是同一查询词不同价格上限时把第二批当重复跳过，下一轮「换一批」会用错条件。按「三轮不过重新考虑做法」处理：不再修补那套去重，改为补写与正常路径共用同一个追加口径，并用一条对照用例钉住两条路径写出的结果链逐行相同，从根上去掉再出分叉的可能。收口：这是本任务最后一次追加轮次；增量评审若仍在这一处报 S1，停下报编排，改为本 PR 不带断线补写结果链、该场景整体转 B3-08zd——撤回补写结果链的那一步与只审这步撤回的一次评审属本条范围。实际结果（2026-11-12 22:56）：这一轮照做后，增量评审仍报一条 S1（断线后同一轮先出列表、再有一次无结果的搜索时，终态补写把较早的条件重新设为当前——终态才补写天然丢了与搜索尝试的先后顺序），已按收口执行，断线补写结果链（保序）转 B3-08zd，在对外开放名单前必须完成（D10-1361）。不改金额计算、订单归属与授权规则，不放宽密钥扫描，不删不削弱资金测试；事后向负责人报告；D10-1347、D10-1360。'
