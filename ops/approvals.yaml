    title: 'CT-06zzzzy：verify-container 的本机校验槽位加固——取槽时持有者文件改用硬链接放置（不覆盖已有的）并回读核对自己的令牌，不是自己的就记「lost the verify slot while taking it」、回去排队；持槽的运行在起服务和起校验容器之前再核对一次令牌，不是自己的就退出 2、不起容器、不写 result.json；两个 --fast 同时启动那条用例的断言信息带上两个运行的 stderr、容器起止时间和槽位快照，断言不变；新增六条确定性用例。--red、--browser 与判定逻辑不变'
    granted: true
    date: '2026-11-13'
    note: '编排会话按 规划/11 §7.1 第 5 行例外决定（门禁流程小改动）：只收紧互斥，不放宽任何判定。起因是 #3273 的 CI 上「two --fast runs started together never run their containers at the same time」红过一次，ops 诊断确认那一次两个运行的容器确实同时在跑（每个运行有自己的容器调用日志，排除测试对错运行；整条用例 1.8 秒而两个容器各睡 1 秒），具体路径 440 次加压仍未复现（D10-1365、D10-1367）。后果是测试机上两个重任务可能同时跑、挤占资源，不影响判定结果对错，所以没有停线。编排按 approvals 16 / 24 核 diff 后加标签（#3301，头 3835fb79db93）：逐行读脚本改动——原先写持有者文件用改名、会盖掉别人的，现在用不覆盖的硬链接加回读，两个运行抢同一个新建目录时只有一个能放上自己的持有者文件；放不上的一方状态归零、照常等待，释放时不动别人的锁；起服务与起容器前的三处核对在不持槽的模式下是空操作。旧用例的断言逐条对过，只加了失败时的说明文字。保留说明：根因路径仍未钉住，同样情形再出现时运行会在起容器前退出、不再重叠，那条用例仍会红并直接写出原因，届时据此再查；该用例的断言在判明前不放宽。Codex general r1 通过。事后向负责人报告；D10-1365、D10-1367、D10-1368。'
