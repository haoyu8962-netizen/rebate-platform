    title: 'CT-06zzzzx：工具测试 tools/ops/verify-container-slot.test.ts 的「[CT-06zzzx] a live holder: --fast waits, reports the holder and the time waited, and runs once the slot is free」偶发红的修正（flake_fix）——等待报告里允许最多一行「an unknown holder」且必须是最后一行（持有者放锁的那一刻，等待方在建锁失败与读持有者文件之间读到空）；其余等待行仍须带持有者任务号、pid 与已等秒数，且不少于两行；该用例其余断言与 verify-container.sh 本身不变'
    granted: true
    date: '2026-11-12'
    note: '编排会话按 规划/11 §7.1 第 5 行例外决定（门禁流程小改动）：只改一条工具测试的断言口径，不动被测脚本、不动任何判定。起因是 #3273 的 CI verify-unit 在这条用例上偶发红（Received「waiting for the verify slot held by an unknown holder (no owner file in …/slot.lock): 3s of 30s」），与该 PR 的改动无关。编排按 approvals 16 / 24 核 diff 后加标签（#3295，头 4f4164c2bd3b）：改动 11 行，放开的只是「放锁那一刻的一行」，并且限定最多一行、必须是最后一行；等待期间报告持有者与已等时间这一条性质仍由不少于两行带任务号与 pid 的报告钉住。ops 如实记录：修前本机 40 次加窗口探针没有复现，修后本机连跑 40 次全绿；Codex general r1 通过。同一文件另一条用例「two --fast runs started together never run their containers at the same time」在 #3273 重跑时也红过一次（容器执行时锁的持有者是另一个进程），那一条可能是槽位锁本身的竞态，不在本条范围，已交 ops 先判明是测试问题还是真问题，判明之前不放宽它的断言（D10-1365）。事后向负责人报告；D10-1365。'
