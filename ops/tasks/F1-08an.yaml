repo: rebate-platform
title: F1-08an：提现审核页【批量自动打款】、一键组批与各页签计数（adminCreatePayoutBatch，payout.execute + 动态码；listAdminWithdrawals 的 total）
type: impl
# 2026-11-18 入账（前端线 fe，编排 D10-2017：be 核出缺口乙类里后端已有的项，couli-runs/BE-codex/gap-plan-B11-15-20261118.md 第一张表；排在 F1-08al → F1-08fc → 导出记录页 → 小链接之后）。
# 范围：apps/admin/src/pages/withdrawals/WithdrawalsPage.tsx 与批量栏。持 payout.execute 时勾到 APPROVED 单出【批量自动打款】（确认对话框列将处理与跳过的单、执行前检查与后果 → 动态码 → 只发一次 POST /admin/v1/payout-batches，1–200 单；整批拒绝原因与逐单结果如实显示，部分成功不报全成）；一键组批按 listAdminWithdrawals 已有的 hold_reason / blocked 筛选选中可执行单（纯前端，不另发写请求）；各状态页签计数用每个页签一次 page_size=1 的 total（D10-2017「各页签取一次总数」）。与 F1-08al【批量手动打款】同一批量栏、各管各的勾选子集。顺手更新 WithdrawalsPage.tsx 头部 TODO（【导出】等 be ③ 契约、「自动到账设置」另见 F1-08ap）。
# 资金写操作（RV2）：money 评审。
# 写测与评审：Codex 额度用尽（D10-2003），规则测试与首轮评审由无上下文的独立 Claude（claude-run.sh），证据如实记 claude-independent。写测时发现冻结用例（入口清单、只读断言、TODO 对应的「不出现」断言）受影响，先报编排再补 modify_existing（D10-1712 / D10-1899）。写操作一律照 F1-08ce 结果未知处理（D10-1731）。
# 2026-11-20 补丁 1（fe，编排 D10-2167，同 D10-1733 / D10-1899 / D10-2100）：写测第 1 轮报冻结冲突——本单【一键组批】持 payout.execute（超管）时不勾选也可用，F1-08a [AC-F1-08a-READONLY#1] / [#3]、[AC-F1-08a-BROWSER#1] 与 F1-08ai [AC-F1-08ai-ACCESS#1] 的全量权限 / 超管写入口须为空。改法：入口清单改为「恰为当时已落地的入口」（toEqual 严格相等，持 payout.execute 或超管时恰多【一键组批】、不点它；【批量自动打款】未勾选仍禁；无 payout.execute 的角色一字不变并保留看不到【一键组批】的反向用例）；admin-withdrawals/helpers.ts 的 assertReadOnly、admin-withdrawal-batch-approve/helpers.ts 的 assertNoOtherActions、pages.browser.test.ts 顶层 WRITE 只做纯插入（加可选的「已落地入口」参数：不传参时行为逐字不变、禁词表不删；传入的入口同时断言确实在），按文件级 scope: support 登记。每份冻结测试文件各补 1 条本单新块在主干上红（D10-1812）。页签计数若改变 server.reads() 次数，按 D10-2167 ③ 改成新的确切次数、逐条另登。金额、请求体、揭示断言不动。
