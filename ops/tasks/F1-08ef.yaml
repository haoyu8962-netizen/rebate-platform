# 2026-11-27 fe 入账（编排 D10-3413 / D10-3415；范围稿 couli-runs/F1-08ee/planB/scope.md）。依据：规划 docs/changes/20261121-对外差错单方案B.md §2、design/specs/admin-recon.md §2 末行与 §7「对外差错单的处理入口」（D10-2317 ② / D10-2361）。取代作废的 F1-08ee / F1-08eec（旧分支不变基、原样留档，申诉恢复部分的旧实现只作参考）。
# 只做（写死）：apps/admin/src/pages/recon/ 差错单详情抽屉——
#   ① 申诉恢复：类型 appeal_restore / platform_restore、状态待处理 / 处理中、持 order.restore 时出【确认恢复】（restoreAdminReconDiff，POST /admin/v1/recon-diffs/{id}/restore，不做二次验证（D10-3425 ①：BR-ID-34 none 清单、契约无 x-step-up）；Idempotency-Key 必填；请求体恰为 {} 或 {note}）；恢复类的关闭入口仍为【已关闭（不处理）】、走现有关闭流程不变（D10-3425 ②；appeal_restore 不带提现冻结）；恢复范围与补发合计按规格 §2 只读展示（取详情 resolution），不在前端推算金额；成功以服务端返回为准刷新；20902（recon_diff / order）提示并重读；结果未知锁定、只许原键原体重试，拿到确定答复才解锁（D10-1731 / D10-1739）。
#   ② 联盟对账不一致：类型 union_mismatch、状态待处理 / 处理中、持 order.view 时出【去订单详情】（跳订单列表，条件 q = 子订单号、platform = 平台，取自差错单 ref_type=order 的 ref_id；ref_id 的拆分规则写测前对 04 §3.2 order_key 原文核）与【按单号手动同步】（复用 pages/orders/sync.ts 的 useSyncRequest，只读引用、不改它；体 {platform, order_nos: [子订单号]}）；订单级处理完照旧用【已关闭（不处理）】结案。
#   ③ 任何类型都不出【去调账】（服务端已拒绝人工关联联盟 / 通道对账差错单的调账，B2-17 ④）；ledger_mismatch 与其余类型不加入口；channel_mismatch 的【追回】不在本单（F1-08eg，等 B2-17a 契约）。④ DetailDrawer.tsx 文件头过时的 TODO（「申诉恢复、去调账、重算余额缓存 — blocked on 契约未出」）改成现状。
# 不做：不改契约、pages/orders/**、pages/adjustments/**、components/**；不加依赖。
# 资金单（编排 D10-3415：【确认恢复】会让钱重新入账）：规则测试 Codex 写、规则测试评审归无上下文的独立 Claude（tester codex，approvals 第 19 条；第 1 轮全量）、Codex 资金评审（money 口径）。写操作的结果未知处理照 F1-08ce / D10-1731。写测时若列出现有 recon 冻结用例要改，先报编排再补 modify_existing。
# 止损（D10-3412）：非 S0 的问题 3 轮内未收住即登 FU、证据照实写、放行；资金评审照 11-22 止损（退回已评过的写法或暂停，门禁不豁免）；只有属实 S0 才开一次性追加。
# 台账补丁 1（2026-11-27，编排 D10-3425 / D10-3467）：上面三处注释已更正（原写「动态码档」「【不恢复并关闭】」「Codex 全量 spec-test」是入账时写错）。title 里的【不恢复并关闭】是入账时写错，实际按 D10-3425 ② 沿用【已关闭（不处理）】（已存在台账的 title 不改，D10-3492）。deps 加 B1-18lb：主干 specs/permissions.yaml 的 order.restore 仍是 step_up_tier totp，服务端改为 none（B1-18lb 分支已改为 null）之前本单不落地；若负责人定 B1-18lb 暂停，改指编排另开的只改这一项的后端小单。实现 2 起首次 10003 判为确定拒绝（服务端写入前就拒）。FU：FU-F108EF-RESTORE-UNKNOWN-RELOGIN（结果未知后重新登录原键丢失，资金评审 r1 S1-2 降级，D10-3467）、FU-ADMIN-RECON-STEPUP-TIERS、FU-PLAN-ADMIN-RECON-SPEC-STEPUP（D10-3425）。
