title: 后台提现单详情：【审核通过】【驳回】（adminBatchApproveWithdrawals 单张、adminRejectWithdrawal；withdraw.review + 动态码）
type: impl
# 2026-11-14 入账（前端线 fe，编排 D10-1517 第一批 ①，提现审核写操作的第 1 张，三张依次做、不并行）。规格 couli design/specs/admin-withdrawals.md 与 admin-withdrawal-detail.md（负责人 2026-10-18 后台第 2 批定稿），写操作以主干契约为准：通过用 POST /admin/v1/withdrawals/batch-approve 传这一张（契约没有单张 approve 操作，规格 §4 的 adminApproveWithdrawal 是暂拟名）；驳回 POST /admin/v1/withdrawals/{id}/reject，原因码按契约枚举 Radio 必选、每项下方显示用户可见文案（BR-TEXT-08），内部备注可选。
# 范围：只做详情页这两个按钮与对话框、结果后刷新详情；状态与权限显隐按 BR-WDR-10 / BR-WDR-11（服务端为准）。不做：执行打款、手动成功、撤销微信转账、重新计算风险标签（契约里没有对应单张接口或属 ②）。
# 2026-11-14 台账补丁（编排 D10-1523 ①）：refs 补 BR-WDR-05、BR-WDR-10、BR-TEXT-08；两份 F1-08a 冻结只读测试随本单改（rule_change），改动由不是原写手的一方做。驳回原因的用户文案键由后台与工作台线补（D10-1523 ②），补齐前只显示原因码中文名。
# 资金页面（apps/admin/src/**/withdrawals/** 属 RV2）：规则测试 Codex 写、独立 Claude 审；实现 Claude Opus；代码评审 money。写操作每次 StepUpModal（totp 档，BR-ID-34），提交中禁用、对话框保留，CAS / 状态已变（20902）提示后刷新；按钮按状态与权限点隐藏不置灰（规格 §6）；金额只经 @couli/money。任务书带 D10-1477（本机不裸跑全量检查）、D10-1503（推送前测试机 verify:fast）。
