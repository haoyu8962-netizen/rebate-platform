# 范围：只新增用例，放新目录 test/spec/frontend/admin-withdrawal-manual-paid-controls/，可导入 F1-08al 的 admin-withdrawal-manual-paid 夹具与帮手，不改任何已有文件。对话框刚打开（未填写）时，把对话框里全部表单与可交互控件——输入框（input / textarea / role=textbox / spinbutton）、复选框、开关（role=switch）、单选、下拉（select / role=combobox / listbox）、输入框前后缀里的可点击图标、以及 button / a / role=button / role=link——按「角色 + 名字」整份列出，与期望清单逐项相等（toEqual），多出任何一个就红；填写后与提交结果显示时各再核一次清单不新增快捷控件。
