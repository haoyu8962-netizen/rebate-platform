# 2026-11-09 content 入账（D10-1183，承 D10-1182 核查）。notification/application/appeal-result-message.ts 现对三个变体都写 route: null。改为：载荷 target_type=order 时（order_revoked 与维持 upheld）route 为 OrderDetail、params {order_id: target_id}（同其他订单消息的写法，如 clawback-message.ts 的 DeductionRoute），target_type=account 仍为 null，blocked_request 仍不发。只改这一处与对应单测；模板、变量、渠道（只发站内信）不变。08 BR-TEXT-23 由编排下一批回写，refs 先指现有条目。排在 CT-26zi 之后。
# D10-1189：冻结 appeal-result-message 的 [AC-B1-12p#1/#8/#18/#21] 对全部变体钉 route 为空，照 D10-327 由新鲜独立 Claude 只把订单变体（target_type=order 的 revoked / upheld）的 route 期望改为 OrderDetail{order_id=target_id}，账户行与其余断言不动（回调按 target_type 取期望，故整表各行登记 modify_existing）；另一位只读复核；落地按 #24 核。
