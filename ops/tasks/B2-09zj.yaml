title: FU-PAYOUT-W6-RATIO-ALERT：提现打款失败率与连续失败告警——worker 指标（当日 W6 / W5+W6 / 末尾连续 W6）与 couli-fund.yaml 两条规则，删第 18 行过时 TODO（BR-WDR-24 前两项，D10-1157）
type: impl
# 2026-11-09 ops 入账（D10-1155 ② 只读核对 couli-runs/OPS-lane/w6-ratio-alert-check-20261109.md，D10-1157 定开单，排在 B2-09ze #3028 之后）。
# 口径（BR-WDR-24）：① 每个 app 的自然日（+08:00，用 packages/domain 的会计日函数）内 W6 次数 ÷（W5 + W6 次数）> 2% 且分母 ≥ 20，不计 W8、W10；
#   ② 按 W5 / W6 迁移时间排序，末尾连续 3 次 W6（不限当日）。数据都在 payout 自有表，不加迁移：W6 = withdrawals.status FAILED 且 manual_resolution
#   为空（W10 判 FAILED 的单 manual_resolution = failed），迁移时间取该单最后一条 payout_attempts.result = fail 的 at；W5 = status PAID_API 且
#   manual_resolution 为空，时间取 paid_at；PAID_MANUAL（W8）不计。W9 的转账尝试也是 fail，但单子回到 APPROVED，不算 W6。
# 做法照 B2-09j / B2-09ze：payout 只读口经 entry.ts 接线，只 worker 导出、缓存与读失败即抓取失败同 water-low；指标名由实现定（建议
#   couli_withdrawals_w6_today / couli_withdrawals_w5w6_today / couli_withdrawals_w6_streak，均带 app_id），规则带 fund: 'true'；删 couli-fund.yaml:18 的 TODO。
# 现状：payout.definite_fail_codes 种子为 []，W6 发生不了；**填 payout.definite_fail_codes 的单（BR-WDR-28 验证）台账须 deps 指向本单**，防止先填值后补告警。
# RV2：新鲜独立 Claude 写规则测试，Opus 实现，Codex money（medium）评审。冻结测试两处照 B2-09ze 先例预先声明，测试轮发现别的再补台账。
