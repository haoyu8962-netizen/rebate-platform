title: 'B2-02zb：先用例证实「重算下调后下一笔正常入账被负余额来源自检（07）误判」，属实出 07 新版本（D10-2219 新单 C）'
type: impl
# 2026-11-20 be 入账（D10-2219 ④，负责人 B/B/B；方案 couli-runs/LEDGER-REVIEW-1120/be-plan-A-B-C.md）。排在新单 A（日终自动更正）之前：A 让重算变常见。
# 依据：分录 balance_after_fen 取自过账时的余额缓存（ledger.ts 过账处 target.after.*）；07_negative-balance-drops.sql 用 LAG 与前一条 balance_after_fen 比、查全量历史。
# 推断：缓存被重算下调（如 100 → −50）后，下一笔正常入账（COMMISSION +10，余额 −40）低于前一条（以旧缓存为底的 100）→ 被判「降到负且下降、类型不在白名单」。
# 规则测试（独立方写，先红即证实）：在库里造「过账 → 缓存被改 → 按分录重算写回缓存 → 再过一笔正常入账」，跑 07 期望该笔不报；对照：真正的扣款（非白名单类型、本条 amount<0
# 且落到负数）仍报，白名单类型照旧不报，改派红冲照旧不报。另钉「同一差异全量历史查询每天都会再报」的现状（只作记录，去重由新单 B 管，本单不改）。
# 若先红不成立（用例在现 07 上绿）：交回证伪结论，不出新版本，本单以「无需修改」收尾。
# 等价（D10-2224，编排按 #24 核）：旧 07 的 balance_after_fen 是整张凭证过账后该子户的值（同凭证同子户多条分录同值），无重算历史时 balance_after(本凭证) − balance_after(前一凭证) = 本凭证在该子户的净发生额；
# 所以新版「下降」按（凭证、账户、子户）净发生额 < 0 判，且与旧版一样只报该组按 (account_version, id) 排第一的那条、类型白名单与改派红冲豁免也作用在那一条上，结果逐行同旧版。
# 规则测试另含一条属性测试：随机过账（多分录凭证、跨子户、首笔为负、白名单类型、改派红冲），不做重算 → 新旧两版输出的差异行逐行相同（次数 / 种子经 @couli/testing）。
# 实现（证实后）：新文件 db/invariants/ledger/11_negative-balance-drops-by-amount.sql（下降改按本凭证在该子户的净发生额 < 0 判，不再与缓存派生的前一条 balance_after_fen 比；
# 报哪一条与豁免口径同 07），superseded.json 追加 07 → 11（只增不改）。不改 07 原文件、不改 ledger 过账代码。
# 2026-11-20 补丁 1（D10-2237，money r1 S2）：07 由 11_negative-balance-drops-by-amount.sql 替代后，两个冻结夹具写死的旧文件名照 B2-04zzr / D10-1140 先例改成新文件名——test/spec/ledger/daily-check-execute/kit.ts:65（FILES['07']）与 test/spec/settlement/admin-union-receipts/kit.ts:96（INVARIANT_FILES），只改这两处（D10-1670 类，不动金额期望、不删不放宽断言），modify_existing 两条；superseded.json 的追加照 approvals 61 / D10-1150 算规则测试资产，列入 test_paths、由写测提交（approvals 一次性条目，写测第 4 次只改这三处，新鲜独立 Claude 改 + 另一位只读复审）。
