title: 'B1-08zza：拼多多订单 buy_type 按我方登记的转链记录判（PDD A′ 实现 ①）——回传 custom_parameters 的 lk 在 links 里找到且用户、商品、时序都对得上则按该链接 pid_scene 映射、scene_basis=link，否则 self / fallback；orders.scene_basis 的 CHECK 加 link'
type: impl
# 2026-11-26 be 入账（PDD A′ 拆单第 4 张「实现单 ① orders」；负责人 2026-11-25 同意 A′，D10-2970 第 6 条；编排 D10-2974 / D10-3025 / D10-3264；方案 couli-runs/PDD-lane/pid-consolidation-plan.md「A′ 定稿」②④；规划 couli#31 已在 SPEC_REF：BR-ATTR-08 拼多多按链接判、BR-ATTR-09 scene_basis 加 link；契约 CT-01f #766 已合并）。
# ① 流水线 ④（orders/application/pipeline-port.ts:311 classifyBuyType）对拼多多改为：同一事务内按 (app_id, lk) 经 linking 的 index.ts 出口提供的只读端口（现有 application/order-link-reader.ts 即 ⑤ 来源回填所用的那支，扩展或并列一个按 lk 取链接的读法）读 links（不直读对方表），把 {user_id, platform, raw_item_id, product_key, created_at, pid_scene} 交给 orders/domain 的纯函数判定——ⓐ 链接 user_id = 本单按 uid 归属的用户、ⓑ 链接 platform=pdd 且 goods_sign 相等（不等时再比 product_key，两者都不等才算对不上）、ⓒ 链接创建时刻 ≤ 订单付款时刻，全满足则 buy_type 取 pid_scene 映射（self_buy / agent / taolijin → self、share → share）、scene_basis=link；lk 缺失、查不到或任一项对不上 → buy_type=self、scene_basis=fallback。回传 sc 只作排查字段。⑤ 来源回填（BR-ATTR-15 exact）沿用同一次查询结果，不再查第二遍。domain/attribution.ts 加拼多多分支（平台规则新开关，替代 pdd.ts 的 sceneParamFallback 对拼多多的作用）。淘宝、京东行为不变。
# ② 迁移只增：替换 orders.scene_basis 的 CHECK 加 link（orders 为分区表，父表上 DROP + ADD CONSTRAINT … NOT VALID 再 VALIDATE，写法实现定；orders 不是 union_ 表，预计不算门禁改动，入账后探针核 squawk 与 APPROVED_GUARD_CHANGES）；旧值不改、旧订单不回填；迁移号 land 前取主干下一个空号；快照由 be 在 couli-ci 重生成。
# ③ CT-01f 规则测试评审 st2 留下的 S2 并入本单：订单表 CHECK 认 link；按 link 判定；人工认领 / 改归属时保留原 scene_basis（不被改写成别的值）——具体落点探针定。
# 此时仍是四推广位，规则对四推广位同样成立（link 的 pid_scene 与推广位场景一致），可先于实现 ②（单推广位取位、三处场景核对、必带 lk）上线；不在本单：getActivePid 单推广位、link-registration / link-open-conversion / pdd-authority 的场景核对、拼多多必带 lk、catalog 查询位、ops 退役推广位。冻结用例清单入账后探针定，撞了按 modify_existing 补登（属归属类，只走 rule_change，负责人确认）。
# 补丁 1（2026-11-26，编排 D10-3278，四推广位期间的过渡口径，到实现 ② 为止）：拼多多回传**带 lk** → 按链接判（用户 / 商品 / 时序都对得上 → 该链接 pid_scene、scene_basis=link；对不上或 lk 查不到 → self / fallback）；回传**完全没带 lk** → 仍按推广位判（现行 classifyBuyType，scene_basis=pid，与今天一致）。做成规则表字段「缺 lk 时的依据」pid | self（拼多多默认 pid），实现 ② 落地时切 self；不许写平台字面量分支；classifyBuyType 三参签名与行为不动，按链接判另做纯函数。规则测试须钉：带 lk 对得上 / 用户不符 / 商品不符 / 时序不符 / lk 查不到各一条；缺 lk 时该字段 = pid 与今天一致、= self 时为 self（两个取值都钉）。探针（couli-runs/B1-08zza/tests/1，原型一律 self 红 124 / 43 文件）显示严格口径撞大量资金夹具（拼多多无 lk），故分步；「lk 缺失 → self」的夹具补 lk + links 行登 FU-PDD-NO-LK-SELF-AT-IMPL2（实现 ② 前置）。带 lk 的 source-backfill/fresh.int.test.ts [AC-B1-08j#29]/#30 夹具有 links 行，是否撞实现时实测、撞了按 rule_change 补登。 补丁 3（D10-3288）：补丁 2 的两条 red_exempt 撤掉——豁免对新文件不适用（tools/guard/lib/red-check.ts 只给被整文件判定的既有文件），[AC-B1-08zza#18] / #19 改为写库结果先收成值再断言的写法（机械更正 f5902e8a2，不计写测次数），先红红在断言。 补丁 4（D10-3302 ②）：迁移拆 0158（DROP + ADD CONSTRAINT … NOT VALID）/ 0159（VALIDATE），照先例 0081/0082；orders 是归属表、同名约束换定义，paths 加 tools/ci/lint-migrations.ts，只为在 APPROVED_GUARD_CHANGES 登记 0158 的文件名 + sha256 一行（第三类保护路径，合并时负责人标签）；迁移号落地前再核空号。 补丁 5（D10-3303）：冻结 [AC-B1-08za#1]（completeness.test.ts）登 modify_existing、test_paths 加该文件——规则表多一个键 missingLinkBuyTypeBasis，块内期望键集合与类型断言各加这一个键名（机械更正 09c2f46f0，不计写测次数）；kit.ts 不动。
