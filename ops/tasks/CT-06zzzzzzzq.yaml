title: CT-06zzzzzzzq：modify_existing 整块登记扩到模板标题的普通 it / test（不在 .each / .for 表、不在 for…of 循环里；按标题模板原文、只许 rule_change、note 必填，认不出的写法整文件重判；FU-GUARD-MODIFY-EXISTING-TEMPLATE-TITLE，D10-3624 / D10-3769）
type: guard-change
# 2026-11-28 ops 入账（编排 D10-3624 登 FU、D10-3769 准开）。第三类门禁改动，合并照 approvals 16。
# 起因（CT-26zs 00:43）：test/spec/contracts/card-bridge-diagnostic-fields/card-bridge-diagnostic-fields.test.ts:98 的 [AC-CT-13c#4] 标题是模板字面量
#   （含 ${eventsPath}、${String(baselineVersion)}），test-blocks.ts 的 modify_existing 定位（主干 :3186）只认静态字面量标题、.each / .for 行、for…of 循环体里的模板标题，
#   报「its block … has a title … that is not a static literal (a template …) and is no .each / .for table」；声明失效后整文件被判，同文件未动的 #1/#2/#3/#5/#6 在骨架上绿被判「没牙」。
# 做法（同 CT-06zzzzzzzj 的 for…of 做法）：文件里标题为模板字面量的普通 it / test 调用（无修饰；位置与现有静态标题块允许的一样：顶层，或静态标题的 describe 里），
#   可按标题模板原文（反引号之间逐字，含 ${…}，同 CT-06zzzzzzzd / CT-06zzzzzzzj）整块登记；只许 rule_change，note 必填。
#   同一原文命中多块（含与 .each / .for 表、for…of 循环体里的模板标题相同）、差一个字符照旧拒；块外语句（含 ${…} 引用的顶层声明）的判法照旧——块外有改动按现有规则整文件重判，不因本单放宽。
#   带修饰的 it（.skip / .only / .concurrent / .todo / .fails 等）、模板标题的 describe、函数 / 分支 / 非 for…of 循环里的 it、标题是非字面量（名字、调用、拼接）的块不在本单，照旧。
#   底子：手写记号识别（test-blocks.ts 已有 tokenize）；本单 paths 内不得 import typescript（test-blocks.ts 经 evidence-check.ts 与 tools/lib/task-file.ts 被引用，evidence.yml 不装依赖）。
# red-check / evidence-check / task.ts 经 test-blocks 自然生效；必须改别处才能生效就停下报编排。
# 规则测试至少钉：① CT-26zs 形状（顶层 6 个 it、#4 为模板标题，只改 #4 块体）按模板原文登记 → 整块定位、changed 判对，#1/#2/#3/#5/#6 须不变且不被整文件判；
#   ② 静态 describe 里的模板标题 it 同上；③ 原文差一个字符 / 同一原文命中两块（两个普通块，或普通块与 .each 表 / for…of 循环体各一）→ 拒；
#   ④ ${…} 引用的顶层 const 变了（块外改动）→ 照旧整文件重判、登记无效；⑤ 登记成 rule_change 以外的种类（tighten_only、ruling_correction、flake_fix 等）、或缺 note / note 全空白 → 拒；
#   ⑥ 带修饰的模板标题 it、模板标题 describe 里的 it、函数里的模板标题 it → 照旧拒；⑦ 静态字面量标题、.each / .for 逐行、for…of 模板原文三种现有登记照旧（回归）；
#   ⑧ red-check 与其他整块登记同口径（D10-701；台账补丁 1，D10-3790 取甲）：①的形状（改动全在有效登记块内）整个文件移出先红名单（modifiedLeftOut），
#   先红与证据检查用同一份应跑清单（照冻结的 [AC-CT-06zzzzzzzc#9] 的写法）；有块外改动时照现有规则（mixed 留在名单里）；不给新这一种单开「永不移出、绿即拒」的特例。
