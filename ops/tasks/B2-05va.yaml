#   P2 samePayeeAccount 去掉收款方式的比较（只比 HMAC，id 的比较保留）→ 须杀 ②；
#   P3 runPass 里第一轮的绑定行 id 改为在算风险标签前另读一次当前账号再取（即资金评审 r2 指出的「两次查询」形态）→ 须杀 ③，且 [AC-B2-05v#11]、[#12] 仍绿（说明 ③ 钉的是它们钉不到的那一处）。
