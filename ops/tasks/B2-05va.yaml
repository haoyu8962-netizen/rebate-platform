# 2026-11-28 funds 线入账（编排 D10-3636、D10-3659；B2-05v 已合并 #992）。走 D10-2264：非 task 分支的 test-change PR + 探针清单。
# 来由：B2-05v 有三条要求当时没有规则测试钉、只由实现方单元测试钉着，评审点名：
#   ① 锁内复核（validateLockedWithdrawal）不重判 BR-WDR-03 ⑨ 的方式单笔上限（规则测试评审 r1 S2，FU-B2-05V-SPEC-LOCKED-METHOD-CAP）；
#   ② 比较第一轮与锁内的收款账号时同时看 HMAC 与收款方式——同一 HMAC 换了方式也整遍重跑（同上）。两边都带绑定行 id 时「不是同一行」已先一步挡住，
#     所以这一条要在一边不带 id 的装配上钉（收款人快照是手写的那种夹具），否则去掉方式比较的实现也过；
#   ③ 第一轮判定用的账号行与锁内快照行是同一账号（HMAC、方式相同）的不同绑定行时也整遍重跑：前两遍换绑、第三遍第一轮之后换出再换回 → HTTP 500 / 50001、不建单不冻结，
#     不是 200（资金评审 r2 S1，FU-B2-05V-SPEC-FIRST-PASS-ROW）。经真实 AppModule，用另一条数据库连接加锁做栅栏，写法可仿 production.int.test.ts 的 [AC-B2-05v#12]。
