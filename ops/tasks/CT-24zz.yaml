#   CLAWED_BACK → R13（BR-CALC-02 当前有效联盟佣金换算新基数与快照重算各方应得，与当前净额之差写 ADMIN_ADJUST sub_type RESTORE，键受益人 {order_key}:{user_id}:{role}:RESTORE:{recon_diff_id}、
#   平台 {order_key}:PLATFORM:RESTORE:{recon_diff_id}，受益人去向按 BR-CALC-09；同事务 booked_base_fen / booked_n_fen 与 refunded_quantity_r9_baseline = 当时 refunded_quantity，D10-937）；
#   订单已不是 VOID / CLAWED_BACK → 20902（data.resource=order，新子原因登 error-codes）。③ 响应在 restored_fen 外加 rebate_status_after（appeal_restore 恒为 null 或不出现，取兼容写法，oasdiff 只增）。
#   ④ 描述写明：订单申诉撤销的 R12 / R13（BR-FUND-22 申诉恢复 ①②）生产方未建（risk 注明归 settlement，主干无 BLACKLIST_CONFIRMED 扣回入口），仍 restore_not_supported，留下一段。
# 实现另起 B2-09gb（settlement，RV2，deps CT-24zz、B2-04zzf；规则测试独立 Claude，资金评审照 D10-823 ④ 独立 Claude money）。不改分录规则本身，金额只按 08 现算。
