# 现行口径（只写结论）：① 新表 app.union_filing_attempts（迁移号 land 时取主干下一个空号，现为 0155）：调 publisher.info.save 前独立事务落尝试并提交，save 成功 → saved（与绑定同事务）、明确拒绝 → rejected、
#   回「重复」→ duplicate（都记 finished_at）；进程中断 / 传输超时 → 结局留空；couli_app 只 SELECT、INSERT、UPDATE(outcome, finished_at)。表名带 union_ 前缀，tools/ci/lint-migrations.test.ts 资金 / 归属表清单只加一行。
# ② 重复备案查回的编号只在库里同一（应用、用户、平台、联盟账号）有该编号的历史绑定时接受；否则不写绑定、答 50001：有更早且结局未知的尝试 → duplicate_after_unknown_attempt 告警带 earlier_attempt_id，
#   无 → duplicate_unverified；查回失败（立即抛错或被治理层单次请求时限取消）照此判，更早那条尝试不改（D10-2872 / D10-2972 / D10-3129）。告警与日志不含凭证、token、邀请码、淘宝 user_id / 昵称。
# ③ 「真实淘宝备案已就绪」（用户 OAuth 配置、邀请码、邀请码所属账号 = 本次选用联盟账号）在写 state 前、消费 state 前判，签发（打开链接、商品详情进店，经共用 issueTaobaoAuthState 传已选账号）与提交共用；
#   不就绪答原码 + auth_unavailable、不写也不消费 state。issueTaobaoAuthState 的 accountId 类型上仍可选（冻结 auth-url.test.ts:76 不传），接了就绪检查而没传账号 → auth_unavailable。
# 不在本单：长期未完成尝试的巡检（FU-FILING-ATTEMPT-PATROL）；换应用旧 state（FU-TAOBAO-OAUTH-APP-ROTATION）；淘宝接口实测（FU-TB-05-DUP-LOOKUP）；尝试表 state 外键约束 app / user（已登 FU）。
