# 现状（主干 73d184906）：orchestrator/deterministic/index.ts:94–97 对 price_unavailable / no_card 取 errorKey(unavailableCode()) = error.50301；
#   orchestrator/entry/index.ts:195–196 对情境入口报价 price_unavailable / no_card 取 `error.${UNAVAILABLE}`（50301）。error.50301 的生产文案带 {platform_name}，按无变量下发，用户看到花括号（扫描 couli-runs/B3-05u/placeholder-scan.md）。
# 只做：这两处的 price_unavailable / no_card 改取 agent.notice.price_unavailable（text_key 与 fallback_text 都用它）。
# 不改：parse_error 30131 / 30132 / 30141 仍 error.<码>；服务端原因（server_failed、parse_error 50301、抛错）仍 agent.notice.quote_failed / 50401（B3-05u）；error.50301 键与其文案本身不动；无返利 no_rebate.notice 不动；搜相似商品（FU-B3-05U-NO-REBATE-SIMILAR）与报价卡写失败细分（FU-B3-05U-CARD-WRITE-FAIL）不做。
# 验收：两条路径上 price_unavailable、no_card 下发 text_key = agent.notice.price_unavailable、下发文字不含花括号；情境入口与同商品链接消息出同一张 notice（scenario-entry [AC-B3-05q#24/#25] 原样成立）；其余分支与结束原因不变；计数与退还不变。
# 冻结用例（下面 modify_existing）：只许把 price_unavailable / no_card 那几项的期望键 error.50301 换成 agent.notice.price_unavailable，改动限在用例块内（按 kind / label / result 选键），不改块外的 it.each 表、助手与用例标题，别的断言一字不动；
#   先红 / --related 若列出别的冻结用例要改，先报编排补登，不得顺手改。标签由编排按 approvals 第 24 条核后加。
# 风险级：agent 模块（白名单 RV1）；refund.int.test.ts 涉及扣次数 / 退还用例，门禁若判 RV2 以门禁为准。spec-test 任务书原样附 D10-2317 ①；本机只跑单文件，重活上测试机（D10-2262）。
