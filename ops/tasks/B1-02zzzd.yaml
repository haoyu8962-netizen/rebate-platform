title: staging 测试号固定验证码扩到「绑定 / 更换手机」（purpose bind）：只 APP_ENV=staging、只 STAGING_TEST_PHONES 内号码，发码不调发送器、验码认固定码；prod 与名单外号码不变（D10-2688 甲）
type: impl
# 2026-11-23 ops 入账，交 be 做（编排 D10-2688 取甲，排在 B2-19 之后）。起因：D10-2687 ③ 核频率限制时发现，B1-02zza 的测试号固定码只覆盖 purpose ∈ {login, step_up}
#   （identity/application/sms-codes.ts:264 TEST_PHONE_PURPOSES），bind 不在内；staging 接上阿里云短信凭据（approvals 163）后，测试号 1990000000x 走绑定 / 更换手机会真发、计费，
#   而 199 号段不在默认拦截前缀里（sms-limits.ts:38）。不选「拦截前缀」：那是风控参数，且会让测试号的绑定流程整个测不了。
# 做法：同一处判定——TEST_PHONE_PURPOSES 加上 bind；发码 deliver()（sms-codes.ts:330-336）与验码 verifyAndConsume 的 isTestPhone(phone, purpose) 共用它，所以两头一起生效。
#   其余照 B1-02zza：随机码照常生成只存 HMAC、黑名单 / 设备 / 号码四项限额 / IP 与日预算全部照旧；每次调用都再判 appEnv==='staging'；落地页注册仍关固定码（landingSmsCodes 的
#   stagingTestCode: false 不动）；审计照旧（sms_staging_test_phone_not_sent 带 purpose）。
# 规则测试至少钉：① staging 测试号 bind 发码不调发送器、按已受理；② staging 测试号 bind 用固定码验码成功并消费当前码；③ staging 名单外号码 bind 照常调发送器、固定码无效；
#   ④ prod（及 local / test）下名单号码 bind 照常调发送器、固定码无效；⑤ login / step_up 原有行为不变。
# infra/staging/README.md 测试号一节改写用途说明（login、step_up、bind）。不动契约、不动 admin、不动落地页。RV2（identity、infra 路径）。
# 补丁 1（D10-2691）：README 测试号一节另写两点——① 默认拦截号段是 +86170 / 171 / 162 / 165 / 167（sms-limits.ts:38-44），199 不在内；② 管理后台的短信二次验证与「登记验证手机号」不走 sms-codes.ts（admin-step-up.ts 经 SmsSender 端口直发、admin-verify-phone.ts:235），不认 STAGING_TEST_PHONES，staging 后台不要把 199 测试号登记成管理员验证手机号（负责人自己的号可以）。只改 README 文字，admin 代码不动。
# 补丁 2（2026-11-23 be，编排 D10-2699）：冻结用例 [AC-B1-02zza#14] 钉着旧规则（名单内 bind 照常发送、固定码不能核销），登 modify_existing（rule_change、br BR-ID-05、ruling D10-2688、retitle_to）；refs 补 BR-ID-05（B1-02zza 的依据）。approvals 第 48 条同一用意，不另补（D10-2699）。
