# 2026-11-25 w1 入账（编排 D10-2891 认可范围、D10-2893 准入账）。现状：B1-04zzzzk 只认商品页 item.htm?id=，推广短链 / 淘口令 / m.tb.cn 一律 adapter_unimplemented（taobao-adapter.ts 头注释 B1-04zzzzk 段）。
# ① 只在已配大淘客来源（orderSource）时：对 B1-04zzzzk 不认的输入调 GET https://openapi.dataoke.com/api/tb-service/parse-content（version v1.0.0，参数 content；docs-mirror dataoke/md/api-33.md），复用现有 orderSource 客户端的签名与错误归类。
# ② 只取 data.goodsId（非空字符串）；goodsId 不当 item_id（D10-504，见 dataoke-search.ts:16），以它发一次 item.info.upgrade.get，取本次返回第一条的 item_id 原串（同 B1-04zzzzk 商品页路径与错误归类，BR-PROD-05）。
# ③ 返回里的 pid、commission*、转链 url、originInfo.activityId 一律不读、不进结果、不进日志（D10-2683）。code 25003 / 无 goodsId / upgrade.get 空结果 → link_unrecognized；其余大淘客错误照现有大淘客错误归类；归档 kind = query。
# ④ 没配大淘客来源 → 维持 adapter_unimplemented，不取凭据、不发请求、不告警（冻结 [AC-B1-04j#30]、[AC-B1-04zzzzk#1/#4] 的 setup 都未配来源，探针：主干上调 resolveLink 的测试里配了 orderSource 的两处都是 vi.fn 桩，预计零冻结改动）。
# 不改契约 / openapi（resolveLink 为内部端口，错误码沿用），不占契约槽；不改 parsing 模块。样本未到：FU-PARSE-CONTENT-SAMPLES。
# 补丁 1（D10-2917，money r1 范围外 S1 → 本单修）：BR-AI-04「Agent 链路禁止调用爬虫和第三方口令解析服务」——CallCtx 加可选 origin（'agent'），Agent 装配（agent/stream/mount/assembly.ts 绑定 parseToken / parseUrl 处）带上；
#   淘宝适配器见 origin=agent 不调 parse-content（按未配来源处理：adapter_unimplemented）。另修 money r1 两条 S1：归档请求摘要剔除 content、应答归档按白名单只留 goodsId 与错误分类字段；成功码下 data 缺失 / null → link_unrecognized。
# 补丁 2（spec-test r3 范围外 S2：归档请求摘要由 union/infra/archive.ts 按参数名脱敏，只在原 paths 内无法剔除 content，[#8]/[#9] 无解）：paths 加 union/infra/{archive.ts,replay.ts} 与 dataoke/{dataoke-client.ts,response.ts}——
#   传输请求加只挂在传输层、不上线路的「归档剔除参数」选项，dataoke 客户端透传，archive.ts 请求摘要按它剔除；response.ts 给「成功码但 data 缺失 / null」结构化原因，适配器不靠报错文字分类。既有调用不传选项时行为不变。
# 补丁 3（D10-2952 / D10-2958，BR-AI-04 细则「第三方口令解析禁止，开关 parse.third_party.enabled 默认 off，启用后任何链路只作官方失败 / 无权限后的降级」）：union 按品牌直接读 parse.third_party.enabled（不进配置注册表，先例 union.auth_alert_days），
#   缺省 / 非 true 即关 → 推广链 / 淘口令 / m.tb.cn 维持 adapter_unimplemented（→ 30132）、不取大淘客凭据、不发请求；开 → 只在官方口令解析失败 / 无权限后降级调 parse-content（官方淘宝口令解析至今未实现、恒不可用，parsing.ts TODO）；origin=agent 一律不调；请求只带链接或口令原文。
#   不得用直接改库打开；启用须负责人 + 法务定后另开单登注册表并列入隐私政策第三方共享清单。
