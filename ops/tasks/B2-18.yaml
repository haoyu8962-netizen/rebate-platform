id: B2-18
repo: rebate-platform
title: 'B2-18：settlement 月结校验跟随联盟——基数不等按 R7 以联盟结算数据重生成分佣快照再校验，一致进批次候选不开差错单；仍不一致或重生成失败告警工程、保持 WAITING、不以旧快照入账；应结未结只计数超宽限期才提示；对上 ESTIMATED 先按单号补拉一次'
type: impl
# 2026-11-21 be 入账（规划/05 B2-18 行，SPEC_REF 6c631c258963；负责人 2026-11-21「账单金额不一致以联盟为准、系统自动跟随」，docs/changes/20261121-对外差错单方案B.md §5-9；编排 D10-2369 / D10-2385）。资金单：Claude 实现、独立方写测、Codex 全量 spec-test 与资金评审。
# ① 联盟结算基数 ≠ 分佣快照当前版本基数：按 BR-FUND-01 R7（BR-CALC-02）以联盟结算数据重生成分佣快照版本后再校验一次，一致即进批次候选、不开差错单。
# ② 重生成后仍不一致（或重生成失败）：告警工程、不进财务待办，订单保持 WAITING，不得以旧快照入账。
# ③「应结未结」只计入账单计数、不开差错单，超宽限期才提示。④ 联盟结算数据对上我方 ESTIMATED 的，先按单号自动补拉一次联盟订单（B1-08）再按本条校验；补拉后仍 ESTIMATED 才按 BR-FUND-09 登记。
# 取值、容差与宽限期只读 08，不在台账复述。验收指向 10 AC-S2-51 ① 的 b、b2、c 项。依赖 B2-04（月结出账与一致性校验）、B2-03（分佣快照版本）、B1-08（按单号补拉），均已在主干。
# 2026-11-21 补丁 1（funds，编排 D10-2415）：拆三张，本单收窄为上面的 ①②（基数不等按 R7 重生成再校验；仍不一致、重生成失败或联盟结算佣金为 0 而快照基数 > 0 的告警工程、保持 WAITING，账单任务不作废订单）；重生成只追加一个金额版本，比例与受益人不动。月结判定与补充发起不再读「结论为以联盟为准视为一致」（读口与字段先留，FU-B2-18-RETIRE-UNION-CONCLUSION）。③ 的不开差错单与计数归 B2-18a（先落）；④ 先不入账（FU-B2-18B-REPULL-BY-ORDER，期间照旧登记 union_mismatch）；账单详情显示与超宽限期提示归 FU-B2-18-BILL-COUNTS-CONTRACT。标题按门禁保留原文。受影响冻结用例的 modify_existing 待负责人点头后另补（清单 couli-runs/B2-18/frozen-inventory.md）。
# 补丁 2（funds，D10-2425）：负责人 2026-11-21 同意；登记 11 条现断言「登记 settle_amount_mismatch」或依赖「以联盟为准」结论入批的冻结用例（金额期望值不动）。recon-outcome/monthly.int.test.ts 的 19 条整份删除另走 test-change 单（门禁不认任务分支上删冻结文件），先于本单合并。
