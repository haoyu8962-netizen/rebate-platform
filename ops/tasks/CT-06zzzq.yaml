#   轮次、pending bumps、熔断历史一律不动。--apply 写前把状态目录打包备份到 couli-runs/state-backups/<UTC 时间>.tgz，删 7 天前的备份，
#   往 couli-runs/state-reconcile.log 追加一行各类条数；--done-only 供夜间例行用，跳过台账未完成任务的 B 类。
# 改法二：status.ts 的 Markdown 把这四类 warnings 按类聚合成一类一行（条数 + 前 10 个号 + 全量见 --json）；台账未完成任务的过期租约按持有者聚合；
#   --json 照旧逐条全量。其他 warnings 不变。
