# 2026-11-08 ops 入账（编排 D10-872 ③ / D10-900 / D10-920；方案 couli-runs/FU-STATE-HYGIENE/plan.md）。基于主干。
# 现状：couli-runs/state 下约 1190 个状态文件，status.ts 的四类 warnings 共 826 条（A 台账 done 而状态非 ready 261、B pid 已不在 87、
#   C 租约过期约 470、D 有状态无台账 9），Markdown 看板约 75 KB，超 规划/11 §5.2 的开场预算。
# 改法一：state.ts 新子命令 reconcile [--apply] [--done-only]，只读可信根台账与状态文件，默认 dry-run 逐类列出会改什么。
