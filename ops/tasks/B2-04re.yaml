title: 'B2-04re：settlement 结算批次「生成 / 执行」平台级互斥（BR-FUND-16 加锁流程第 0 步）——入账执行的每条明细事务先取所属平台结算互斥锁的共享模式，发起补充与月结账单日任务取同一把锁的排他模式并持有到提交；补充里候选的订单键锁分块取完即放（并入 B2-04rd：候选锁内重读、已入账转受益人补记项）'
type: impl
# 2026-11-24 funds 入账（编排 D10-2759 取丙 / D10-2784 开工 / D10-2800；规划 docs/changes/20261124-结算批次平台级互斥锁.md；方案 couli-runs/FUNDS-quote/plan-settlement-recon-locks.md 第一节；只读盘点 couli-runs/B2-04re/inventory.md）。资金单（RV2）：Claude 实现、独立方写规则测试、Codex 全量资金评审。
# 来历：B2-04rd（补充入批候选先取订单键锁、锁后重读）两轮资金评审证明只改补充一侧不成立——订单键锁持有到提交则锁数等于候选数、默认库配置下约数千张即占满共享锁表（money r1）；分块提前放锁则暂停批次被继续执行、或未执行批次在放锁后执行时，补充仍会给已入账的单生成首次入账草稿并漏受益人补记项（money r2）。负责人 2026-11-23 定先出方案再做。本单取代 B2-04rd：带上它的 14 条规则测试（test/spec/settlement/supplement-locked-recheck/，标题仍是 [AC-B2-04rd#n]，不改）与实现 r3，B2-04rd 台账记 void。
# 一条规矩（08 BR-FUND-16 加锁流程第 0 步）：同一应用、同一平台，「生成批次」与「执行入账明细」互斥，执行与执行之间不互斥；这把锁在任何订单键锁之前取，持有订单键锁时不再等它；其余记账事务不取。
# ① 新增一把事务级咨询锁，键含 app_id 与 platform；锁键与取共享 / 取排他的函数放一个 settlement 内共用的小文件，三处调用方用同一个常量。锁语句写成与订单键锁不同的两参数形式（现有用例用正则定位订单键锁）。
# ② 执行侧：批次执行器的每条明细事务，第一条语句取共享模式，然后才是现有的订单键锁 → 会员行锁 → 余额；锁只放在执行器的明细事务里，不放进 credit() / execute()（现有 3 条冻结用例直接调它们并用「第一把咨询锁」定位订单键锁）。取到共享锁之后、入账之前再核一次入账开关（08 BR-FUND-04 ⑦：开关值不超过 10 秒；等锁的时间不能不算），已关则这一条不入账、照现有 SB7 停。等锁跨日照现有提交前的跨日检查处理，不改。
# ③ 补充侧：第一次读完来源之后、对任何候选取订单键锁之前（分块保存点之外）取排他模式，持有到补充事务提交；之后才是分块流程（保存点 → 块内升序取订单键锁 → 经来源读口重读 → 回滚到保存点放锁），候选按所在块锁内读到的行定类别。去掉实现 r3 里「锁内仍在未执行批次里的单一律排除」那段，回到只用拆批前那一次查询。补充命令的依赖类型加一个可选的块大小字段（测试注入用，生产不传）。取到排他锁之后重看两样（补丁 1，D10-2862）：再读一次该平台的入账开关，已关则与一开始就关着的结果相同（credit_disabled）、本次发起不留任何行；没上订单键锁的单改用取到平台锁之后那次读到的状态，且只在它仍不是首次入账候选时才采用——没上订单键锁的单绝不写成首次入账明细（没有候选时为此补读一次来源）。
# ④ 月结账单日任务：锁住账单行、判过重放之后，读来源之前取排他模式，持有到该平台这次出账的事务提交（08 第 0 步把它与发起补充并列；一次投递只处理一个平台，一个事务只取一把）。取到排他锁之后再读一次该平台的入账开关，以锁后读到的值决定是否生成主批次（补丁 1，D10-2862；BR-FUND-04 ⑨）。除取锁与这一处之外不动月结任务的任何逻辑（金额不一致的处理由 B2-18 改，本单不碰那一段）。
# ⑤ 不动：金额口径与容差、金额不一致的处理、来源读口实现、入账与受益人补记内部的取锁顺序、库表、契约。
# 验收（规则测试，新增为主；设计稿 couli-runs/B2-04re/brief-sec9.md §9.2，[AC-B2-04re#1]–[#10]）：执行明细事务在途时发起补充 → 补充等到它提交、按提交后的状态处理（已入账且有冻结受益人 → 同轮出补记项、无首次入账草稿）；补充在途时该平台的入账明细事务等待、补充提交后才入账（「未执行批次」与「因开关暂停后被继续执行的批次」各一条，即资金评审 r2 的两条场景）；别的应用、别的平台不受阻；同平台多个执行器之间不互相阻塞；订单键锁分块释放、平台锁恰一把（按键探测，同时补上 [AC-B2-04rd#8] 被冲淡的那一点）；等锁后开关已关的那一条不入账；补充失败回滚后执行继续；月结账单日任务与执行之间两个方向的等待。B2-04rd 的 14 条保持通过。主干冻结用例不登记任何改动（盘点结论：甲类 0 条）；测试机上现有相关目录红了就停下报编排，不改 test/。
# 已知残余（08 变更记录写明接受；会作为事实写进资金评审书）：扣回、补差审批、平台恢复三类事务也会开立 / 关闭受益人补记义务，它们只取订单键锁、不经执行器；补充放掉某块订单键锁之后到提交之前它们若提交，本轮可能多一条指向已关闭义务的补记项（执行时锁内重验跳过）或漏一条新开的义务（下轮补上），不动钱。
# 代价：补充或月结出账生成期间，该平台的入账执行停顿到生成事务提交；候选很多时补充每块要经来源读口全量重读一次（给来源读口加按订单过滤属后续优化，不在本单）。
# 2026-11-25 补丁 1（编排 D10-2862）：只改上面 ③、④ 两条注释，使台账与实现一致。来由：Codex 资金评审第 1 轮的产出被可信校验拒收（清单一项引到 diff 之外的行，整份作废、轮次已计），内容经本线逐条对过源码属实——三处都是「等平台锁之前读到的东西，取到锁之后没有重看」：补充与月结任务的入账开关、补充里没上订单键锁的单的状态。都不动钱（执行入账时还会再核）。实现第 2 次修，修完在新树上做全量资金评审。paths、test_paths、refs、验收不变。 2026-11-25 补丁 2：paths 加 apps/api/src/modules/settlement/AGENTS.md。来由：照编排 D10-2829，硬规则 3（加锁顺序）那一行作为单独一个提交放在任务分支上（只改第 24 行，资金评审第 2 轮评过改前改后原文）；任务 PR #700 上 guard-git 的 path-guard 报「改在任务 paths 之外」，这一类问题负责人标签不豁免（tools/guard/run.ts：标签只把保护路径与只增不改两类降为警告），所以要把该文件列进 paths。它仍是第三类保护路径，合并前照旧要负责人账号在任务 PR 的头上加标签。先例：B2-04c、B2-02a 等的 paths 里列过各自模块的 AGENTS.md。其余字段不变。
