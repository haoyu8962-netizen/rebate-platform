title: F1-08ar：结果未知后按【重试】若收到的不是「同键回放成功 / 已处理」——如 10403、20001 等确定拒绝——仍保持「上次提交结果未知」、只放行【去列表核对】（批量手动打款与调账页 useAdjustmentWrite 一起改；FU-F108AL-UNKNOWN-RETRY-10403）
type: impl
# 2026-11-18 入账（前端线 fe，编排 D10-2035 甲；F1-08al money r1 重跑留的 S2）。来由：首次提交没拿到带外壳的回答进入结果未知 → 期间权限被撤 → 【重试】过二次验证，原键原体回 10403（契约先判权限、后做幂等回放）→ 页面当作确定结果，清键解锁、可关对话框，不再提示「上次提交结果未知」，但第一次提交可能已生效。不会重复出款（服务端状态 CAS 与唯一约束），但操作员会误以为没录上。调账页 F1-08ce 的 useAdjustmentWrite 是同一写法。
# 范围：apps/admin/src/pages/withdrawals/ManualPaid.tsx 的结果未知分支与 apps/admin/src/pages/adjustments/useAdjustmentWrite.tsx（新建调账、红冲、批准 / 驳回、核销共用）。规则：一旦进入结果未知，之后的重试只有拿到同键回放的成功结果（或契约写明的「已处理」类回答）才解除；收到 10403、20001 及其他确定拒绝时仍显示「上次提交结果未知」，提示该拒绝原因，不清键、不解锁编辑，只放行【去列表核对】（关闭并重读列表）；10003 仍为重新验证后原键原体重发；不自动重发。首次提交（未进入结果未知时）的确定拒绝照旧解锁、换新键。
# 规则测试新目录 test/spec/frontend/admin-unknown-retry-refusal/**：批量手动打款与调账新建 / 红冲各至少一条（结果未知 → 重试收 10403 / 20001 → 仍锁定、仍提示结果未知、只有【去列表核对】、键不变）；对照（首次即 10403 照旧解锁）放进会红的块里。写测时发现冻结用例（F1-08ce / cf / cc / cd / al 的结果未知用例）受影响，先报编排再补 modify_existing。
# 资金页（RV2）：money 评审；规则测试与首轮评审由无上下文的独立 Claude（D10-2003）。
