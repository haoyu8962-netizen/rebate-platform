repo: rebate-platform
title: 淘宝授权回调中转页加可点的【返回凑狸】（链接即本页算出的 couli://auth/taobao 深链），防浏览器拦截自动跳转（D10-3567）
type: impl
# 2026-11-27 入账（前端线 fe；编排 D10-3567 一）。F1-11d 的中转页只 location.replace 自动跳深链；有的浏览器会拦截非用户手势的自定义 scheme 跳转，用户只看到「请回到凑狸 App 继续」而回不去。
# 只做（写死）：callbackTarget 算出目标（非 null）时，页面在提示下加一个可点的链接，文字恰为「返回凑狸」，href 恰为同一目标（couli://auth/taobao?code=…&state=…，出错时 ?state=…&error=1）；自动 location.replace 照旧、先 replaceState 清查询串照旧。
#   目标为 null（参数缺失或不合白名单）时不加链接，只显示原提示。仍不调接口、不写 storage / cookie、不打日志不埋点；no-referrer 照旧；白名单与透传规则（callback.ts）不改。真机验证随安卓甲（D10-3567）。
# 冻结 [AC-F1-11d#8] 断言 body 文本恰为提示，加链接后必变——按 D10-3567 改为「提示 + 有目标时恰为【返回凑狸】」，三行逐行登 modify_existing（rule_change，BR-ID-17「三端授权回跳」；D10-3567 更正 D10-2716 ② 的「拉不起 App 时只提示回到 App」）。
