id: B1-22zd
repo: rebate-platform
title: 'B1-22zd：联盟授权到期提醒加按小时节点与跳过规则；授权回调记录淘宝 re_expires_in 等五个时长，后台账号行返回 auth_refreshable'
type: impl
# 2026-11-23 be 入账（FU-TAOBAO-TOKEN-REFRESH 第一步之 ②③ 合并，编排 D10-2585 / D10-2587 / D10-2758：现在就做、不等规划回写；BR-ID-24 的规划文字由编排随二次验证规划 PR 提交，草稿 couli-runs/STEPUP-1122/BR-ID-24-待并入.md）。
# 背景：未上线淘宝应用的站长授权固定 24 小时，现按天节点（union.auth_alert_days，默认 14 / 7 / 1）会一授权就进「即将到期」、每天早上发短信；能否用 refresh_token 续期要看授权返回的 re_expires_in，库里没存。
# ① 小时节点：新配置 union.auth_alert_hours（整数 1–720，去重降序；缺失或任一元素非法取代码默认 [6, 1]；空数组 = 关闭按小时提醒，补丁 1 照规划变更记录 20261123-后台二次验证三档 §7，编排 D10-2771），与 union.auth_alert_days 同一读法（union 经 settings 直接读、不登记配置注册表，be 11-23 自定已报编排）。
# ② 跳过规则：提前量不小于本次授权总时长（auth_expires_at − auth_renewed_at）的节点，天或小时一律跳过；auth_renewed_at 为空（总时长未知）时不跳过，即现行为不变。
# ③ 小时节点只由自己的单例任务触发（新 job，singletonKey 含账户 + 节点 + 到期时刻；到点核对账户当前到期时刻不符即空转），排任务的时机：重新授权成功、手工录入凭据、续期成功（refresher 返回新到期）各排一次，daily_check 只补排下次巡检前到点的节点；每日巡检的按天判定、expiry_due、探测重试不改。
#    小时节点触发 = 现有「即将到期」提醒（UNION_AUTH_EXPIRING、同一模板同一投递链，阶段记 h<N> 只进提醒去重键），auth_status 由 active 进 expiring；同一到期时刻每个小时节点至多一次、已发更小节点后不补发更大的；已过期按到期处理；之后的每日巡检不得把它改回 active。
#    alert_stage 列与其检查约束不动（按天节点照旧 d<N>）：重建 union_ 表上的约束要登记 APPROVED_GUARD_CHANGES（门禁改动），本单不走那条路（编排 D10-2771 取此做法，04 §3.2 措辞由编排回写）。
# ④ 迁移（只增）：union_credentials 加 re_expires_in_s、r1_expires_in_s、r2_expires_in_s、w1_expires_in_s、w2_expires_in_s 五个可空整数列（只收 ≥ 0 或 null），随新凭据行一起插入，不给 app 角色加 UPDATE；不重建任何已有约束、索引或守卫。迁移号 land 前按主干取下一个空号。
# ⑤ infra/taobao/site-oauth.ts 解析这五个值（缺省、非整数或负数 → null，不报错）；reauth.ts 写新凭据行时一并写；手工录入（admin-accounts.ts）写 null。数值不进日志、不进审计明文；token 照旧不出现在任何日志或响应里。fake-site-oauth 只按现有假实现补这五个字段，不伪造真实报文。
# ⑥ adminListUnionAccounts / adminPutUnionCredential 的行按 CT-24ha 契约返回 auth_refreshable：当前凭据 re_expires_in_s > 0 → true，= 0 → false，null 或无当前凭据 → null；不返回原始时长。
# 不在本单：自动续期本身（第二步，D10-2585 等实测 re_expires_in > 0）、后台页显示（fe，F1-08atb 之后）、把两个提醒键登记进配置注册表。
# 冻结用例盘点（be 11-23 只读，couli-runs/FU-TAOBAO-TOKEN-REFRESH/prep.md 末节）：现有规则测试的账户种子 auth_renewed_at 大多为空、置了值的总时长都远大于 14 天，跳过规则不触及；alert_stage 列不动；凭据列用例只禁 token / secret 明文列名。按 ③ 的写法预计不需 modify_existing；实现中如撞冻结用例，停下以补丁补登，不改测试。
