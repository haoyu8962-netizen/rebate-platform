# 2026-11-18 入账（前端线 fe，编排 D10-2017：be 核出缺口乙类里后端已有的项，couli-runs/BE-codex/gap-plan-B11-15-20261118.md 第一张表；排在 F1-08al → F1-08fc → 导出记录页 → 小链接之后）。
# 范围：apps/admin/src/pages/withdrawals/** 新页签。按 BR-WDR-30 默认值表逐项显示与编辑 withdraw.auto_payout.* 各键（金额上限、时段、首提限制、冻结金额与当日提现的唯一值、次数、订单佣金预警、全平台日累计 ≤ payout.daily_cap_fen、风控转人工清单），保存走 config-items（乐观并发按各键 version；动态码；规则版本由后端算）；总开关 enabled 在本页只能关、开只在紧急开关页（switch.all）。不做（D10-2017）：「开启前置检查」只列条目、不显示满足与否；不做配置历史查看；【恢复默认值】等 be 核 config-items 是否返回 default 的结论。阈值按现默认值，不改。
# 配置写入影响自动打款（RV2）：money 评审。
# 写测与评审：Codex 额度用尽（D10-2003），规则测试与首轮评审由无上下文的独立 Claude（claude-run.sh），证据如实记 claude-independent。写测时发现冻结用例（入口清单、只读断言、TODO 对应的「不出现」断言）受影响，先报编排再补 modify_existing（D10-1712 / D10-1899）。写操作一律照 F1-08ce 结果未知处理（D10-1731）。
# 2026-11-21 补丁 1（fe，编排 D10-2375，同 D10-1733 / D10-1899）：本单在提现审核页加第四个页签「自动到账设置」（只对持 config.business 的账号出现，超管持有全部点），F1-08ba [AC-F1-08ba-TABS#2] 超管那组断言页签恰为三个会红：tabs.test.ts 列进 test_paths，块级 modify_existing 只把超管那组的期望改为恰为「审核列表」「打款队列」「结果待确认」「自动到账设置」四个（toEqual 严格相等），fund.view / payout.execute 两组与 withdraw.review / user.lookup 两组一字不动；同文件补 1 条本单新块在主干上红（D10-1812）。另按 D10-2375 口径 ①：标题里「总开关只能关」以 BR-WDR-30 细则「后台配置页」与设计规格为准——本页只读显示 withdraw.auto_payout.enabled 状态并放【去紧急开关页】入口，不发任何 kill-switch 写请求（已入账任务的标题门禁不许改，D10-2062，故写在这里）；口径 ②：保存跨键校验 max_amount_fen ≤ withdraw.max_amount_fen、platform_daily_max_fen ≤ payout.daily_cap_fen 不在本单（out_of_scope，be FU-WDR30-CROSSKEY-VALIDATION），前端只做 window_end > window_start 与单键范围。
