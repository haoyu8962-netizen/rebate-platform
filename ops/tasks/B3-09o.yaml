title: 'B3-09o（接手 B3-09m）：B4 最小一段（BR-AI-16 取甲）——全平台日预算熔断与用量入库：受理预占 agent.budget.reserve_mfen_per_run（默认 5,000 mfen，即单 run 花费上限），每次调用前按最坏成本定输出上限，全部记受理日，正常收尾记实际、其他收尾记满预占，单价取 run 所属 app 受理时的快照，告警尽力而为'
type: impl
# 2026-11-26 agent 线入账（编排 D10-3188 / D10-3189：接手 B3-09m，B3-09m 置 void 并入本单；先例 B1-22zd → B1-22ze #777）。来由照实记：B3-09m 的 Codex 调用实际 12 次（写测 7 次、资金评审 5 次，含 1 次被校验拒收），超过每任务 10 次的防失控上限（规划/11 §2.5）。第 11 次（2026-11-25 21:00 重做写测第 5 次）与第 12 次（11-26 00:29 重做后资金评审 r1）没被挡下，是因为本线 11-25 19:22 与 11-26 00:29 两次把旧方案产物挪进 couli-runs/B3-09m/r1-archive/（本意是不让旧轮次被当成评审基线），使熔断读数变成 7；当时没察觉、没报，11-26 00:39 自查报出。裁定：熔断不放宽、不靠挪文件重新起算，归档挪回照实读数，换单接手。本单常规计数新起（写测 3、规则测试评审 2、实现 3、资金评审 3），不另开一次性条目；approvals 第 173、178、203 条随 B3-09m 作废。
# 带过来的（原样，不重写）：分支 task/B3-09m 头 d580588cc0b8 的七个提交——规则测试 test/spec/agent/daily-budget/**（10 个文件 49 条，标题里的 AC-B3-09m 编号不改；spec 头 16c7394c493d，含编排准的两处机械更正 D10-3116、D10-3140）、迁移 0155 与 LAN 快照生成物、实现第 1 次。B3-09m 名下已有的评审（事实）：规则测试评审（独立 Claude）首轮 fail 2 S1 → 写测补 → 增量 pass；资金评审 r1（Codex，整份）fail 1 S0 + 6 S1，七条口径见下一行；测试机 --tests 507 个文件 9316 条与 --fast 在该头全绿。本单的实现轮在这个头上接着改。
# 资金评审 r1 七条的口径（D10-3187 / D10-3189，根因与方案 couli-runs/B3-09m/redo/r1-root-cause.md）：① 传输层调用 fetch 之前就失败的请求不记账（只给发出前抛的错打记号，不改错误对象的形状与分类）；② 预算放不下时保留已出内容并接着走无模型降级，finish_reason=budget；③ 模型单次尝试与累计时限照 agent.model_timeout_ms（默认 8,000 毫秒）；④ 预占额读失败（含超时）或非法用默认 5,000 mfen 并告警，日预算上限读失败仍按 budget 降级（预占额设 0 作关停时，读失败那一刻不生效，已知并接受，D10-3193）；⑤ 受理时取定本 app 全部候选模型各自的单价快照，各按自己的价计，不按版本号过滤候选，price_version 受理时定为路由顺序里第一个有价候选的版本（settle / finalize 不动，换到版本不同的备用模型时只在日志里记两份版本；D10-3193 更正）；⑥ 配置变更从下一次读开始生效，本单不修（FU-AGENT-BUDGET-CONFIG-EFFECTIVE-TIME）；⑦ 单价版本已记在 agent_runs.price_version，仓库没有别的留痕存储，后台留痕读面字段由契约固定、本单不改（FU-ADMIN-TRACE-PRICE-VERSION）。
# 只做（照 B3-09m 补丁 6 原文；BR-AI-16 新文「甲」，SPEC_REF 1025764be5af；D10-2970 ⑦ / D10-2975 / D10-2985 / D10-3025；草稿 couli-runs/B3-09m/br-ai-16-draft.md）：① config-registry 登记 agent.models（按模型 mfen / 百万 token，输入输出分开，带单价版本；本单只读不设值）；单价缺失、非正或读不出的模型不调，全部缺单价则新 run 无模型降级（finish_reason=budget）并告警。单价受理时取 run 所属 app 的一份、整个 run 用它、只记一个版本（取代 D10-2858 S1-1 跨 app 取最大）。
#   ② 成本 = ceil(in × in_price / 1e6) + ceil(out × out_price / 1e6)，运算放 packages/money（整数 mfen 函数）。③ 新表（迁移）：日累计按上海自然日一行（全平台一份、不带 app_id），记实际、预占与 80% / 100% 告警时刻；每 run 一条预占记录（受理日、R、单价版本、结清时刻；不设调用前登记 / 待定成本 / 逐次入账列）。③′ 预算上限跨 app 取最小、预占额跨 app 取最大（content 只读读口 configValuesByKey）；读不到用 BR 默认（100000 分 / 5000 mfen）并告警，预算 0 或预占 0 = 全部降级。④ 受理事务：当日（实际 + 预占）≥ 上限 → 降级、不预占；否则受理日预占 += R 并写预占记录。⑤ run 内每次调用前：W_in = ceil(请求体 UTF-8 字节 × in_price / 1e6)，Rem = R − U − W_in；Rem ≤ 0 或 M = min(M_cfg, floor(Rem × 1e6 / out_price)) < 256 就不调、本 run 按预算收尾（已出内容保留，finish_reason=budget）；M 真写进请求；非文本内容不调。已花 U 只在进程内：有用量按用量、已发出结果不明按 W、没发出不计。⑥ 收尾事务（唯一一次，结清时刻条件更新）：受理日预占 −= R、受理日实际 += 成本，写 cost_mfen / price_version；活进程记 U（超过 W 照实记并告警日志），其他收尾（别的请求、清扫、崩溃）记 R。⑦ 告警尽力而为：受理与收尾时首次 ≥80% / ≥100% 用条件更新抢当日告警时刻，抢到的打 pino 事件（agent.budget_80 / agent.budget_100 / agent.budget_price_missing）并加计数，可能重复或晚到。进行中的 run 照常完成，不返回错误码；不依赖模型的消息结束原因照常（BR-AI-14 细则）。
# 不做（评审范围外一律 out_of_scope）：成本分摊与报表、后台显示；失败尝试用量（FU-GATEWAY-FAILED-ATTEMPT-USAGE）；model 归因（FU-B3-08T-MODEL-ATTRIBUTION）；离线 / 评测计量；B3-03k 接线；送企业微信群规则（另开给 ops，D10-2668 ④）；按 app 分预算；调参与真实单价；Jev 费用。
# 验收：故障注入到 100% 后新 run 降级、进行中照常完成；单 run 花费不超过 R（放不下不调、M 按剩余额度并真写进请求、M < 256 不调）；活进程收尾记 U、其他收尾记满 R、重复收尾不重复记；跨零点全部记受理日；单价缺失两种情形；键缺失 / 0 / 非法值；示例 2000 入 + 300 出 → 320 mfen，BR 细则两次调用例（U = 700；崩溃记 5,000）。告警只验「越线会发」，不验恰好一次。
# 风险级 RV2（动迁移、packages/money、content 注册表），评审 money；迁移号取 land 时主干下一个空号（D10-2828 / D10-2829；现为 0155），生成物走 LAN-DB-SNAPSHOT，land 前测试机五段全量（D10-2398）。paths 照 B3-09m 补丁 2 / 4 / 5 / 7 的范围原样带入（同目录成对的文件并成花括号写法，范围不变），另加 model-gateway/openai-compat 的 errors.ts、transport.ts 与 index.ts（口径 ①：路由要从传输层得知「没发出」，index.ts 只加导出）。agent.models 留 LOOKUP_ONLY，列进后台配置列表归 B3-09n。生产装配现仍是 no_model，预算要到 B3-03k 接上模型网关才生效。
