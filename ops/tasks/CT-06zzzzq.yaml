# 分片命令（逐字固定）：spec-tests 第 i 片 `pnpm test:int --log-order=stream --filter=@couli/spec-tests -- --shard=i/6`（i=1..6，各一次）；最轻那片另跑一次 `pnpm test:int --log-order=stream --filter='!@couli/spec-tests'`（api、db 及以后新增的含 test:int 的包）。不能直接改 i/2 为 i/6：passWithNoTests false，@couli/db 只有 2 个、@couli/api 只有 5 个 int 文件，片数多于文件数会报错。
