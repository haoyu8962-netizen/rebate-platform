title: 导出任务表 export_tasks 的 resource CHECK 加 ledger：两条迁移（NOT VALID 再 VALIDATE）+ schema 快照 + 冻结 [AC-B1-34b#4] 改写与同文件 1 个新块（D10-1849 / D10-1864）
type: impl
# 2026-11-16 w1 入账（编排 D10-1864 选 (甲)，从 CT-24zzm 拆出；ruling D10-1849）。CT-24zzm 给 export_resource 加 ledger（D10-1740 / D10-1742），
# app.export_tasks 的 resource CHECK（0115）只收 users / audit_logs / tax_withdrawals，不放宽则 ledger 任务插不进去。本单先于 CT-24zzm 落地。
# 迁移：照 0115 / 0116——第一条 DROP CONSTRAINT export_tasks_resource_check + ADD 同名 CHECK (resource IN ('users','audit_logs','tax_withdrawals','ledger')) NOT VALID
# （SET LOCAL lock_timeout '5s'、statement_timeout '30s'），第二条 VALIDATE；文件名 NNNN_export-tasks-resource-ledger.sql 与
# NNNN_export-tasks-resource-ledger-validate.sql，号暂写 0146 / 0147（0145 已登记给 CT-13l），落地排在 CT-13l #211 之后、拿到冻结再取主干最大号 + 1。
# export_tasks 不是资金表，不进 APPROVED_GUARD_CHANGES；lint-migrations 若拦，报原文、不绕。db/schema.sql 与 db.gen.ts 由沙箱外 pnpm db:snapshot 重出（outside_needed）。
# 冻结用例：[AC-B1-34b#4] 按 rule_change 改（见 modify_existing）；同文件加 1 个新块 [AC-CT-24zzma#1]（resource=ledger 的行可插入、filters 原样往返、masked true），
# 只用该文件已有 import 与辅助、块外一字不动（D10-1812 (乙)）；其余 14 条登 red_exempt，首轮 spec-test 任务书逐字贴声明并逐条确认，有一条不能确认即 fail。
