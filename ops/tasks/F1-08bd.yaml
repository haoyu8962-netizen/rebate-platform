# 资金页面（apps/admin/src/**/withdrawals/** 属 RV2）：Codex 额度用尽至 11-20（D10-1604），规则测试由独立 Claude 写、另一独立 Claude 审（approvals 第 36 条）；实现 Claude Opus；代码评审 money。写操作每次 StepUpModal（totp 档，BR-ID-34），提交中禁用、对话框保留；按钮按状态与权限点隐藏不置灰；阈值、时效从接口与配置取不写死；金额只经 @couli/money。任务书带 D10-1477、D10-1503。
# 范围：队列暂停时标题行【解除暂停】、通道卡【解除通道暂停】（分开解除，BR-WDR-33 ①）；【暂停队列】按规格与契约是否允许本页写再定（只做契约允许的）；确认 → StepUpModal → 只发一次 kill-switch 更新；解除后仍过水位检查的说明；成功刷新概览。
# 2026-11-15 补丁 1（fe，编排 D10-1712）：F1-08ba [AC-F1-08ba-READONLY#1] 与 F1-08bb 超管用例的写入口清单随本单落地再改一次——加入【暂停队列】【解除暂停】【解除通道暂停】（契约 adminUpdateKillSwitch 允许本页写 payout.queue_paused 与 payout.channel_paused.<channel>；严格相等，恰为已落地入口），另补反向用例（无 switch.payout / switch.all 的角色看不到解除入口）；两文件先列进 test_paths。modify_existing（rule_change，br BR-WDR-17，ruling D10-1712）等两文件随 F1-08ba / bb 进主干后另开补丁登记。
