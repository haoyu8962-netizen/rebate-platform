id: B2-04zzr
repo: rebate-platform
title: 订单同步写 P7 的 order_rights(INVALID_AFTER_SETTLE, SUCCEEDED) 与同步状态码处罚的 order_rights(PUNISH, SUCCEEDED)（FU-P7-ORDER-RIGHTS-ROW）
type: impl
# 2026-11-09 be 入账（编排 D10-1118 / D10-1124 / D10-1125；be 只读核查见 notices 07:16）。BR-FUND-01 P 表：P7（SETTLED 后 PLATFORM_INVALID，platform_status 不变）写 order_rights(type=INVALID_AFTER_SETTLE, status=SUCCEEDED)；P8 的处罚（PLATFORM_PUNISH，PAID / RECEIVED / SETTLED，含结算前）写 order_rights(type=PUNISH, status=SUCCEEDED)（BR-FUND-02 处罚码映射）。现状：全仓只有 settlement/rights/rights-store.ts 写这张表，入口是维权 / 处罚同步任务与后台导入；订单同步交给 settlement 的路径（clawback/clawback-order.ts onUpdated 已入账 R8；rebate/application/rebate.ts onUpdated 未入账 R6）一行不写。
# 做法（实现自定细节，留记录）：order_rights 仍只经 settlement 写（BR-FUND-01）；在 settlement 处理订单同步更新的同一事务内，按 source.event 写这一行（P7：event PLATFORM_INVALID 且 from_status SETTLED；处罚：event PLATFORM_PUNISH），不论 rebate_status（已入账、未入账、已作废都写），platform_rights_no 为 null，幂等落在 order_rights_dedupe_key（app_id, order_id, type, platform_rights_no NULLS NOT DISTINCT）——同一事件重放不多写；rights_pending 照 BR-FUND-01 在同一事务重算（SUCCEEDED 不使其为 true）。已入账的扣回（R8，P{row_version} 键、CLAWBACK 凭证、原因码）、未入账的作废（R6）、金额与状态迁移都不变；这一行不得再触发第二次扣回（rights.record 的成功扣回路径不经过这里）。
# 实际后果（规则测试要钉）：BR-FUND-19 ⑧（db/invariants/ledger/08_invalid-still-credited.sql）据这一行发现「P7 后又成 CREDITED」的单（P7 时未入账被作废、之后经 R12 恢复再入账）。R13（CLAWED_BACK→CREDITED）⑧ 要不要报不进本单（D10-1125，编排记待回写）。三张 status-map 现无 PLATFORM_PUNISH 码，处罚经测试替身的 source.event 钉。
# 不进本单：淘宝结算后维权的原因、结算后整单退款原因码（FU-CLAWBACK-REASON-CHECK，本单开出后先只读深核）。
# 2026-11-09 补（D10-1126 ② ③、D10-1133）：⑧ 不算合法恢复之后的单——按 db/invariants 只增不改，新增替代文件 10_invalid-still-credited-since-restore.sql，superseded.json 登记旧 08 被替代（照 B2-02l 先例）；最后一次恢复取 app.order_status_history（field rebate、event ADMIN_RESTORE、from_status VOID / CLAWED_BACK）的 max(at)，只计 order_rights.created_at 不早于它的成功 INVALID_AFTER_SETTLE。P7 行 platform_rights_no 取事件标识 'P' || 事件进入时的 row_version（与 BR-FUND-08 同值），重放不多写、恢复后再失效写新行。处理时再核（settlement/application/platform-restore.ts，R12 / R13）：差错单登记（recon_diffs.created_at）之后写入的成功 INVALID_AFTER_SETTLE 视为平台又失效、不恢复；ledger 的 ReconDiffRestoreRow 补 created_at。
# 2026-11-09 补（D10-1140）：⑧ 由 10_invalid-still-credited-since-restore.sql 替代旧 08 后，两个冻结夹具写死的旧文件名照 D10-327 与 03→09 先例改成新文件名——test/spec/ledger/daily-check-execute/kit.ts:66（FILES['08']）与 test/spec/settlement/admin-union-receipts/kit.ts:97（INVARIANT_FILES），只改这两处，由新鲜独立 Claude 改、另一位只读复审「只改这两处」；合并时编排按 #24 核后加标签。 2026-11-09 补（D10-1147，money r1 S2）：同一次同步 PLATFORM_INVALID 同时命中黑名单时，update-step 先写同步更新、再经 applyOrderBlacklist 走 R6（row_version 再 +1），之后才到 settlement，重读当前行会把 P7 的号取成 P{v+2}。改为 orders 把同步更新写入的 row_version 经 OrderStatusSource.sync_row_version（可选字段；OrderUpdateChange 由 AC-B1-08i#20 冻结、冻结测试里有不带它的 source 字面量）交给 settlement，P7 的 platform_rights_no 取它；构造 source 只在 update-step.ts 一处。⑧ 与再核的比较用 updated_at（D10-1134 (3)），上文 created_at 的说法作废。 2026-11-09 补（D10-1150 / approvals 61）：superseded.json 的追加按 evidence-check 算规则测试资产、由第 4 次写测试提交，作者路径守卫要它在 test_paths 里，故列入 test_paths（paths 里照旧）。
