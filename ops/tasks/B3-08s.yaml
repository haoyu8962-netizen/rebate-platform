# 08 口径：9 张 agent_* 表按各自 created_at，删「+08:00 当日 00:00 − agent.trace.retention_days」之前的行，硬删，每天 03:00 起；agent_rule_chunks 不是个人数据不清；无举报 / badcase 保留例外，注销已清文本的行到期照删（BR-AI-22）。
# 做法：外键不连带删除，须先子后父、父行无更新子行才删；函数属主 couli_migrator、search_path 固定、lock_timeout 5s、EXECUTE 只给 couli_maint，不给任何角色新增 agent_* 的 DELETE；现有读配置函数原样重定义纳入该键（每轮只读一次，不红 [AC-B1-15zc#18]）；门「+08:00 03:00 起」，当天没删完由之后轮次续删，与 04:00 任务重叠可接受（D10-999 ③）；retention.purge.enabled=false 时不删（D10-999 ①）；没删没失败不写日志、报告形状不变。
# 与 B3-08q 并发：其写入时间为当前，碰不到 184 天前的行；外键锁 + 跳过已锁行亦安全。
