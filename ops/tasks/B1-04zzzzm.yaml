id: B1-04zzzzm
repo: rebate-platform
title: 淘宝用户授权服务端真实闭环：用户级 auth_url 换成真实淘宝 OAuth（view=wap、新配置回调地址），淘宝适配器实现 bindPublisher（code 换用户 token → publisher.info.save 得 relation_id，重复备案经 publisher.info.get 取回，拿不到即失败告警），token 用完即弃（D10-2713 / D10-2716）
type: impl
# 2026-11-23 w1 入账（编排 D10-2716 ①，P0，与 B1-04zzzzk 并行；方案 couli-runs/W1-search-linking/taobao-auth-plan.md）。现状：auth_url 为合成地址（union-auth-state.ts:35–42、union-auth-url.ts:245 / :289），
#   真实淘宝适配器无 bindPublisher（union-binding-exchanger.ts:10–11，只有 demo 实现）。转链已在 binding active 时带 channelId = relation_id（privilege-link.ts:84–86），本单不动转链、订单、契约。
# ① auth_url：https://oauth.taobao.com/authorize?response_type=code&client_id=<appKey>&redirect_uri=<TAOBAO_USER_OAUTH_REDIRECT_URI>&state=<现有一次性 state>&view=wap（DM taobao/guides/105590.md:62–84；拼法复用 site-oauth.ts）；
#   新环境配置 TAOBAO_USER_OAUTH_REDIRECT_URI（与 TAOBAO_OAUTH_REDIRECT_URI 同规则：https 绝对地址、有 host、无凭据无片段，不合格拒绝启动）。staging / prod 缺回调地址或 appKey 时按现有 auth_unavailable 走，不再下发合成地址；local / test 仍可用假实现。
# ② bindPublisher（淘宝适配器）：POST oauth.taobao.com/token（grant_type=authorization_code、code、redirect_uri 同上，复用 site-oauth.ts exchange）→ 用户 session 调 taobao.tbk.sc.publisher.info.save（inviter_code、info_type=1）→ data.relation_id；
#   desc 为重复绑定且无 relation_id 时，以同一用户 session 调 taobao.tbk.sc.publisher.info.get（info_type=1）取回；仍拿不到 → 失败（不写假 relation_id）并打平铺告警。用户 token 只在本次调用内存中使用，不落库、不进日志（BR-ID-17）。
#   inviter_code 读新环境配置 TAOBAO_INVITER_CODE（ops 用站长 session 调 invitecode.get 生成后设置，不进仓库）；缺省 → 失败告警。权限包 14474 已授权（DM taobao/DEV-NOTES.md:4）。
# 规则测试（假传输）钉：真实 auth_url 形态与 state 原样；token 请求参数；publisher.info.save 入参与取 relation_id；重复备案取回；两路都拿不到失败且不写 binding；token 不出现在日志 / 持久化；缺配置不下发合成地址。
# 补丁 1（D10-2717）：TAOBAO_USER_OAUTH_REDIRECT_URI 取值 staging https://l-stg.couliapp.cn/auth/taobao/callback、prod https://l.couliapp.cn/auth/taobao/callback；auth_url 入口 oauth.taobao.com + view=wap（不用 oauth.m.taobao.com、不用沙箱 tbsandbox）；staging 淘宝适配器用 live；code 仍下发客户端，不改契约。
# 补丁 2（D10-2755，money r1 一 S0 四 S1 一次修全）：备案适配器接收服务端选定的 app_id + 联盟账号，校验邀请码归属（新配置 TAOBAO_INVITER_ACCOUNT_ID = 生成该邀请码的联盟账号），不一致或确认不了即拒绝激活绑定并告警；
#   生产装配接真实授权应用解析器（linking/infra/auth-apps.ts，Nest 路由测覆盖 prod 签发）；state 记录签发时 OAuth 配置引用（含 redirect_uri），兑换按引用解析；sdk_token 在真实淘宝适配器支持前不下发；web_code 失败按端 × 方式计数（固定分类，不含凭证）。
# 补丁 3（D10-2806 / D10-2826，负责人 2026-11-24 对话同意；money r2 收口）：① 保存回「重复绑定」且无编号时，查询结果只在库里对得上才接受（同一应用、同一联盟账号下已有该编号的历史绑定且是同一用户），
#   否则不写绑定、失败告警（duplicate_unverified）；② 签发与兑换共用「真实备案适配器已就绪」判断，staging 淘宝端点为 demo 时签发 auth_unavailable、兑换不把真实凭证交演示适配器；③ 换应用旧 state 失败不在本单（FU-TAOBAO-OAUTH-APP-ROTATION）。[AC-B1-04zzzzm#4] 三例（本单新文件 bind-publisher.test.ts，主干无，不登 modify_existing）由写测增量按 ① 改，负责人已确认。
