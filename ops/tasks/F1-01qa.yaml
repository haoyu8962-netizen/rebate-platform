id: F1-01qa
repo: rebate-platform
title: H5 可选登录接口拿得到令牌就带上（FU-H5-OPTIONAL-AUTH 第一段，不涉归属的部分）：x-auth optional 的请求先向桥取令牌，取到就带 Authorization 发；取不到时维持现状匿名发，不改「确认游客 / 身份未知」的处理（待编排定 H5 口径）
type: impl
# 2026-11-15 入账（前端线 fe，编排 D10-1744）。来由：CT-13d 评审 S2（ops/evidence/CT-13d.json）——apps/h5/src/shared/api/app-api.ts 把 anonymous.ts 名单里的操作（security [] 与 optional {} 混在一起）一律交给不带令牌管理器的客户端，已登录用户在 H5 发的 optional 请求（POST /v1/events 的 link_jump、GET /v1/pages/*、/v1/products/*、/v1/rank/hot、GET /v1/links/{id} 等）也不带令牌，服务端只能按游客处理。
# 依据：规划/03 §4.2「可选登录接口的发送口径」（规划主干 6674cd0，D10-1709）——有令牌带上发；确认游客不带令牌发；身份未知默认不发，只五类显式声明照发。H5 现在分不清确认游客与身份未知（桥 auth.getH5Token 无逐方法错误表，只有全局 90401；token.ts 不区分），已在 notices 请编排定 H5 口径（D10-1744 回报）。
# 本单范围（定口径之前只做不涉归属的部分）：① 网络层把 x-auth none（security []）与 optional（{}）分开：none 照旧不取令牌、不带 Authorization；optional 先经现有令牌管理器（bridge-sdk createH5TokenManager，单飞）取令牌，取到就带 Bearer 发，10002 续一次重放照现有管理器。② 取不到令牌（getH5Token 任何失败）时，本单维持现状：不带令牌匿名发——不新增本地拒绝，也不按 90401 区分游客；这一步的取舍等编排定口径后另开第二段（FU-H5-OPTIONAL-AUTH 第二段，含固定账号核对）。③ 已带令牌发出、续期失败的，不降成匿名重发（03 §4.2：有会话即非游客），按现有错误处理。④ signed 操作（/v1/inputs/parse、/v1/links/{id}/open、商品反馈）照旧本地拒绝，不改；/v1/config 走桥 app.getConfig 不改。⑤ 取令牌不得阻塞 none 操作；游客连发多个 optional 请求时不得对 getH5Token 无限重试（同一会话世代内单飞，auth.changed 后重来）。anonymous.ts 的契约对照单测随之改为区分 none / optional。
# 非资金（apps/h5，RV1）：Codex 额度用尽（D10-1604），规则测试独立 Claude 写、另一独立 Claude 审（approvals 第 36 条）；实现 Claude Opus；代码评审 general（独立 Claude）。第 3 轮 spec-test 仍 fail 即停报编排（D10-1734）。测试机不可用期间按 D10-1693 本机推进，合并门禁只认测试机。
