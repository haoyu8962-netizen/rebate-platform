id: B2-07j
repo: rebate-platform
title: 'B2-07j：payout 提现对账的取锁顺序与事务步骤——日跑先收齐本次涉及的会员、按 user_id 升序一次锁齐、锁内重读稳定后才写；迟到复核与对账复查先锁会员再登记差错；是否已登记只认差错单；到账时入队迟到复核；复核任务改为会员 → 提现单（FU-RECON-DAILY-TX-SCOPE，并关 FU-PAYOUT-REVIEW-JOB-LOCK-ORDER）'
type: impl
# 2026-11-25 funds 入账（编排 D10-2665 定为上线前必须 / D10-2784 开单顺序第 3 张 / D10-2986 认可方案第五节修订 / D10-2990 定范围）。方案 couli-runs/FUNDS-quote/plan-settlement-recon-locks.md 第二节与第五节（以第五节为准）；只读盘点 couli-runs/FU-RECON-DAILY-TX-SCOPE/inventory.md（主干 afa9f47b7017；至 44f25bb2dd35 payout、ledger 差错单登记、identity 锁用户端口与 test/spec/payout 无改动）。资金单（RV2，payout）：Claude 实现、Codex 写规则测试、Codex 全量资金评审。
# 来历：B2-07i 三轮资金评审的共同根因是日跑一边处理一边才知道要锁哪些会员——先写明细再锁会员，与「会员 → 提现单」的人工处置互等（r1）；先锁账单里的会员则漏单候选只能提前读，读完后才到账的漏掉（r2）；循环后重读补锁，补的锁与先前的不成升序，与邀请奖励的双锁互等（r3）。本单在主干现有存储上把取锁顺序与事务步骤定下；B2-07i（提现单关联列、序号、两条迁移、按应用的对账写锁、状态更正落库、人工处置认关联列）与 B2-07h 在它之上重做（D10-2990 (1)）。
# ① 日跑 reconcile()：一个应用一个账单日仍是一个事务。步骤改为：只读收集（账单流水、流水点名的提现单、漏单候选）得到本次涉及的会员集合 → 经冻结端口按 user_id 升序一次锁齐 → 锁内把同一批重读一遍；出现集合之外的会员则整次回滚、并入集合后重来（有次数上限，超限走现有失败分支交队列重试）→ 集合稳定后才写明细、登记差错、加冻结、写运行记录、入队。锁齐之前不写任何业务表、不入队。
# ② 迟到复核与对账复查：先锁该提现单的会员，再登记差错、加冻结（主干两处都是先登记后锁：recon-job.ts 迟到复核 :1250 / :1279 / :1312 之后 :1266 / :1294 / :1326，对账复查 :1140 之后 :1155）。迟到复核的会员锁放在第一次读运行登记与明细之后（冻结用例 [AC-B2-09t#34] 钉着第一次读之前不持日跑要的锁）；它的判断仍基于「先读运行登记、后读明细」的顺序，不是锁内重读。人工差错（不锁会员）不动。
# ③ 是否已登记差错只认差错单：迟到复核不再从明细行推断（主干 recon-job.ts:1298-1308），改为按差错单自己的键精确查——去重键，或业务键（应用、channel_mismatch、账单日、提现单）；口径「同一张提现单同一账单日已有任一张即已登记」，不看状态、不分 resolution 里的细分，与登记口的吞重口径一致。ledger 新增一个只读口（按去重键或业务键查是否存在，只回是否存在）；只用这两种精确查找，不加索引、无迁移（D10-2990 (2)）；实现若需要不带账单日的查找，停下报编排。账本这两个文件 B2-02zf 也改，本单在 B2-02zf 落地之后做。
# ④ 到账（W5）：置已付的同一事务内，到账时间所在会计日早于当前会计日的，入队该提现单的迟到复核（round 0，与人工置已付、人工处置同一任务）；当日到账的不入队。到账任务的队列参数为可选项，不传则不入队（冻结 kit 构造到账任务时不传队列）。入队条件不依赖「该账单日是否已对账成功」（日跑未提交时到账的单会两边都漏，盘点 F2）。
# ⑤ 复核任务 review-job：取锁顺序由 提现单行 → 会员 改为 会员 → 提现单行，与到账、人工置已付、人工处置一致（它与日跑不成环，反序的对象是这三条路径，盘点 A3、F8）。
# 不动：差错登记的金额与口径、哪条算重复打款（B2-07h）、recon_channel 的列与存储语义（B2-07i）、通道账单读取、告警时机、契约、库表。
# 冻结用例（盘点 D）：步骤重排本身没有必红的冻结用例；主干冻结用例不登记任何改动。受写法约束的三处：迟到复核在第一次读运行登记 / 明细之前不持会员锁（[AC-B2-09t#34]）；支付宝当日到账不投任务（[AC-B2-06fz#1] 三处、[AC-B2-06fz#6]，测试时钟与通道到账时间在同一会计日）；新增的选项一律可选（冻结 kit 不传）。测试机上 payout 相关目录红了即停下报编排，不改 test/。
# 验收（规则测试新增，新目录 test/spec/payout/recon-lock-order/，标题 [AC-B2-07j#n]）：日跑第一次写业务表之前已持有本次全部会员的行锁，取锁按 user_id 升序、集合稳定的那一轮只取一次；锁内重读出现集合外会员（锁齐后才到账的漏单候选）→ 整次回滚重来、该会员被覆盖并登记；超过次数上限走失败分支、不留半截写入；两个消费者下「日跑补跑 × 对账复查」「日跑补跑 × 迟到复核」同一张单同一去重键不死锁（盘点 F1、B2-07i 资金评审 r2 的 S2）；日跑 × 邀请奖励双会员锁不死锁（B2-07i 资金评审 r3 第 2 条）；到账会计日早于当前会计日 → 同事务入队迟到复核、事务回滚则不入队，当日到账不入队；日跑未提交时到账的单最终被迟到复核核到（盘点 F2）；迟到复核「已登记」按差错单判——有差错单而无非成功明细行、有非成功明细行而无差错单各一条；复核任务与人工处置、到账并发不死锁。
# 未核实的三处（风险）：一，单日数千笔提现时一次锁齐全部会员的耗时与对提现申请、人工处置的影响——没有量级数据，要在 staging 用量级数据看一次；二，生产 lock_timeout 的取值——日跑等会员锁有没有上限未核实；三，别的在一个事务里锁多个会员的路径（结算入账的受益人等）是否都按升序、一次锁齐——盘点只核了邀请奖励与合并账号（都是一条语句升序）。第三处在写任务书前做只读盘点，出现反例先停下报编排。
# 代价：日跑期间当天涉及的会员行被锁住，这些会员的提现申请与人工处置在对账的时间里等待。
# apps/api/src/modules/payout/AGENTS.md 硬规则第 3 条（加锁顺序）补提现单行锁排在会员行锁之后、对账路径先锁会员再写明细与登记差错：保护路径，在任务分支上单独一个提交，合并前由编排核改前改后原文后加标签（D10-2990 (3)；该文件已单列在 paths）。
