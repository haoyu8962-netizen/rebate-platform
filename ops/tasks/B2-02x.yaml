title: ledger：差错单按分录重算余额缓存的实现（CT-24zzn）——在加锁流程内把 account_balances 的 available_fen / frozen_fen 改为分录合计，不写凭证、不改分录，记审计前后值；不关单、不解除 withdraw_holds（D10-2017 ①）
type: impl
# 2026-11-18 be 入账（编排 D10-2017 ①）。资金单：强度 high；规则测试与资金评审走独立 Claude（claude-run.sh，D10-2003），评审清单逐项（舍入、正负号、幂等、并发、部分退款、时钟、app_id）；合并前照常挂批准标签。
# 实现照 BR-FUND-19 细则「差异以分录为准修正」与 BR-FUND-16 细则「加锁流程」：同一事务内锁该用户余额行，按分录重算 available_fen、frozen_fen 后写回；只有 ledger 模块写余额（AGENTS.md §4 第 2 条）；不插凭证、不动分录；audit_logs 记前后值与差错单号。
# 守卫：差错单 type=ledger_mismatch、未关闭；app_id 隔离；step-up 短信档由平台层校验。并发：与入账、提现冻结并发时以锁为准，重算结果等于锁内分录合计；同一差错单重复触发是幂等的（第二次前后相同）。 不做：不改差错单状态、不解除 withdraw_holds（关单走已有 close，D10-2017）。
# 规则测试要钉：重算后 available_fen / frozen_fen = 分录合计；凭证与分录条数不变；非 ledger_mismatch / 已关闭 / 别的 app 拒；请求里带金额被拒；差错单状态与 withdraw_holds 不变；审计有前后值。
# 2026-11-18 be（编排 D10-2032，写测前清单 couli-runs/CT-24zzn/b2-02x-open-items.md 四项已定）：写测必钉——
#   ① negative_since 沿用入账路径同一规则，三个分支各一条用例（重算后 < 0 且重算前也 < 0 有值 → 沿用；重算后 < 0 而重算前 ≥ 0 → 当天会计日；重算后 ≥ 0 → NULL），另加「前后都为负时原值不动」；
#   ② frozen 合计为负或任一合计超出 bigint → 不写、回 20001 data.fields=[recon_diff_id]、审计记原因，钉「拒绝时余额行与 version 都没变」（契约 CT-24zzna）；
#   ③ 通知（D10-2092 ⑤，替代原「不推送」）：可用余额有变化 → 恰发一条余额更正站内信（CT-24zzu 编码，B2-02z 写入）且与余额写入同一事务，调增调减各一条；仅冻结变化、前后相同、各类拒绝、deleting 与 deleted 会员 → 不发（冷静期内照发，D10-2097）；不触发推送与短信；④ 有变化 version + 1（CAS），前后相同不写余额行、version 不变、审计照写；
#   以及「不关差错单（status / handler_id / resolution / updated_at 不变）、不解除 withdraw_holds」。
#   ⑤ 跨零照入账路径（D10-2041，契约 CT-24zzna）：available 由 ≥0 变 <0 时 account.went_negative 恰发一次且在同一事务里（事务失败回滚则不发）；由 <0 回到 ≥0 时恢复钩子（balanceRecoveredHook）恰调一次；不跨零、拒绝、前后相同时两者都不发生。用入账路径同一个跨零判定函数。
