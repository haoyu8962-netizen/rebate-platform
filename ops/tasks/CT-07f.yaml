# 2026-11-17 w1 入账（编排 D10-1986）：从 CT-07e 拆出「首页配置引用标签」这一半；规则在 规划/01 F-ADM-10、04 §3.2（pool_items.tags），编排 D10-1758 / D10-1761 / D10-1764 / D10-1777 取值照 CT-07e 已定。
# 范围：home-schema.json 的 product_pool 数据源加可选 tags（每项同 CT-07e 规范化规则）；首页配置保存时规范化去重、丢完为空拒（20001，data.fields 指向该数据源的 tags）；首页读池只取 tags 与之有交集的条目（命中任一），兜底池 feed.fallback_pool_id 不筛；正式下发与预览下发都从 product_pool 数据源去掉 tags，不改存储与缓存。
