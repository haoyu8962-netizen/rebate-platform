type: impl
# 2026-11-20 be 入账（编排 D10-2169 ②：现在入账，不占契约槽）。CT-24zzp 给 export_resource 加 withdrawals（D10-2017 ③），B2-08g 实现；
# app.export_tasks 的 resource CHECK（0146 / 0147）只收 users / audit_logs / tax_withdrawals / ledger，不放宽则 withdrawals 任务插不进去。本单先于 CT-24zzp 落地（照 CT-24zzma）。
# 迁移照 0146 / 0147：第一条 DROP CONSTRAINT export_tasks_resource_check + ADD 同名 CHECK (resource IN ('users','audit_logs','tax_withdrawals','ledger','withdrawals')) NOT VALID
# （SET LOCAL lock_timeout '5s'、statement_timeout '30s'），第二条 VALIDATE；文件名 NNNN_export-tasks-resource-withdrawals.sql 与
# NNNN_export-tasks-resource-withdrawals-validate.sql，号落地时取主干最大号 + 1（入账时最大 0149），land 前按冻结规则报。
# export_tasks 不是资金表，不进 APPROVED_GUARD_CHANGES；lint-migrations 若拦，报原文、不绕。db/schema.sql 与 db.gen.ts 由沙箱外 pnpm db:snapshot 重出（outside_needed）。
# 冻结用例：[AC-B1-34b#4] 按 rule_change 改（见 modify_existing）；同文件加 1 个新块 [AC-CT-24zzpa#1]（resource=withdrawals 的行可插入、filters 原样往返、masked true），
# 只用该文件已有 import 与辅助、块外一字不动（D10-1812 (乙)）；其余 15 条登 red_exempt，首轮 spec-test 任务书逐字贴声明并逐条确认，有一条不能确认即 fail。
