id: B3-08zc
repo: rebate-platform
title: B3-08zc：助手回复落库与会话历史接口——run 收尾时把过滤后的文字与本轮卡片编号写进 agent_messages、卡片内容写进 agent_cards，与终态同一事务；卡片不再随留痕异步写、去掉进程内待写卡；实现 GET /v1/agent/sessions/{id}/messages（规划 11-12 A1，BR-AI-19 细则「助手回复落库」）
type: impl
# 2026-11-12 agent2 入账（规划会话 11-12 → 编排 D10-1287，变更记录 docs/changes/20261112-Agent模型路径与缺口补全.md §2.9、§3.1 A1；SPEC_REF a36eb9360fda）。
# 现状：admit.ts 受理时插一行 text NULL 的助手消息，之后无人回写；卡片经 stream/mount/trace.ts 异步写 agent_cards，订单卡引用先读进程内待写卡（trace-retry withPendingCards / sharePendingCards）再读库；历史接口契约 planned。
# 做法：过滤后的文字与卡片在 stream/run/manager.ts 的 ctx.text / 卡片下发处累积（不改 orchestrator/**），finalize 的终态事务里写 agent_messages.text / card_ids 与 agent_cards；断线后跑完的照写，崩溃由别的请求收尾的这条回复文字为空、不带卡片、结束原因照实；历史与下一轮卡片引用只读已提交数据。历史接口：形状照契约，收益卡走历史投影不带金额，非所有者 30504，过期只读，用户消息返回落库的脱敏形式。
# 契约（去 planned、用户文本改脱敏形式）归 content 的 A9，接口部分以 A9 合并为前置；落库部分不依赖。stream/mount/** 与 agent 线 B3-05n（A4）有交叠，先后在 notices 约。验收 10 AC-S1-190 ③。RV1，独立 Claude 写测试，Opus 实现，Codex 评审。 D10-1297：钉旧做法的冻结测试并进本单——trace-retry/pending.test.ts、card-refs.int.test.ts（[AC-B3-08y#7] 进程内待写卡，11 条）随实现删除；[AC-B3-08q#5]、[AC-B3-08y#1/#5/#8] 只改卡片断言（卡片在终态提交时恰好落一次、与 trace 写者无关），工具调用部分不动；第 2 次写测试又查出 [AC-B3-08q#5] 写者抛错两条、写者挂起一条与 [AC-B3-08y#6] 注销一条同样钉旧做法，一并改；退役对照表在 PR 说明。
