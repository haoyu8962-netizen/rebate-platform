title: CT-06zzzzzj（FU-SUPPORT-TOKENS-HARDEN）：文件级支撑条目的块外判定改为放行清单——冻结文件里只认七类插入，其余一律拒（D10-1795）
type: guard-change
# 2026-11-16 be 入账（编排 D10-1795；合并后取当时主干最大 approvals id + 1 登记，规划/11 §7.1 第 5 行例外）。起因：CT-06zzzzzi 的白名单 (A) 是「纯插入 + 拒绝清单」，四轮评审每轮都找出清单外的
#   原地改写（代码评审 r3 两条 S2：已有实参前插入、插入运算符、已有调用后接 .then / .catch、function 后插 *、vi.spyOn / vi.stubEnv、Object.assign、别名后赋值）。改做法：只认放行清单。
# 放行清单（D10-1880 改写，取代 D10-1795 的七类；块外、合并基→头；注释不算 token；CT-06zzzzzi 已有规则原样保留：基线 token 按序保留、括号树不变、不重名、含断言调用的语句不许插、拒绝清单单测照留），「位置 × 表达式」两层，清单之外一律拒，报错点名文件与插入 token 所在行：
#   位置层——P1 既有语句之间新增整句：带绑定的 import 声明（来源不限，裸的副作用 import 拒）、const 新名字 = 表达式（含 export const）、[await] 调用 作表达式语句、文件末尾 export { … }；P2 既有列表尾部：调用实参表末尾、对象字面量末尾的属性或展开、形参表末尾的可选形参（无默认值、不重名），以及已有 import 花括号里加名字（位置不限）；P3 类型位置：类型标注、可选标记、interface / 类型字面量的可选成员；P4 上述插入附带的尾逗号。
#   表达式层（P1 / P2 里新写的表达式，递归）——标识符、成员访问 a.b、字面量、由这些组成的对象字面量、被调者是裸标识符的调用（实参同此文法）、await、对象字面量尾部对上述的展开；成员调用作被调者一律拒，唯一例外是冻结 #33 钉住的 Promise.resolve(…)。运算符、const 声明以外的赋值、箭头 / function / class、new、可选链、控制流、逗号表达式、vi.*、Object.*、其他成员调用、已有实参之前或之间的插入、已有调用后接 .then / .catch、function 后插 * 全部默认拒。
# 验收（三组定例同时成立，D10-1880）：CT-06zzzzzi #1–#46 一字不改全绿（它们钉的放行集合是下限，不走 modify_existing）；couli-runs/CT-06zzzzzi/review-money-r3b.json S2-1 / S2-2 全部例子拒；w1 已落地的冻结改写（B1-02zzzb / B1-02zzzc 块外差异，含展开调用 ×4、属性值为调用 ×3、尾逗号、OPERATIONS 追加对象字面量属性、node:crypto 的 import）全部放行——detachPhoneReply({ … }); 机械上放行，但仍按 w1 的 C 类专项由编排按 #24 人工核，测试里注明。三组里按两层文法判出来方向不对的，列出来报编排，不硬写、不加特例。
# 过渡期（本单合并前）：凡用文件级条目的 PR 一律报编排按 approvals 24 核，核过才挂守候（D10-1795）。tools/README.md 那段「评审须逐行读冻结文件里的插入」在本单合并后改写为放行清单。
# 分工：规则测试与对抗评审都是全新独立 Claude（claude-run.sh，approvals 36），实现是另一个子代理；本机不跑全量，测试机跑。排在 be 线 CT-13l 之后；B1-02zzzb / zzzc 不等它。
