id: CT-06zzzzzzze
repo: rebate-platform
title: CT-06zzzzzzze：test-guard 的 no-skip-only 认测试选项对象——it / test / describe / suite 第二个参数里的 skip / only / todo / fails 与 .fails 修饰一并拒收，对所有测试文件生效（FU-DESCRIBE-OPTIONS-SKIP，D10-2951）
type: guard-change
# 2026-11-25 ops 入账（编排 D10-2945 / D10-2951 准入账；门禁工具第三类改动，合并照 ops/approvals.yaml 第 16 条由编排核 diff 后加 owner 标签）。
# 起因（最小复现 couli-runs/OPS-lane/D10-2945/repro.ts、repro3.ts，主干 73058df32）：tools/guard/lib/test-guard.ts:23 SKIP_OR_ONLY 只认 `.skip / .only / .skipIf /
#   .runIf / .todo` 修饰写法；测试选项对象只有 retry 在查（retryOptionFindings :351-408），且资金 / 归属测试文件不走它。于是
#   `it('t', { skip: true }, fn)`、`{ only: true }`、`{ todo: true }` 在任何目录都不报；单元测试里 `describe('b', { skip: true }, fn)` 也不报；
#   `it.fails` / `{ fails: true }`（断言失败反而算过）也不报。冻结用例这样改会被 compareTestFile 判块已改 / 整文件重判（拦得住），
#   所以漏的是还没冻结的新规则测试与全部单元测试。
# 做法（只改 test-guard 与它的工具测试 / fixtures）：
#   ① 把 retryOptionFindings 的选项解析推广为测试选项检查：测试 API 调用（含 .each / .for / .concurrent 等链、.extend 出来的测试函数、
#      照现有规则识别的自定义测试函数）的选项对象里出现 skip / only / todo / fails 键（裸键、引号键、计算键 ['skip'] 都算），值不是字面量 false
#      就报 no-skip-only；选项读不了（展开、不是本文件对象字面量的变量）照现在 retry 的口径拒收。对所有测试文件生效，含资金 / 归属测试文件
#      （它们的整行 retry 规则不变，另加这条选项检查）。
#   ② SKIP_OR_ONLY 加 fails（`it.fails(` / `test.fails(` 及链式）。
#   ③ retry 的现行判定（含 0 放行、资金文件整行规则）、其余规则、报错文案风格不变；不改 test-blocks、red-check、evidence-check、task-file。
#      若实现发现必须改这些文件才能生效，停下报编排，不自行扩 paths。
# 影响面（ops 用同一套解析的原型扫过，D10-2945/pre-ledger.md）：主干 6845 个测试文件、近两天 29 个工作树 190,952 个文件、两个开着的 PR 分支均 0 命中，
#   升级不会让在途单变红。
# 规则测试至少钉：① it / test / describe / suite 各带 { skip: true }、{ only: true }、{ todo: true }、{ fails: true } 都报 no-skip-only（单元测试、规则测试、
#   资金 / 归属测试文件各至少一例）；② `{ skip: false }` 等字面量 false 不报；③ 引号键、计算键、.each 链、.extend 测试函数都抓到；④ 展开选项与外来变量照旧拒；
#   ⑤ it.fails / test.fails 报；⑥ 现有 retry 用例与普通 { timeout } 选项不受影响。
# 2026-11-26 置 void（ops，编排 D10-3135 / D10-3170）：并入 CT-06zzzzzzzl——三轮码评审都 fail、实现与码评审计数用完，根因在逐字读源码的做法（D10-3056 暂停），负责人 D10-3129 ④ 取用语法分析重做；规则测试提交 2ba20ed7a 与 FU-TESTGUARD-FN-REF-SKIP 由 CT-06zzzzzzzl 带走，未提交的实现不带。
