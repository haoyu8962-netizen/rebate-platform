repo: rebate-platform
title: 入账证实核对不一致的告警（BR-FUND-19，D10-1038）——worker 指标 couli_credit_postcheck_mismatch_open{app_id}（未结案的证实核对差错单数）与 couli-fund.yaml 规则 CouliCreditPostcheckMismatch
type: impl
# 2026-11-09 funds 入账（编排 D10-1038、D10-1180）。方案原写「pino → 告警规则」，核代码发现仓库没有日志告警管道（规则全部读 /metrics），改成指标；pino 告警行保留。
# 口径：recon_diffs 里 type=ledger_mismatch、status=open、ref_type=voucher、ref_id 以 credit_postcheck: 开头的条数，按 app_id。差错单结案告警即消；是存量计数，重试不会重复（D10-1065 的 COMMIT 重复不影响这条）。
# 照 B2-09ze：ledger 只读端口经 entry.ts 接线、只 worker 导出、读失败即抓取失败不报 0。缓存 30 秒（BR-FUND-19 要 5 分钟内告警，不用通用的 5 分钟缓存）。
# 规则 fund: 'true'、severity critical。for 取 0m：BR-FUND-19 明写 5 分钟内，通用 for 5m 加抓取与缓存会超过；冻结 [AC-B1-01zzi#4] 要求一律 5m，只对这一条例外，#24 编排核。无迁移、无契约。
