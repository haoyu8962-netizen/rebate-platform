    retitle_to: '[AC-B2-05d#30] 锁内复核 ⑤⑥（实名失效按 30304）与 ⑦⑧⑩⑪⑫，不把步骤 ①–③b/⑥a/⑨/⑬ 重插到锁内链'
    reason: rule_change
    br: [BR-WDR-07]
