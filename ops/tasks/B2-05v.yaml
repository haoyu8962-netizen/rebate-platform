    note: 'BR-WDR-07 ④（2026-10-23 D10-192 起）锁内重新执行 BR-WDR-03 的 ⑤⑥⑦⑧⑩⑪⑫。原用例把实名未验、姓名不一致也放进「锁内不重判」的一组并期望通过；改后锁内按 ④⑤⑥ 的顺序拒绝：实名失效 30304（D10-3590：⑥ 要比对实名姓名，实名没了按 30304）、收款方式为空 30305、姓名不一致 30307；①–③b、⑥a（劳务协议）、⑨、⑬ 仍不在锁内重判的断言保留。无金额断言改动。'
