# 2026-11-13 前端线 f1-frontend-7 入账（编排 23:0x，FU-FLAKE-F107JD-BROWSER2，按 flake_fix）。诊断：CI 运行 43234392321 第 1 次 verify-int-4 的失败快照——页面上没有「二次验证 · 动态码」对话框，原因框仍开着，五个原因类别一个都没选中并出现「请选择原因类别」，即选类别那一下没生效、提交被前端校验拦下、动态码对话框从未打开；StepUpModal 的 inert 隔离被快照排除（body 子元素无 inert / aria-hidden）。
# 机制：对话框 toBeVisible 通过时 antd zoom 打开动画还在进行，按下与松开之间框体被缩放挪开，click 落到共同祖先，单选未激活。同文件 #1 在点击前先 screenshot()（会等动画结束）所以不受影响。admin-risk-rules 的 [AC-F1-10fa-BROWSER#2] 同样在确认框 toBeVisible 后立即点确认，同类报错（F1-11a land 时一次），一并登记。
# 改法：只在这两条用例块内，点对话框里的控件前先等打开动画结束（document.getAnimations() 全部完成且 .ant-modal 不带动画类，同 screenshot() 的等法）；07jd 选完类别补一句单选已选中的断言，让丢点击当场报出。期望、夹具、帮手的已有行为不变；实现代码不动。由新鲜独立 Claude 改，证据记本机加压循环全绿。
