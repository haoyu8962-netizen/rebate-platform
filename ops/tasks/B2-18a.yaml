    reason: rule_change
    br: [BR-FUND-04]
    ruling: D10-2425
    note: '负责人 2026-11-21 同意。同上：差错类型清单由 [settle_missing] 改为空；基数随结算推到 900、不登记 settle_amount_mismatch、R5 按 900 入账的断言不动'
  - file: 'test/spec/settlement/worker-catchup/recover.int.test.ts'
    test: '[AC-B2-04zg#9] 账单日整日停机：次日补出账补投 07-24 的 bill，快照前提按补跑当天（07-25 → 查 07-24 的快照）判定，生成账单月 2032-06 恰一次；同日再补、隔天补、新的存储都不再送，重放同一任务不重复生成；更早的 06-24 不补；到下个账单日才轮到 2032-07'
