repo: rebate-platform
title: settlement：订单申诉撤销的 R12 生产方与处理（BR-FUND-22 申诉恢复 ①）——appeal.resolved（order、revoked）登记 appeal_restore 差错单；处理时复用 R12，缺快照的同事务补生成
type: impl
# 2026-11-09 withdraw 入账（编排 D10-1091、D10-1093 及 23:56 / 00:05 / 00:36；方案 plan.md §1-4、§9；规则回写 couli #315）。依赖契约 CT-24zzg、前置 B2-09gc、豁免 B1-03zk。
# 生产方：新消费者 settlement-order-appeal-restore（evt.settlement-order-appeal-restore，并发 1，只在 worker 入口注册），事件事务内：非 order + revoked 确认不写；载荷错、订单找不到、缺进入行拒绝；lockOrderKey 后锁内重读，不是 VOID 或 reason≠BLACKLIST 记 warn order_appeal_restore_skipped 并确认；否则 registerReconDiffOnce：type appeal_restore、source R3、period chinaMonth(clock)、ref_id {order_key}#RESTORE#{entry_id}、expected_fen = 有效佣金正数部分（只展示）、dedupe_key appeal_restore:order:{app_id}:{order_key}:{entry_id}（按进入 VOID 的历史行去重，不按 appeal_id）。登记时不改订单、不写分录。处理：admin-recon-restore 分派加一支（type appeal_restore、reason_code BLACKLIST、ref_id 可解析）进 restorePlatformDiff，账户申诉路径不变。
# 补快照（restoreVoid 共用，平台恢复一并受益）：已归因、platform_status ∈ {PAID, RECEIVED, SETTLED}、无 commission_splits 才在 R12 事务内生成，规则版本、等级与上级按 paid_at（BR-CALC-11、12）；推广位场景缺失按非淘礼金并告警（待编排裁定 7）。选不出任何已发布版本 → 不恢复、差错单不动、20001 restore_snapshot_unavailable。佣金未回传 → 照常恢复并**同事务写快照类待处理行**（SERVICE_FEE_RATE_MISSING / AMOUNT_PARSE_FAILED）；缺平台规则或预留 → 照常恢复并写 RULE_VERSION_PLATFORM_MISSING（编排 00:36），由现有重试扫描补。未归因、DEPOSIT_PAID 照常恢复、快照按原时点。
# 不做 R13、BLACKLIST_CONFIRMED（funds）、FU-R12-COMMISSION-CHECK。RV2，规则测试新鲜独立 Claude，money 评审 Codex medium。开工后先跑 settlement/platform-restore、admin-recon-restore 已有用例。
