# 冻结用例：探针共 35 条。本次只登非资金、非归属目录的 12 条；其余 23 条（资金与归属目录 21 + 收款契约 2）等负责人答复后出台账补丁再登，落地在那之后（D10-2821 b），契约不做半删。.each 行不改名（D10-2154），标题里的「step-up 头」以块内断言为准。
