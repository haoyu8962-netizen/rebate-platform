# ① apps/h5/src/entries/app/pages/invite/invite-page.tsx:230–283 failedPoster 只在 AsyncImage onError 时写入、从不清除——海报地址 A 失败 → 换 B → 换回 A 且这次加载成功，posterFailed 仍为真，卡片仍 aria-disabled、点不开预览。修法：图片加载成功时清除失败标记（AsyncImage 加可选 onLoad，或按「本次加载」记失败），换地址后状态以本次加载结果为准。
