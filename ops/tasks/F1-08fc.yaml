title: F1-08fc：余额流水页【导出当前筛选】收到带统一外壳的 5xx 也按结果未知——提示「导出任务可能已创建，请先到【导出记录】核对，再决定是否重新导出。」，不报「未能创建」（FU-F108FB-5XX-AS-UNKNOWN）
type: impl
# 2026-11-18 入账（前端线 fe，编排 D10-1981 记的 S3、D10-1988 准做，低优先）。来由：F1-08fb 把带统一外壳的 5xx 归「导出任务未能创建，请稍后再试。」，但服务端可能在写入任务后才出错、任务其实已建；adminCreateExport 无幂等键，用户照提示重试会多出一个重复导出任务（只读文件、不涉资金）。与调账页「5xx 归结果未知」对齐：带外壳的 5xx 也提示先到【导出记录】核对。
# 范围：只改 apps/admin/src/pages/ledger/model.ts 的 exportRejected 分类（httpStatus ≥ 500 的带外壳失败 → 结果未知）与必要文案；10403、20001、其他 4xx 确定失败、网络 / 无法解析的处理不变；仍不自动重发。
# 冻结用例：[AC-F1-08fb-ERROR#6] 断言「HTTP 500 带统一失败外壳是确定失败」→ 按本单改为结果未知提示（rule_change，标题随之 retitle_to）；同文件可新增用例（如 503 带外壳同样按结果未知）。errors.test.ts 导入 ./fixtures.ts，若正式先红整份判定，其余块按 red_exempt 另补台账并走门禁补录（D10-1833）。
# 资金页面路径（apps/admin/src/pages/ledger/** 属 RV2）：money 评审。D10-1872：规则测试与首轮评审用 Codex。
# 2026-11-18 台账补丁 1（D10-2003）：Codex 额度用尽、11-23 21:57 前不可用，规则测试尚未写；tester 改为 claude-independent，规则测试与首轮评审改由无上下文的独立 Claude（claude-run.sh），证据 engine 如实记 claude-independent。
