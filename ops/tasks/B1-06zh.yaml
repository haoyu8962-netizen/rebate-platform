# 2026-11-08 w1 入账（D10-1061 ② / D10-1063；方案 couli-runs/FU-PDD-BINDING-PID/plan.md）。BR-ID-22「拼多多：授权状态按 (user_id, pid) 记录」，影响面写明唯一约束改为 (app_id, user_id, platform, pid)。
# 本单只做库：db/migrations/0135_union-bindings-pdd-pid.sql（D10-1063 定号）——union_bindings 加 pid text NULL；旧唯一索引 union_bindings_user_platform_key 拆成两条部分索引：非拼多多照旧 (app_id, user_id, platform) WHERE platform <> 'pdd' AND 未释放四态；拼多多 (app_id, user_id, platform, pid) NULLS NOT DISTINCT WHERE platform = 'pdd' AND 未释放四态（NULLS NOT DISTINCT 让 linking 单落地前仍按空 pid 写的拼多多行保持「每用户一行」，过渡期不变松）。
