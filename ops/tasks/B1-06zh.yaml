# 全仓已 grep：除 schema.sql 外只有 0018 迁移、taobao-reauth-read.ts 注释、B1-06v 台账注释提到旧索引名，无代码 / 测试按名依赖；冻结 [AC-B1-06b#6] 断言唯一键含 (app_id, user_id, platform) 列集，拆分后非拼多多那条仍满足。linking 读写按 pid 留给第二单（deps 本单）。
