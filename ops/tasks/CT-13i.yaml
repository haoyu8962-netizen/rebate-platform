title: CT-13i：events 去重收紧（FU-CT13G-DEDUP-HARDEN + FU-EVENT-DEDUP-APP-KEY）——去重主键改 (app_id, event_type, event_id)，写入函数批内先去重、按键排序插入消掉反序并发死锁，规则测试补两 app 同 event_id 各自落库、并发真重叠、每条事件各读一次时钟
type: impl
# 2026-11-14 be 入账（编排 D10-1519、D10-1520；来源：CT-13g（#63）独立 Claude spec-test r1 与 Codex money r1 的 S2）。两张跟进合成一张（D10-1519「可以合成一张 PR」），排在 CT-13h 接线之前。
# ① FU-EVENT-DEDUP-APP-KEY（编排定，不报负责人：表的形状，不涉钱 / 归属 / 授权）：新迁移（编号落地时取下一个空号，文件名以 _event-dedup-app-key.sql 结尾）把 app.event_dedup 主键改成 (app_id, event_type, event_id)（规划/02 §多 App 隔离：业务唯一键以 app_id 开头；表现在是空的），写入函数的冲突目标跟着改；04 §6.4 回写记入下一批小修。
# ② FU-CT13G-DEDUP-HARDEN：recordEvents 在事务内先批内去重（同键只留首条）、再按 (app_id, event_type, event_id) 排序插入，消掉两个并发批次相反顺序含相同键时的 40P01；计数语义不变。
# 规则测试（Codex，新目录只新增，CT-13g 的冻结用例一字不动、不需要 modify_existing，D10-1520）：两个 app 用同一个 event_id 各自都落库、互不可见；两次并发调用真的重叠（如用 advisory 锁 / 屏障让两边都进事务后再继续）；每条事件各读一次时钟测不过（用会前进的 Clock）；反序并发批次不死锁、各自计数正确。
# 本机重活（D10-1477）：写手自检只对改动的文件跑 eslint 与 prettier；全量 typecheck / lint / 任何 vitest 不在本机裸跑，要跑就加 zsh ~/couli-orch/local-heavy.sh；交回后由本线在测试机跑 verify:fast。depcruise：只有 *.int.test.ts 能 import @couli/db/testing。
# 2026-11-14 补（编排 D10-1553；以本条为准，取代 D10-1551 的 red_exempt）：原 #3（同键并发真重叠）、#6（每次调用只读一次 Clock）主干即绿，red_exempt 对新文件不生效，已由新鲜独立 Claude 逐字搬到 CT-13j（test/spec/analytics/record-events-behaviour/，改号 [AC-CT-13j#1] / [AC-CT-13j#2]）、以变异代替先红；本单只留 5 条照常先红，CT-13j 合并后那两条是冻结用例，本单实现须保持其绿。
# 2026-11-14 补（编排 D10-1580 / D10-1597 / D10-1604；CT-06zzzzzh #113 已合并）：#92 复活。CT-13e 冻结用例 test/spec/db/events/storage.int.test.ts 的 #1（主键正好是 event_type, event_id）、#2（跨 app 同键被拒）钉的是 D10-1488 的旧口径，D10-1519 改为按 app 隔离（规划/02 §12.3「业务唯一键以 app_id 开头」）；按新原因 ruling_correction 登记修改（不挂 BR）。由不带实现上下文的独立 Claude（claude-run.sh，Codex 额度用尽至 11-20，D10-1604 / approvals 36）只改这两个块：#1 主键断言改为 (app_id, event_type, event_id)；#2 跨 app 同键改为两边都能插入、同 app 同键仍被拒。故 tester 改为 claude-independent（已写好的 5 条规则测试仍是 Codex 写的，证据如实记）。迁移号落地时重取（0143 不保留，D10-1580）。
