# 范围：只新增用例，新建与红冲各 2 条（40901、50001 各 1 条），放新目录 test/spec/frontend/admin-adjustment-unknown-retry/，可 import F1-08ce 的 admin-adjustment-create 夹具与辅助，不改任何已有文件。每条断言：重试收到 40901 / 50001 后仍显示「上次提交结果未知」、输入锁定、提交按钮不出现、只剩【重试】【去列表核对】；再按【重试】仍用原 Idempotency-Key 与逐字节相同的请求体；最终只生效一张（D10-1731）。
