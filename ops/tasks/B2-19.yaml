# 2026-11-22 funds 入账（规划/05 B2-19 行，SPEC_REF 693f6a6698d6；负责人 2026-11-21「京东有返回订单状态。以 API 为准」「联盟是多少就是多少」，编排 D10-2408 ① / D10-2425；docs/changes/20261121-京东拼多多结算以联盟API为准.md）。上线前必修（D10-2402：现两平台订单进不了月结入账）。资金单：Claude 实现、独立方写测、Codex 全量 spec-test 与资金评审。
# ① 拼多多 order_status 5：按 BR-FUND-02 细则「京东、拼多多已结算时的结算佣金」写 settle_commission_fen 与 order_settlements（source=API），去掉适配器里结算佣金恒为空的待办；2、3 仍只写预估。② 京东 validCode 17 且 payMonth 已过：映射为结算事件（P4 / P12），以 actualFee 写结算佣金与结算记录；配置 union.jd.settle_by_pay_month.enabled 登记进配置注册表，关掉时回到只认结算明细上传。
# ③ 已结算之后结算佣金再变化照常追加结算记录（seq+1），入账前 R7、入账后按 R9 / R10 / R8 分路，不新增迁移。④ 配置注册表里 orders.jd.refunded_quantity_r9_enabled 默认值改为开。⑤ specs/order-status-map/jd.csv、pdd.csv 标出已结算判定，specs/union/jd.md、pdd.md 金额一节同改。取值、判定边界与默认值只读 08，不在台账复述。
# paths 按任务行先列全，开工前先只读盘点（代码落点、种子与默认值落点、受影响冻结用例），再以补丁收窄或补登 modify_existing；是否拆单同时定。两平台各用一笔真实已结算订单实测（09 V-49、V-50）是上线前事项，不在本单验收内。验收指向 10 AC-S2-115。
