id: F1-07edb
repo: rebate-platform
title: 后台订单页标准化 B 段第二张（改冻结用例）——默认 8 列与操作列、行内【查看】开详情抽屉（深链直开、关闭回原位、筛选不丢）、列表常驻同步状态条，并修 F1-07ed 两条 S2（越界页回第 1 页、URL 年份小于 100）
type: impl
# 2026-11-24 入账（前端线 f1-frontend-7；编排 D10-2734 / D10-2735 / D10-2748，登法 D10-2799 / D10-2826：rule_change、br BR-ID-46；任务书 couli-runs/briefs/ADMIN-ORDERS-STANDARD-20261122.md §4 B；规划 08 BR-ID-46，couli#28 → 081b17766395）。
# 只做（写死）：
#   ① 默认列：订单号、平台、商品、用户、付款时间、付款金额、联盟佣金、返利状态 8 列与【操作】默认显示（列头文字沿用现有），平台状态、标记默认隐藏，可在【列设置】打开（D10-2735）；平台额外列仍默认隐藏。
#   ② 行内【查看】开右侧详情抽屉（用 F1-07ec 的 detail-drawer）：URL 带抽屉参数可直接打开，关闭后回到原滚动位置，筛选、页签、页码不丢；【详情】仍进整页 /orders/<order_id>，整页详情与「分佣快照」「分佣明细」不变（D10-2734）。
#   ③ 列表上方常驻同步状态条：初次加载只用现有 GET /admin/v1/order-syncs 取最近一条（page=1、page_size=1），显示平台显示名、状态与北京时间；无记录显示「暂无同步记录」；接口失败只在状态条显示「同步状态读取失败」，订单列表照常；不请求 limits，不新增请求路径（D10-2748）。
#   ④ F1-07ed money r2 两条 S2：越界页（items 为空、total 大于 0）上分页器点第 1 页能回第 1 页并同步 URL；URL 里年份小于 100 的日期不被 Date.UTC 当成 19xx（FU-F1-07ED-PAGE-OVERFLOW / FU-F1-07ED-URL-DATE-YEAR）。
# 不做（写死）：新筛选、页签数量、汇总卡、导出（D3）；暂扣 / 解除暂扣 / 指派（C 段 F1-07ee）；改归属、重新分佣、手动锁定、总代类列、批量暂扣（D10-2669 ③）。不改 contracts/**、apps/admin/src/components/**、App.tsx 路由，不加依赖。
# 冻结用例：只改下面 12 块（补丁 1 加 LIST#2、ENTRY#3、BROWSER#1 / #2：规则测试评审 r1 指出它们依赖「标记」列默认可见或首屏零次 order-syncs，与 BR-ID-46 冲突），改到与 ①③ 一致为止，别的断言一字不动；先红或 --related 若列出别的冻结用例要改，先报编排补登，不得顺手改。visual-baseline 订单页截图变化只出报告，不挡（D10-2734）。
