id: B3-05u
repo: rebate-platform
title: 'A7（规划 11-12 §2.12、§2.13）：链接消息确定性路径的失败提示与退还——无返利出 no_rebate.notice，服务端原因出 agent.notice.quote_failed，每个链接都因服务端原因没出成报价卡时不出逐条提示、以 error 50401（retryable false）结束并按现规则退还'
type: impl
# 2026-11-22 agent 线入账（D10-2327 顺序 A7；编排 D10-2553 两件都取甲；入账前说明 couli-runs/AGENT-lane/b3-05u-prep.md）。
# 现状（主干 66422ffff）：orchestrator/deterministic/index.ts 不论部分还是全部失败都 done stop；parse_error 出 error.<码>，price_unavailable / no_card / runner 抛错一律 error.50301；
#   tools/quote/index.ts 的 isDeliverable 把无返利卡（rebate_basis=no_rebate）归成 no_card（不登记 link）。情境入口已有 serverFailure()（50401、retryable false），stream/run/manager.ts 退还判定已不把 notice 算卡。
# 做法：① runner 结果分三类——出卡（ok）；商品本身原因（parse_error 30131 / 30132 / 30141、price_unavailable、no_card、新增 no_rebate：仍不出卡、不登记）；
#   服务端原因（新增 server_failed：ParsingError 50301、parse 或报价 / 登记阶段抛出的任何非业务错误，含我方库写失败与未归类异常，D10-2553 ②甲）。
#   ② 每链接 notice：no_rebate → no_rebate.notice；服务端原因 → agent.notice.quote_failed；其余商品原因照旧 error.<码> / error.50301（price_unavailable、no_card 不动）。
#   ③ 全部链接都是服务端原因 → 不出逐条 notice（tool.status failed 照出），以 error 50401 retryable false 结束（msg 取 error.50401 文案，同 entry.serverFailure）；只要有一个出卡或有一个商品原因 → stop，各链接按各自原因各出一条 notice。
# 必满足（D10-2553 ②）：a) 取消（signal aborted）不归服务端原因，照旧 stop 且之后不写帧；b) 我方故障按服务端原因处理时必须留工程可见的错误日志（pino，不含原文与金额）或走现有告警，不得静默。
# 验收（§2.12 / §2.13）：服务端原因与商品原因逐类区分；部分链接成功；全部服务端失败 → 50401 且退还、业务结果照常计数；崩溃后由别的请求收尾结果相同（BR-AI-23 细则）；生产文案断言下发文字不含花括号。
# 冻结用例（D10-2553 ①甲）：只许把下面 5 处的期望键由 error.50301 改为 agent.notice.quote_failed，别的断言一字不动；先红 / --related 若列出别的冻结用例要改，先报编排补登，不得顺手改。标签由编排按 approvals 第 24 条核后加。
# 补丁 1（D10-2557 / D10-2558 甲″）：path.test.ts 的 modify_existing 由模板名改为 Vitest 展开全名逐行登（工具只认展开名；删行被 evidence-check --early 拒，原话 couli-runs/B3-05u/probe-early{1,2,3}.json）；tpwd [AC-B3-04g#3] 基线表展不开，登法待 w1 判，暂按原条目留着。
# 风险级：agent 模块（白名单 RV1）；涉及扣次数 / 退还，门禁若判 RV2 以门禁为准。spec-test 任务书原样附 D10-2317 ①；本机只跑单文件，重活上测试机（D10-2262）。
