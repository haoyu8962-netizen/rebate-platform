title: 后台备注 / 原因输入框长度按 Unicode 码点计（【核销】WriteOffModal 起，同类备注框一并改）：校验与字数显示 trim 后按码点、不截断合法输入，与各接口服务端计数一致（编排 21:17，F1-08ec r1 S1 同类）
