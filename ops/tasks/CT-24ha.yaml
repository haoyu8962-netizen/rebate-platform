# 淘宝只有订购类服务商应用、且授权返回 re_expires_in > 0 时 refresh_token 才能用；现在库里不存 re_expires_in，后台看不出能否自动续期。
# 只改 contracts/openapi.yaml 的 AdminUnionAccount 行（列表与手工凭据保存响应共用）：加 auth_refreshable（boolean 或 null），说明段同步；不改别的操作、错误码、枚举。
# 补丁 1（2026-11-22，编排 D10-2629，回 contract r1 两条 S1）：① 行模型由 adminListUnionAccounts 与 adminPutUnionCredential 的响应共用，能否续期是账号本身的属性，手工录入恒为 null 或缺省，说明里写明；② 契约先行，规划 04 §6.6 补这一行列进待并入（编排加），本单照常 land。
# 取值：true = 当前凭据来自一次返回 re_expires_in > 0 的联盟授权；false = 返回了 re_expires_in = 0（或平台写明不可刷新）；null = 不知道（手工录入、none 平台、开始记录之前的授权）。
# 字段**可缺省（不进 required）**：服务端记录这几个数值的单（③）等 BR-ID-24 规划回写后才入账（D10-2587），在那之前主干响应不带它，缺省与 null 同义。
# 只给能否续期的结论，不返回 re_expires_in 等原始时长，也不返回任何 token（D10-2587 ① 各时长秒数为可选，取最小）。
