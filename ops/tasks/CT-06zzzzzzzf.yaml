id: CT-06zzzzzzzf
repo: rebate-platform
title: CT-06zzzzzzzf：评审产出校验器的范围判定只按 finding 的 file / line；被判范围外的 S0 / S1 不再把结论重算成 pass，校验器以退出码 3 标「需人工核」、codex-run / claude-run 以 13 停链（FU-REVIEW-VALIDATOR-OOS-RECOMPUTE，D10-2949 / D10-2976）
type: guard-change
# 2026-11-25 ops 入账（编排 D10-2976：负责人 2026-11-25 同意评审门禁三条，D10-2970 ⑩；approvals 185 待登记，#719——合并前本台账以「负责人 2026-11-25 已同意（D10-2970），approvals 待登记」为准）。 门禁工具第三类改动，合并照 ops/approvals.yaml 第 16 条由编排逐行核 diff 后加 owner 标签；本单改了第 14 条的范围口径，负责人已同意（D10-2970 ⑩ (a)）。
# 起因（回看 couli-runs/OPS-lane/D10-2949/report.md）：tools/agent/validate-output.ts scopeReasons（:221-252）在 finding 的 file 位于范围内时，还把 rule / scenario / suggestion
#   全文里出现的仓库路径（citedPaths :206-214）抽出来，全在范围外就整条移出；normalizeReview（:356-379）再按剩下的 S0 / S1 重算 verdict，只打 warning、退出码 0。
#   近 7 天 11 次移出、S0 / S1 7 次、4 次 fail → pass（B2-18 r5、B2-02xb、CT-06zzzzzzzc、F1-08an canary 5）。
# 做法（只改校验器与读它退出码的两个包装脚本、它们的工具测试与 README）：
#   (a) 范围只按 finding 的 file（与 line）判：删掉「file 在范围内、但全文引用的路径全在范围外就移出」这半句（:240-247 与文件头 :18-24 的说明一并改）；
#       refs 判定（rule 里的 BR 全不在 refs 内）与评审方自标的 [out-of-scope] 照旧。
#   (b) --rewrite 时，被判范围外的 finding 里若有 S0 / S1：不重算 verdict——保留评审方原判，被移出的照旧进 out_of_scope 与 out-of-scope.md，
#       另打一条 warning「N 条 S0/S1 被判范围外，需人工核」，并以退出码 3 结束（0 / 1 / 2 的含义不变）。只有 S2 被移出时照旧重算、退出 0。
#   (c) rule 为 prompt-injection、或 file 指向任务书 / 运行目录（../ 开头、brief.md、couli-runs 下）的 finding 一律不移出、不重算，按 (b) 走退出码 3。
#   (d) tools/agent/codex-run.sh（claude-run.sh 复用它）把校验器的 3 记为新的包装退出码 13「评审有被判范围外的 S0/S1，需人工核」：产出照常保留、meta.json 的
#       validation 记 needs-human、validation_messages 原样；不当 pass、也不当「校验不过」重试；轮次照计。tools/agent/README.md §4 退出码表加 13 一行。
#   不改评审输出 schema、提示词、evidence-check（那是 CT-06zzzzzzzh）；必须改才能生效就停下报编排。上线只改变「有 S0 / S1 被判范围外」这一种结局（静默 pass → 停链），与 D10-2954 临时做法一致。
# 规则测试至少钉：① B2-18 现场形状（file 在范围内、场景里举例引了范围外路径）不再移出、结论仍是 fail；② 只引范围外契约路径的范围内 finding（B2-02xb 形状）不移出；
#   ③ file 在范围外的 S1 → 移出、verdict 不重算、退出 3、out-of-scope.md 照写；④ 只有 S2 被移出 → 照旧重算、退出 0；⑤ prompt-injection / 任务书路径的 S1 不移出、退出 3；
#   ⑥ refs 判定与 [out-of-scope] 标记照旧；⑦ codex-run 收到校验器 3 → 退出 13、meta.validation = needs-human、产出文件在。
# 台账补丁 1（编排 D10-3059）故障口径：磁盘满 / 读写故障 / 记录损坏时只要求两条——① 不得退 0、不得把 fail 写成 pass；② 已写出的评审原文与旁路记录不得被改坏；此类故障下退出码是 13 还是别的非零值不作保证（编排对任何非零都按不能往下走；旁路记录在，磁盘恢复后重新校验仍退 3 / 13）。r5 只修：(a) 包装已定最终码 13 后元数据写失败不改最终码、仍退 13、失败只打 stderr；(b) 旁路记录 entries 非数组按记录坏了处理（保留原文件、不写回、非零退出）。
