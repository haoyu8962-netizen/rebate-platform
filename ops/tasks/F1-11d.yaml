title: H5 淘宝授权回调中转页：apps/h5 新入口 auth-callback，只把 code / state 透传到 couli://auth/taobao（字符集与长度白名单、其余参数丢弃），不存不打日志不埋点；拉不起 App 时只提示回到 App（D10-2716 ②）
type: impl
# 2026-11-23 w1 入账（编排 D10-2716 ②，归本线，与 B1-04zzzzm 并行；方案 couli-runs/W1-search-linking/taobao-auth-plan.md §1 第 3 步）。部署在 couliapp.cn 下 H5 域名的 /auth/taobao/callback（ops 部署，与开放平台登记回调同顶级域名，DM taobao/guides/118.md:112）。
# 行为：读 location.search 的 code、state（各自须匹配 [A-Za-z0-9_-]、长度 1–256，否则不跳转，只显示提示）；error / error_description 存在时不带 code，只带 state 与 error=1 跳回让 App 提示授权未完成；
#   跳转用 location.replace('couli://auth/taobao?code=…&state=…')（encodeURIComponent），其余参数一律丢弃；先 history.replaceState 清掉地址栏查询串；页面不调任何接口、不写 storage / cookie、不打日志、不加埋点脚本。
# 深链 scheme couli 已在 contracts/apps.json inbound 登记；不改契约。vite.config.ts 的 ENTRIES 加 auth-callback。
# 补丁 1（D10-2717，安卓 design §12 A 由 w1 定）：部署 staging https://h5-stg.couliapp.cn/taobao-auth-callback（补丁 2 更正，原写 https://l-stg.couliapp.cn/auth/taobao/callback）、prod https://l.couliapp.cn/auth/taobao/callback（prod 随生产配置另定）（同一淘宝应用、同一顶级域名 couliapp.cn）；深链 couli://auth/taobao，参数只 code / state / error（error 恒为 1，不区分拒绝与失败，不带 error_description）；
#   页面 index.html 加 <meta name="referrer" content="no-referrer">；响应头 Cache-Control: no-store、Referrer-Policy: no-referrer 与访问日志不记查询串由 ops 在网关配置；不提供 intent:// 形式。
# 补丁 2（2026-11-27，编排 D10-3560 / D10-3567）：staging 地址更正为 https://h5-stg.couliapp.cn/taobao-auth-callback（= staging 的 TAOBAO_USER_OAUTH_REDIRECT_URI）；页面不看路径，冻结测试里的 PATH 只是测试路径、不改。
