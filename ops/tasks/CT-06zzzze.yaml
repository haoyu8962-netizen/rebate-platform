title: CT-06zzzze：CI 减负 A + B1 + E——标签事件不再取消代码那一轮（单独并发组、有上限地等同提交那一轮再复用）、主干推送跑完不取消、纯文档改动走快速通道（D10-1023 / D10-1024）
