# 现状：openLink / convertLink（link-open.ts openHttpResult，failure 固定 data:null）与 openProductShop 在 convert.enabled.<platform> 关闭时 50301 不带 data；createShare 关开关 reason 写死 maintenance；全服务端不读 convert.off_reason.<platform>（只用于 features.platform_status）。三端只读 data.reason、无 reason 按 maintenance → 未开放平台被显示成「维护中」Toast 并错标平台状态（BR-TEXT-14 例：拼多多 not_launched → 不弹 Toast、按钮「拼多多返利即将开放」）。
# 做法：上述关开关路径返回 data {platform, reason}，reason = convert.off_reason.<platform>（缺省 not_launched，与 client-config 的 features.platform_status 同源读取）；createShare 关开关同口径。
# 不在本单：拼多多站长授权失效（{reason: maintenance}，9 处冻结测试 toEqual）与 getUnionAuthUrl 不动；缺推广位 / attr_code / 联盟账号等配置类拒绝维持现状（open-jdpdd 冻结测试钉不带 reason）；契约 description 补句另排契约槽或实现合并后顺手。
