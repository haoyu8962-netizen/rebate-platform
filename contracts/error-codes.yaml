    action: 同 30101；sharer_auth_invalid：不弹授权、不重放、不提供无返利购买，App 内显示 link_landing.invalid，H5 分享中间页（GET /v1/share-pages/{link_id}）显示「分享链接已失效，请联系分享者重新分享」
