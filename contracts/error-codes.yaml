# 错误码表（契约唯一来源，CT-01）。
# 码值、含义、客户端动作、可重试照 规划/08_业务规则/13_命名与编码对照.md §13.11 转写（唯一分配表）；
# data 字段形状照 规划/04 §7。两处不一致时以 §13.11 为准，本文件随之改。
# 本表没有的码视为未分配，不得实现；废弃码不回收、不复用。文案不在这里：客户端取字典
# error.<code>（带 data.reason 的取 error.<code>.<reason>，未命中回落 error.<code>，BR-TEXT-14）。
#
# 字段：
#   code        5 位整数码值
#   http        HTTP 状态码。§13.11 与 04 只规定了 30803、30804 为 409，其余按码段由契约任务自定：
#               鉴权 401 / 403，参数 400，并发 409，业务 422（不存在类 404），限流 429，服务端 5xx。
#               客户端只按 code 处理，不按 HTTP 状态分支。
#   http_also   同一个码在 http 之外还会用到的 HTTP 状态（升序、不含 http 本身）。目前只有 20001：读请求体就失败的
#               请求沿用 HTTP 语义——请求体超过上限 413、Content-Type 不支持 415，响应体照常是 ErrorEnvelope，
#               data.fields=[body]（CT-01d，来由 B1-01za 全局异常过滤器）。客户端同样只按 code 处理。
#   meaning     含义（§13.11「含义」列）
#   action      客户端动作（§13.11「客户端动作」列，去掉文案引用）
#   retry       §13.11「可重试」列原文
#   retry_kind  never（原样重发仍失败）/ after_action（完成前置动作后重放）/ later（等待后再发）/
#               immediate（可立即自动重试，遵守退避）/ not_applicable（「—」）；不带 data.reason 时适用
#   retry_kind_by_reason  §13.11 按 data.reason 区分可重试时，各 reason 的 retry_kind（优先于 retry_kind）
#   data        data 里的字段：字段名 → 取值列表；~ 表示取值不在本表枚举（见来源条目）
#   headers     响应头
#   sources     来源条目（§13.11「来源条目」列）
#   phase       P1 表示 MVP 不返回
#   deprecated  true = 废弃，服务端不再返回；客户端收到按表外 3xxxx 处理
version: 1
codes:
  - code: 10001
    http: 401
    meaning: 未登录；后台（/admin/v1）admin_token 过期或空闲超时同码不带 reason；登录、改初始密码或首次绑定的中间凭证过期、已用或无效带 data.reason=login_ticket_expired（BR-ID-34 细则「首次绑定身份验证器」）
    action: 跳 Login，成功后恢复 pending_action；不登记 pending_action 的操作（BR-ID-10 细则「不适用的动作」）登录后回到发起页，由用户重新提交；这类操作的键出现过结果未知时不换键，登录后回到发起页进入待确认状态（BR-ID-10 细则「敏感操作的幂等键」）；后台：回到登录第一步
    retry: 登录后
    retry_kind: after_action
    data:
      reason: [login_ticket_expired]
    sources: [BR-ID-01, BR-ID-10, BR-AI-11, BR-AI-23, BR-ATTR-05, BR-ID-34]
  - code: 10002
    http: 401
    meaning: access_token 过期
    action: 单飞刷新后重放原请求 1 次；刷新失败清会话跳登录
    retry: 刷新后
    retry_kind: after_action
    sources: [BR-ID-01, BR-ID-07]
  - code: 10003
    http: 403
    meaning: 需要二次验证（含 step_up_token 过期）；后台 step-up 带 data.tier（所需档位 totp / sms；持动态码档 token 调短信档操作同码，data.tier=sms）；短信档操作而账号未登记验证手机号时另带 data.reason=verify_phone_missing（BR-ID-34）
    action: 用户侧：弹 StepUpSheet，验证方式按 BR-ID-08（已绑手机号用短信，未绑手机号的注销用第三方重新授权），拿到 step_up_token 后沿用原幂等键重放；后台：按 data.tier 选验证方式（totp 输入动态码、sms 发短信验证码），在 StepUpModal 里完成后重放；verify_phone_missing 不弹验证，提示先登记验证手机号
    retry: 验证后
    retry_kind: after_action
    data:
      tier: [totp, sms]
      reason: [verify_phone_missing]
    sources: [BR-ID-08, BR-WDR-01, BR-WDR-03, BR-ID-34]
  - code: 10004
    http: 403
    meaning: 需要同意（协议重新同意、AI 单独同意、实名授权、劳务协议 labor_agreement 等）
    action: 弹对应同意组件，同意后重放；例外：原请求是需要二次验证的四个操作之一（提现申请、收款账号变更、换手机号、申请注销）时，不论 consent_type，同意或签署后不重放，回到发起页由用户重新提交，用新幂等键；该键出现过结果未知时不换键，回到发起页进入待确认状态（BR-ID-10 细则「不适用的动作」「敏感操作的幂等键」；提现见 BR-WDR-07 细则「前置步骤的回流」、BR-WDR-31）
    retry: 同意后；上述四个操作：同意后由用户重新提交
    retry_kind: after_action
    data:
      consent_type:
        - privacy
        - agreement
        - ai_third_party
        - id_verification
        - personalization
        - labor_agreement
    sources:
      - BR-ID-10
      - BR-ID-11
      - BR-ID-12
      - BR-ID-14
      - BR-AI-13
      - BR-INV-05
      - BR-WDR-03
      - BR-WDR-07
      - BR-WDR-31
  - code: 10005
    http: 403
    meaning: 需要绑定手机号
    action: 跳 BindPhone，完成后恢复 pending_action；不登记 pending_action 的操作同 10001（含结果未知时不换键）
    retry: 绑定后
    retry_kind: after_action
    sources: [BR-ID-01, BR-ID-03, BR-AI-11, BR-INV-02]
  - code: 10006
    http: 403
    meaning: 账号已冻结或封禁
    action: 展示封禁说明页与申诉入口
    retry: 否
    retry_kind: never
    sources: [BR-ID-31, BR-WDR-03]
  - code: 10007
    http: 403
    meaning: 账号在注销冷静期或处理中
    action: 冷静期跳注销进度页（可撤回）；processing 仅提示
    retry: 否
    retry_kind: never
    data:
      stage: [cooling, processing]
    sources: [BR-ID-27]
  - code: 10008
    http: 401
    meaning: 后台账号或密码不正确（只出现在 /admin/v1 的登录第一步；含账号不存在，不区分；不带 data；每次计入 BR-ID-34 的连续失败计数）
    action: 停在登录第一步提示
    retry: 否
    retry_kind: never
    sources: [BR-ID-34]
  - code: 10009
    http: 403
    meaning: 后台账号已锁定（连续失败 5 次，锁定 30 分钟，锁定期间密码正确也拒绝；data.locked_until 为锁定结束时刻，ISO 8601）
    action: 提示锁定与解锁时刻，登录按钮保持可点（到时可重试）
    retry: 锁定结束后
    retry_kind: later
    data:
      locked_until: ~
    sources: [BR-ID-34]
  - code: 10010
    http: 403
    meaning: 账号待加验且本设备未加验（旧号加验，BR-WDR-01 细则；data.method ∈ id_number / oauth / manual，method=oauth 时带 data.providers，method≠manual 时带 data.fail_limit；不写幂等结果）
    action: 按 data.method 打开 Reverify；通过后回到原页面，由用户用新幂等键重新提交，不重放（BR-WDR-07）；manual 只提示联系客服
    retry: 加验后由用户重新提交
    retry_kind: after_action
    data:
      method: [id_number, oauth, manual]
      providers: ~
      fail_limit: ~
    sources: [BR-WDR-01, BR-WDR-03, BR-WDR-07]
  - code: 10401
    http: 401
    meaning: 请求签名无效或重放（X-Nonce 重复 / 时间戳超窗）
    action: 不自动重放，上报埋点
    retry: 否
    retry_kind: never
    sources: [BR-ID-01, BR-ID-05, BR-ID-09]
  - code: 10402
    http: 401
    meaning: 设备未注册、已失效或非服务端签发
    action: 重新注册设备后重放 1 次
    retry: 重新注册后
    retry_kind: after_action
    sources: [BR-ID-01, BR-ID-05, BR-ID-09]
  - code: 10403
    http: 403
    meaning: App 或请求来源不被允许（含令牌作用域越权）；强更检查结果未知时签发的只读 h5_token（scp=read_only）调用 GET 以外的接口时带 data.reason=h5_read_only（BR-ID-32 细则「只读作用域」）；后台来源 IP 不在白名单带 data.reason=admin_ip_not_allowed，已登录账号没有该操作的权限点带 data.reason=admin_permission_denied（BR-ID-34）
    action: 不跳登录，仅提示（带 reason 取子键文案）；h5_read_only：H5 SDK 丢弃内存里的令牌，这次请求按普通失败处理、不自动重发，用户再次操作时重新取令牌（规划/03 §5.4）；后台两个 reason 都不跳登录，取子键文案
    retry: 否
    retry_kind: never
    data:
      reason: [h5_read_only, admin_ip_not_allowed, admin_permission_denied]
    sources: [BR-ID-01, BR-ID-07, BR-ID-32, BR-ID-34]
  - code: 10404
    http: 401
    meaning: refresh_token 失效，需重新登录
    action: 清会话，跳 Login
    retry: —
    retry_kind: not_applicable
    sources: [BR-ID-07]
  - code: 10405
    http: 403
    meaning: 客户端版本低于最低支持版本（data.min_supported_version；写接口默认受约束，例外见 BR-ID-01 细则「最低支持版本的接口层拦截」的接口表）；受限会话（scp=deletion_only）调用该细则「受限会话」表以外的接口同样返回本码，该端渠道没有配置最低版本时 data.min_supported_version 为空；过低版本的登录（受限登录）查不到已有账号时同样返回本码，带 data.reason=no_account（BR-ID-01 细则「受限会话」）
    action: 进入 ForceUpdate 全屏拦截页，按钮跳应用商店，另有隐私政策与注销两个次要入口；本机版本不低于 data.min_supported_version（或它为空）而会话是受限作用域的，不进入强更页，先刷新令牌，由用户重新操作；no_account：提示先更新（取子键文案），回到 ForceUpdate，没有建号；不重放原请求、不登记 pending_action；不写幂等记录，不结束未决幂等键（BR-ID-10 细则「敏感操作的幂等键」）
    retry: 否（升级后：键从未出现过结果未知的，由用户重新操作，是新请求；键已经结果未知的，发起页仍待确认，由用户确认或放弃上一笔，BR-ID-10 细则）
    retry_kind: never
    data:
      min_supported_version: ~
      reason: [no_account]
    sources: [BR-ID-01]
  - code: 20001
    http: 400
    http_also: [413, 415]
    meaning: 参数校验失败（data.fields；提醒目标价无效时 data.fields=[target_price]、data.reason=watch_target_invalid；昵称命中内容安全时 data.reason=nickname_sensitive；设备注册时 data.fields=[device_hash] 表示设备标识哈希格式不符或命中无效清单；后台登记或修改设备黑名单时 data.fields=[value]、data.reason=invalid_device_hash 表示该值命中无效设备哈希清单；手机号规范化后不是中国大陆 11 位手机号时 data.fields=[phone]、data.reason=phone_invalid，BR-ID-05 细则「手机号规范化」；后台上传平台标识被拒收时 data.fields=[file]、data.reason 为 icon_format_invalid（非 SVG / PNG、不能解析、PNG 边长不足 512px 或非透明底）、icon_too_large（超过 content.platform_icon.max_bytes）或 icon_svg_unconvertible（含样式表、复杂选择器、@ 规则、外部引用或超出转换上限，无法保真转换），后台发布缺来源登记的版本时 data.fields 列出所有缺的项（[source_url]、[downloaded_on]，两项都缺时为 [source_url, downloaded_on]），BR-TEXT-24 细则；加收藏时收藏数已达 favorites.max_per_user 为 data.reason=favorites_full，规划/01 F-PROD-12；后台对 reauth_mode=manual 的联盟账号发起 OAuth 重新授权时 data.fields=[union_account_id]、data.reason=manual_mode，表示该账号走手工录入凭据，与没有可更新站长凭据（不带 reason）区分，BR-ID-24 细则，编排裁定 D10-176；后台指派未归因订单时目标用户不能作为归属对象为 data.fields=[user_id]、data.reason 为 target_banned（已封禁）、target_deleting（注销中）或 target_deleted（已注销），BR-ATTR-31 细则「改归属的目标用户」，冻结账号可以指派；后台「消息模板」页（BR-TEXT-20 细则「短信渠道登记与后台渠道开关」，编排裁定 D10-335 ②）：开关推送或短信、或给不能发短信的编码登记短信时该渠道不能在后台开关或登记，data.fields=[push]、[sms] 或 [code]、data.reason=notify_channel_locked；保存短信登记时预览正文的变量与该编码在代码中定义的变量不一致，data.fields=[preview_text]、data.reason=notify_preview_vars_mismatch；SMS_CODE 的预览正文写的有效分钟数与 BR-ID-05 的有效期不一致，data.fields=[preview_text]、data.reason=notify_code_ttl_mismatch；后台月结批次写操作（BR-FUND-04，编排裁定 D10-436、D10-437、D10-440）：账单还在生成中或账单日任务没有结果时 data.fields=[bill_id]、data.reason=bill_not_ready；发起补充时该平台开关 credit.enabled 关闭为 data.fields=[platform]、data.reason=credit_disabled；发起补充时账单下还有任何 DRAFT 批次（同平台或别平台）为 data.fields=[bill_id]、data.reason=pending_draft，须先确认或驳回现有 DRAFT 再发起；继续 PARTIAL 批次时开关未全开为 data.fields=[batch_id]、data.reason=switches_off，当日资产快照未完成且未超时为 data.fields=[batch_id]、data.reason=snapshot_pending；后台差错单恢复处理（BR-FUND-22 ③，编排裁定 D10-468 ①、D10-469 ①）：差错单不是账户封禁申诉的 appeal_restore 时 data.fields=[recon_diff_id]、data.reason=restore_not_supported；受益人已注销时 data.fields=[recon_diff_id]、data.reason=restore_user_deleted，差错单走关单结案；后台差错单结案（编排裁定 D10-447 ②、D10-506，B2-09h 起校验）：不是 type=settle_amount_mismatch（source R1）的差错单带 outcome 时 data.fields=[outcome]；后台人工调账（BR-FUND-24）：关联单据不存在、差错单是 source R4（收款对账，BR-PAY-07）或提现单、注销单属于别的用户时 data.fields=[refs]、data.reason=adjust_ref_invalid；红冲的原单不是 APPROVED 或本身是红冲单时 data.fields=[reverses_adjust_id]、data.reason=reverse_not_allowed；目标用户已注销时 data.fields=[user_id] 或 [reverses_adjust_id]、data.reason=adjust_user_deleted；批准系统预填的 ACCOUNT_CLOSED 单时 available 不大于 0 为 data.fields=[adjust_id]、data.reason=adjust_no_balance，单据保持 PENDING；后台批准坏账核销（BR-FUND-12）：用户有冻结金额且开关开启时 data.fields=[id]、data.reason=writeoff_frozen_pending，候选单保持 PENDING；驳回提现单时有 pending / success / unknown 转账尝试为 data.fields=[withdrawal_id]、data.reason=reject_attempt_exists，付款方侧失败退回的单还没有可用查询结果为 reject_query_required，最近查询已成功为 reject_query_success，都不写任何东西；未知结果处置 adminResolveUnknownPayout：判成功而最近查询明确失败且账单没有成功行为 data.fields=[resolution]、data.reason=resolve_query_failed，实付时间不合法为 data.fields=[paid_at]、data.reason=resolve_paid_at_invalid，流水号已被占用为 data.fields=[channel_order_id]、data.reason=resolve_order_id_taken，会员没有已核实名为 data.fields=[withdrawal_id]、data.reason=resolve_identity_missing；判失败的条件不成立为 data.fields=[resolution]，距 T 不足 24 小时 data.reason=resolve_too_early，账单核验不了 resolve_bill_unverifiable，「订单不存在」确认不了 resolve_query_unverifiable，都不写任何东西）
    action: 在对应字段旁提示（带 reason 取子键文案）；device_hash 不向用户提示，客户端按 BR-ID-09 重新读取设备标识后再注册；invalid_device_hash、manual_mode 与 icon_format_invalid、icon_too_large、icon_svg_unconvertible、target_banned、target_deleting、target_deleted、notify_channel_locked、notify_preview_vars_mismatch、notify_code_ttl_mismatch、bill_not_ready、credit_disabled、pending_draft、snapshot_pending、switches_off、restore_not_supported、restore_user_deleted、adjust_ref_invalid、reverse_not_allowed、adjust_user_deleted、adjust_no_balance、writeoff_frozen_pending、reject_attempt_exists、reject_query_required、reject_query_success、resolve_query_failed、resolve_too_early、resolve_bill_unverifiable、resolve_query_unverifiable、resolve_paid_at_invalid、resolve_order_id_taken、resolve_identity_missing 只出现在后台接口，后台在该字段旁显示后台文案（BR-ID-31、BR-TEXT-24 细则），不进用户侧字典；favorites_full 轻提示、不弹窗
    retry: 否
    retry_kind: never
    data:
      fields: ~
      reason:
        - watch_target_invalid
        - nickname_sensitive
        - invalid_device_hash
        - phone_invalid
        - icon_format_invalid
        - icon_too_large
        - icon_svg_unconvertible
        - favorites_full
        - manual_mode
        - target_banned
        - target_deleting
        - target_deleted
        - notify_channel_locked
        - notify_preview_vars_mismatch
        - notify_code_ttl_mismatch
        - not_payer_side_case
        - writeoff_disabled
        - withdrawal_not_returned
        - transfer_attempts_mismatch
        - amount_mismatch
        - bill_not_ready
        - credit_disabled
        - pending_draft
        - snapshot_pending
        - switches_off
        - restore_not_supported
        - restore_user_deleted
        - adjust_ref_invalid
        - reverse_not_allowed
        - adjust_user_deleted
        - adjust_no_balance
        - writeoff_frozen_pending
        - reject_attempt_exists
        - reject_query_required
        - reject_query_success
        - resolve_query_failed
        - resolve_too_early
        - resolve_bill_unverifiable
        - resolve_query_unverifiable
        - resolve_paid_at_invalid
        - resolve_order_id_taken
        - resolve_identity_missing
        - resolve_order_id_other_order
        - resolve_order_id_mismatch
        - resolve_amount_mismatch
    sources:
      - BR-ID-05
      - BR-ID-09
      - BR-ID-25
      - BR-ID-39
      - BR-AI-23
      - BR-TEXT-13
      - BR-WDR-03
      - BR-WATCH-04
      - BR-ATTR-31
      - BR-WDR-23
      - BR-WDR-08
      - BR-TEXT-20
      - BR-FUND-04
      - BR-FUND-22
      - BR-FUND-24
