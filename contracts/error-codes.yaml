# JSBridge 专用码段，逐码定义在 规划/04 §9 与 contracts/bridge.schema.json（CT-03），HTTP 接口不返回。
ranges:
  - from: 90001
    to: 90500
    meaning: JSBridge 专用码段
    action: 由 H5 SDK 处理
    sources: [规划/03, 规划/04 §9]
