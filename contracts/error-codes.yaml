  - code: 20002
    http: 400
    meaning: 验证码错误；后台登录第二步的动态码错误带 data.reason=totp_invalid，首次绑定时的动态码错误带 data.reason=totp_bind_invalid（不绑定、不登录），这两种 reason 每次计入 BR-ID-34 的连续失败计数；后台 step-up 的短信验证码与动态码错误不带 reason（BR-ID-34）
    action: 提示重新输入；带 reason 时停在当前步骤、清空动态码输入框
    retry: 否
    retry_kind: never
    data:
      reason: [totp_invalid, totp_bind_invalid]
    sources: [BR-ID-05, BR-ID-34]
  - code: 20003
    http: 400
    meaning: 验证码已过期或已作废（含错满 5 次）
    action: 提示重新获取验证码
    retry: 否
    retry_kind: never
    sources: [BR-ID-05, BR-ID-34]
  - code: 20004
    http: 400
